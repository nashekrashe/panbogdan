name: Build staging site
on:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'build/**'
      - 'site-src/**'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/staging-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build published pages
        run: |
          bash build/build.sh
          node --check src/block.js
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site dist
          if ! git diff --cached --quiet; then
            git commit -m "Build staging site from current sources"
            git push origin HEAD:staging
          fi
