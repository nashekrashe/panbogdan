name: Children guide - verify and build staging

on:
  push:
    branches: [redesign]
    paths:
      - ".github/workflows/kids-staging.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --prefix build

      - name: Build site including prerender
        run: bash build/build.sh

      - name: All jsdom and calculation tests
        shell: bash
        run: |
          set -euo pipefail
          for n in 5 9 13 14 15 16 17; do
            NODE_PATH=build/node_modules node "tests/t$n.js"
          done
          node tests/mortval.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --prefix build playwright
          npx --prefix build playwright install --with-deps chromium

      - name: Check responsive children page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory site >/tmp/panbogdan-http.log 2>&1 &
          sleep 3
          NODE_PATH=build/node_modules node tests/kids-viewport.js http://127.0.0.1:8765/dzieci.html

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: children-320-1440
          path: dist/kids-screenshots/
          if-no-files-found: ignore

      - name: Commit built site and deploy staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m "Build: generated children guide site"
          fi
          git push origin HEAD:redesign HEAD:staging
