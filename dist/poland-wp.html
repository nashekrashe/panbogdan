рава: беларуские действуют 6 месяцев после ВНЖ\",\"#pl-auto\"]]},{id:\"pmzhw\",n:\"Подал на ПМЖ\",next:[[\"Сохрани UPO и zaświadczenie из MOS: с ними ты легален до решения\",\"#pl-legal\",\"s:pmzh4\"],[\"Посчитай, сколько ждёшь ПМЖ, в «Своё»\",\"#\",\"f:pmzhFiled\"],[\"Проверь срок паспорта. Истёк: беларусам дают polski dokument podróży\",\"#pl-legal\",\"f:passExp\"]]},{id:\"pmzh\",n:\"Есть ПМЖ\",next:[[\"Посчитай дату, с которой можно на гражданство\",\"#pl-legal\",\"f:staly\"],[\"Готовь доход и жильё на бумаге: их проверят\",\"#pl-legal\",\"s:paszport3\"],[\"Следи за законом о гражданстве: сроки хотят увеличить\",\"#pl-news\"]]},{id:\"pass\",n:\"Иду на паспорт\",next:[[\"Uznanie у воеводы: 1000 zł, решение по закону за 6 месяцев\",\"#pl-legal\",\"s:paszport4\"],[\"Проверь, что выездов дольше 6 месяцев не было\",\"#pl-legal\",\"t\"],[\"Расскажи своим, когда получишь: это праздник\",\"#help\"]]},{id:\"citizen\",n:\"Есть паспорт\",next:[[\"Сделай dowód osobisty: очередь та же, но теперь ты в ней как гражданин\",\"#pl-legal\",\"s:paszport5\"],[\"Сходи на выборы: теперь в твоих проблемах можно винить и себя\",\"#pl-news\"],[\"Помоги новеньким: теперь ты тот самый знакомый, который всё знает\",\"#help\"]]}],j=[{d:\"06.11.2026\",tag:\"Налоги\",h:\"PIT с 2027: три ставки вместо двух, если подпишет президент\",t:\"Сейм 5 ноября и Сенат без поправок приняли новую шкалу: 12% до 130 000 zł дохода в год, 24% от 130 000 до 150 000 zł, 32% сверх. В том же законе ryczałt только при выручке до 250 тысяч евро вместо 2 млн, а danina solidarnościowa растёт с 4% до 5%. У президента 21 день, опубликовать закон надо до конца ноября. PIT за 2026 год в любом случае считается по старой шкале.\",u:\"https://www.money.pl/podatki/zmiany-w-podatkach-senat-zdecydowal-teraz-czas-na-ruch-prezydenta-7348086529518048a.html\",s:\"money.pl\",u2:\"https://biznes.wprost.pl/twoj-portfel/12495919/zmiany-podatkowe-w-rekach-prezydenta-co-zrobi-karol-nawrocki.html\",s2:\"wprost.pl\"},{d:\"28.10.2026\",tag:\"Проект\",h:\"Гражданство: B2, тест и декларация лояльности\",t:\"MSWiA внесло проект в план работ правительства. Польский нужен на B2 вместо B1, тест о Польше обязателен, плюс декларация лояльности и доказательства, что центр жизни в Польше, например налоговое резидентство. Ещё минимальный доход и право на жильё. Упрощённое восстановление гражданства (art. 38) оставят до 31.12.2030. Правительство хочет принять проект в IV квартале 2026, потом его рассмотрит Сейм. Пока действуют старые правила.\",u:\"https://www.money.pl/gospodarka/zainteresowanie-obywatelstwem-polskim-rosnie-rzad-chce-zmian-7344845081319520a.html\",s:\"money.pl\"},{d:\"15.09.2026\",tag:\"Деньги\",h:\"Минималка 2027: 4 950 zł brutto\",t:\"Правительство утвердило минимальную зарплату на 2027 год: 4 950 zł brutto в месяц вместо 4 806, почасовая ставка на zleceniu 32,30 zł. Распоряжение вышло в Dz.U. 2026 poz. 1213 и действует с 1 января 2027. От минималки считается и ZUS владельца JDG, так что взносы тоже подрастут.\",u:\"https://ksiegowosc.infor.pl/wiadomosci/7656496,minimalne-wynagrodzenie-w-2027-r-netto-i-brutto-czy-pracodawca-moze-wyrownac-premia-do-kwoty-minimalnego-wynagrodzenia.html\",s:\"infor.pl\",u2:\"https://www.podatki.biz/artykuly/maly-zus-2027-wyzsze-wynagrodzenie-minimalne-to-takze-wyzsze-skladki_34_63635.htm\",s2:\"podatki.biz\"},{d:\"24.08.2026\",tag:\"Сроки\",h:\"Протест иностранцев у Мазовецкого ужонда\",t:\"По закону решение по ВНЖ должно быть за 60 дней, а ждут до двух лет. Иностранцы вышли к Мазовецкому ужонду. Средний срок по ВНЖ на Мазовше вырос до 394 дней, в 2023 году было 153.\",u:\"https://warszawa.naszemiasto.pl/mieli-czekac-60-dni-a-czekaja-nawet-2-lata-tlum-obcokrajowcow-wyszedl-na-ulice-warszawy-urzad-milczy-moge-stracic-prace/ar/c1p2-29291631\",s:\"naszemiasto.pl\"},{d:\"10.08.2026\",tag:\"Сроки\",h:\"Карту побыту печатают дольше двух месяцев\",t:\"UdSC предупредил: заявлений стало намного больше, поэтому выдача новой карты побыту и обмен старой теперь занимают больше двух месяцев. То же с Genewskim dokumentem podróży. Решение уже есть, а пластика ещё нет. Классика.\",u:\"https://www.gov.pl/web/udsc/aktualnosci-udsc\",s:\"gov.pl/web/udsc\"},{d:\"01.08.2026\",tag:\"Цифры\",h:\"133 тысячи беларусов с документами в Польше\",t:\"UdSC: на 1.08.2026 документы на пребывание есть у 133 057 беларусов. 77 694 на временном ВНЖ, 41 249 на ПМЖ, 9 902 с дополнительной защитой. Polski dokument podróży в 2026 году до августа получили 4 305 беларусов, к концу года UdSC ждёт больше 7 тысяч. В феврале с документами было 142 737 человек.\",u:\"https://www.gov.pl/attachment/7089372c-4050-4051-80ad-a7983a4353dc\",s:\"gov.pl, UdSC\"},{d:\"27.07.2026\",tag:\"Сроки\",h:\"MSWiA: где ВНЖ дают быстрее всего\",t:\"Ответ на интерпелляцию 18089: на 6.07.2026 ВНЖ быстрее всего в Małopolskie, 242 дня, дольше всего в Śląskie, 658. На Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",u:\"https://api.sejm.gov.pl/sejm/term10/interpellations/18089/reply/DWDJHZ/body\",s:\"sejm.gov.pl\"},{d:\"06.07.2026\",tag:\"Сроки\",h:\"Поморское: 598 дней на ВНЖ\",t:\"По данным MSWiA, в Pomorskie на временный ВНЖ в среднем уходит 598 дней. Дольше только в Śląskie, 658. Гданьск, мы тебя любим, но это много.\",u:\"https://dziennikbaltycki.pl/cudzoziemcy-czekaja-miesiacami-na-legalizacje-pobytu-a-nadchodzi-kolejna-fala-wnioskow-wojewodztwo-pomorskie-ma-problem/ar/c1p2-29401689\",s:\"dziennikbaltycki.pl\"},{d:\"01.07.2026\",tag:\"Беларусам\",red:1,h:\"Polski dokument podróży по упрощённым правилам до 31.12.2026\",t:\"MSWiA продлило упрощённую выдачу polskiego dokumentu podróży dla cudzoziemca гражданам Беларуси до 31 декабря 2026. Это замена паспорту, если свой истёк, а в посольство нельзя. По упрощённым правилам подать надо до конца года.\",u:\"https://www.mos.cudzoziemcy.gov.pl/artyku-y/ulatwienia-dla-obywateli-bialorusi-dotyczace-wydawania-polskich-dokumentow-podrozy-dla-cudzoziemca-przedluzenie-do-31-grudnia-2026-r/\",s:\"mos.cudzoziemcy.gov.pl\"},{d:\"01.07.2026\",tag:\"Дети\",red:1,h:\"Dobry Start 300 zł: заявка до 30 ноября\",t:\"300 zł раз в год на каждого ребёнка, который учится, до 20 лет (с инвалидностью до 24). С 2026/2027 иностранцы не из ЕС, ЕАСТ и Великобритании должны показать работу или другую активность в месяце перед подачей. Подаётся только онлайн: mZUS, PUE ZUS, банк или Emp@tia. Приём до 30.11.2026.\",u:\"https://www.zus.pl/en/-/wakacyjne-zakupy-300-z%C5%82-mo%C5%BCe-si%C4%99-przyda%C4%87.-ruszy%C5%82y-wyp%C5%82aty-z-programu-dobry-start\",s:\"zus.pl\",u2:\"https://bank.pl/?p=553691\",s2:\"bank.pl\"},{d:\"01.06.2026\",tag:\"Дети\",h:\"800+ для иностранцев только при работе\",t:\"С 1 июня иностранцам 800+ платят, только если родитель работает или у него есть другая активность. Ребёнок должен учиться в Польше, кроме детей до 6 лет.\",u:\"https://finanse.wp.pl/zmiany-dla-cudzoziemcow-od-1-czerwca-zus-wyjasnia-7292105621981504a\",s:\"wp.pl\"},{d:\"13.05.2026\",tag:\"Проект\",h:\"Гражданство не раньше чем через 8 лет\",t:\"MSWiA готовит новые правила: минимум 8 лет легально в Польше, из них 3 года на временном ВНЖ и 5 на ПМЖ. Плюс тест и высокий уровень польского.\",u:\"https://forsal.pl/kraj/aktualnosci/artykuly/11246150,dla-kogo-polskie-obywatelstwo-mswia-przygotowuje-zmiany-w-prawie.html\",s:\"forsal.pl\"},{d:\"12.05.2026\",tag:\"Проект\",h:\"ВНЖ «молчаливым согласием», но не для беларусов\",t:\"Проект UD408: временный ВНЖ дают сам собой, если за 60 дней нет решения. Только для граждан стран с безвизом в ЕС, Беларусь в их число не входит. Правительство планировало принять проект в III квартале 2026.\",u:\"https://www.gov.pl/web/premier/projekt-ustawy-o-zmianie-ustawy-o-cudzoziemcach\",s:\"gov.pl\"},{d:\"27.04.2026\",tag:\"Закон\",red:1,h:\"MOS 2: заявления только онлайн\",t:\"Заявления на ВНЖ, ПМЖ и rezydenta UE подаются только через MOS. Красный штамп в паспорте заменило zaświadczenie. Старый портал закрыли 17.04.2026 вместе с аккаунтами.\",u:\"https://zielonalinia.gov.pl/mos-czyli-elektroniczne-skladanie-niektorych-wnioskow-pobytowych/\",s:\"zielonalinia.gov.pl\"},{d:\"05.03.2026\",tag:\"Закон\",h:\"Пошлину при отказе больше не вернут\",t:\"При отказе или прекращении дела opłatę skarbową больше не возвращают. Проверь документы до подачи, а не после.\",u:\"https://www.gov.pl/web/uw-warminsko-mazurski/oplaty\",s:\"gov.pl\"},{d:\"09.01.2026\",tag:\"Закон\",h:\"Сейм отклонил 10 лет до гражданства\",t:\"Сейм отклонил проект о 10 годах на ПМЖ перед гражданством. Пока действуют старые правила.\",u:\"https://grantthornton.pl/publikacja/zatrudnianie-cudzoziemcow-2026-sejm-odrzucil-zmiany-w-obywatelstwie/\",s:\"grantthornton.pl\"},{d:\"04.12.2025\",tag:\"Банки\",h:\"PKO отключает банкинг беларусам без карты побыту\",t:\"Беларусы без карты побыту, которые открыли счёт после 24.10.2025, теряют онлайн-банкинг, BLIK и карту. Основание: санкционный регламент ЕС 2025/2041.\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",s:\"pkobp.pl\"},{d:\"01.08.2025\",tag:\"Закон\",h:\"Гражданство подорожало\",t:\"Новые пошлины: 1 000 zł за uznanie у воеводы, 1 669 zł за nadanie.\",u:\"https://www.gov.pl/web/uw-lubelski/obywatelstwo-i-repatriacja\",s:\"gov.pl\"},{d:\"01.07.2024\",tag:\"Авто\",h:\"Машины на беларуских номерах в ЕС не пускают\",t:\"Авто на беларуских номерах нельзя ввозить в ЕС. Исключение: личная машина, владелец за рулём или в салоне, у него виза или ВНЖ.\",u:\"https://www.gov.pl/web/kas/nowe-zasady-przywozu-samochodow-osobowych-zarejestrowanych-na-bialorusi\",s:\"gov.pl/web/kas\"}].sort(function(a,t){var e=function(a){var t=a.split(\".\");return t[2]+t[1]+t[0]};return e(t.d)\u003ce(a.d)?-1:1}),S={vnzh:{tab:\"ВНЖ\",code:\"01 · Karta pobytu czasowego\",title:\"Временный вид на жительство\",sub:\"До 3 лет. Продлевается, пока не надоест.\",irony:\"Самый длинный квест игры. Сохраняйся чаще.\",fees:[[\"Работа\",\"440 zł\"],[\"Другое\",\"340 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",s:\"От него зависит всё остальное\",b:[\"Работа (jednolite zezwolenie na pobyt i pracę), бизнес (JDG или sp. z o.o.), учёба, семья или Karta Polaka. Основание должно быть реальным на момент подачи и дожить до решения.\"],docs:[\"Договор с работодателем или документы бизнеса\",\"Справка из вуза, если учёба\",\"Документы о браке или родстве, если семья\"],warn:\"Потерял работу: письменно сообщи воеводе в течение 15 рабочих дней. Тогда у тебя есть 30 дней на новую работу, и ВНЖ не отзовут.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-jednolite-wazny-obowiazek-cudzoziemca/\",\"zielonalinia.gov.pl\"]]},{t:\"PESEL и profil zaufany\",s:\"Без подписи MOS не пустит\",b:[\"С 27.04.2026 заявление подаётся только онлайн через MOS 2. Подписать его можно профилем zaufany, квалифицированной подписью или podpisem osobistym, но он есть только в польском e-dowodzie. Иностранцу обычно остаётся profil zaufany.\",\"PESEL при визе или временном ВНЖ дают только по заявлению, где указано, зачем он нужен. Это бесплатно, подаётся в urzędzie gminy, работодатель за тебя подать не может. Дальше profil zaufany проще всего сделать через свой банк.\"],docs:[\"PESEL\",\"Profil zaufany\",\"Почта, которую ты правда читаешь\"],src:[[\"https://www.gov.pl/web/udsc/mos-qa\",\"gov.pl/web/udsc\"],[\"https://zielonalinia.gov.pl/kiedy-cudzoziemiec-moze-uzyskac-numer-pesel/\",\"zielonalinia.gov.pl\"]]},{t:\"Заполнить и отправить в MOS\",s:\"UPO храни как паспорт\",b:[zt(\"vnzh\")],src:[[\"https://www.mos.cudzoziemcy.gov.pl/ru/kak-nachat/\",\"MOS, как начать\"],[\"https://www.mos.cudzoziemcy.gov.pl/ru/najczesciej-pope-niane-b-edy/\",\"MOS, частые ошибки\"]],docs:[\"Скан всех страниц паспорта\",\"Фото\",\"Пошлина 440 zł (работа) или 340 zł (другое)\",\"Страховка: ZUS или частная\",\"Подтверждение жилья\",\"Załącznik nr 1 от работодателя\"],warn:\"Подать нужно, пока ты легален. Если MOS лежит в твой последний день, есть 3 рабочих дня после восстановления. С 5.03.2026 при отказе пошлину не возвращают.\"},{t:\"Вызов на отпечатки\",s:\"Записаться нельзя, жди письмо\",b:[\"Воевода сам назначит дату. На месте: отпечатки, образец подписи, оригинал паспорта и, возможно, braki formalne. После проверки в MOS появится zaświadczenie, оно заменило старый красный штамп.\"],docs:[\"Оригинал паспорта\",\"Wezwanie\",\"Оригиналы приложенных документов\"],tip:\"Zaświadczenie подтверждает легальное пребывание, но по Шенгену с ним не ездят.\"},{t:\"Ждать\",s:\"Таймер ниже\",b:['По закону решение за 60 дней. На деле сроки приостановлены до 4.03.2027 (art. 100d), а в среднем ждут \u003cb data-bind=\"wait\"\u003e\u003c/b\u003e \u003cspan data-bind=\"dayword\"\u003e\u003c/span\u003e \u003cspan data-bind=\"loc\"\u003e\u003c/span\u003e.'],docs:[\"UPO и zaświadczenie\",\"Вся переписка с ужондом\",\"Ответы на braki в срок из письма\"],warn:\"Выезд из Польши без действующей карты или визы: обратно могут не пустить.\"},{t:\"Децизия и карта\",s:\"Пластик отдельно и позже\",b:[\"Сначала decyzja, потом карта. За карту 100 zł. Карта временного пребывания выдаётся на срок до 3 лет.\",'\u003cspan data-bind=\"cityNote\"\u003e\u003c/span\u003e'],docs:[\"Оплатить 100 zł за карту\",\"Паспорт\",\"Decyzja\"]}]},pmzh:{tab:\"ПМЖ\",code:\"02 · Stały pobyt / Rezydent UE\",title:\"Постоянный вид на жительство\",sub:\"Бессрочно. Пластик меняется, статус остаётся.\",irony:\"Ачивка: больше не надо продлевать каждые три года.\",fees:[[\"Rezydent UE / stały\",\"640 zł\"],[\"Karta Polaka\",\"0 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",p:{rd:{s:\"Rezydent długoterminowy UE\",b:[\"5 лет легально и без перерывов прямо перед подачей, стабильный доход за последние 3 года, медстраховка, жильё и польский B1.\"]},kp:{s:\"Stały pobyt по Karcie Polaka\",b:[\"Нужны действующая Karta Polaka и намерение жить в Польше постоянно. Стаж в Польше не нужен, пошлины за заявление нет.\"]},orig:{s:\"Stały pobyt по происхождению\",b:[\"Родитель, дед или бабушка либо двое прадедов польской национальности, ты сохраняешь польскость и собираешься жить в Польше постоянно.\"]},mar:{s:\"Stały pobyt по браку\",b:[\"Брак с гражданином Польши не меньше 3 лет, и прямо перед подачей не меньше 2 лет непрерывно в Польше на ВНЖ по браку или со статусом защиты.\"]},prot:{s:\"Stały pobyt после защиты\",b:[\"5 лет непрерывно в Польше со статусом беженца, ochroną uzupełniającą или zgodą na pobyt humanitarny прямо перед подачей.\"]},kid:{s:\"Stały pobyt для ребёнка\",b:[\"Ребёнок гражданина Польши под его родительской властью. Или ребёнок иностранца с ПМЖ, родившийся после того, как родитель получил ПМЖ, или во время его ВНЖ.\"]}},src:[[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-195/\",\"art. 195\"],[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-211/\",\"art. 211\"]]},{t:\"Проверить срок\",p:{rd:{s:\"5 лет, выезды 6 и 10 месяцев\",b:[\"Один выезд не дольше 6 месяцев, все вместе не больше 10 месяцев за 5 лет. Учёба засчитывается наполовину, делегирование и некоторые визы не засчитываются. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\",\"Прежние решения, карты и визы за 5 лет\"],tip:\"Командировки от польского работодателя в лимит не входят, но их надо подтвердить.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue-a-piecioletni-pobyt/\",\"zielonalinia.gov.pl\"]]},mar:{s:\"3 года брака, 2 года здесь\",b:[\"Считаются 2 года непрерывно прямо перед подачей. Перерывы те же: один выезд до 6 месяцев, все вместе до 10.\"],docs:[\"Решения о ВНЖ по браку за 2 года\",\"Список выездов с датами\"]},prot:{s:\"5 лет со статусом\",b:[\"Считаются 5 лет непрерывно прямо перед подачей, время процедуры о защите тоже. Перерывы: один выезд до 6 месяцев, все вместе до 10. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\"]},_:{s:\"Срок не нужен\",b:[\"Для этого основания стаж в Польше не требуется. Главное подать, пока ты здесь легально.\"]}}},{t:\"Польский\",p:{rd:{s:\"B1 или польский диплом\",b:[\"Подходит государственный сертификат B1 или выше, świadectwo польской школы в Польше, диплом вуза с обучением на польском или школа за границей с польским языком обучения. Policealna не подходит. С детей до 16 лет не требуют.\"],docs:[\"Сертификат B1 (certyfikatpolski.pl) или польский аттестат либо диплом\"]},_:{s:\"Сертификат не нужен\",b:[\"Для stały pobyt сертификат польского не требуют. В ужонде, правда, всё равно говорят по-польски.\"]}}},{t:\"Собрать документы\",p:{rd:{s:\"Доход, жильё, страховка\",b:[\"Доход за 3 года и сейчас: выше 1 010 zł netto в месяц на одного или выше 823 zł на каждого члена семьи. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"PIT-11 от всех работодателей и годовые PIT с UPO за 3 года\",\"ZUS RMUA или справка из ZUS\",\"Договоры, аннексы и świadectwa pracy\",\"Свежая справка от работодателя\",\"Для JDG: документы о доходах фирмы\",\"Страховка: ZUS (NFZ) или частный полис на лечение в Польше\",\"Договор аренды или акт нотариальный. Umowę użyczenia обычно не принимают, кроме как от семьи\",\"Свидетельства о браке и рождении, если в деле есть семья\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/uw-podlaski/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"gov.pl/web/uw-podlaski\"]]},kp:{s:\"Karta Polaka и бумаги\",b:[\"Список Любуского ужонда, в других воеводствах может отличаться. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Karta Polaka: оригинал покажешь на отпечатках\",\"Oświadczenie o pochodzeniu (бланк на сайте ужонда)\",\"Документы о намерении жить в Польше постоянно\",\"Справка из urzędu skarbowego, что нет долгов по налогам\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/zezwolenie_na_pobyt_staly_-_Karta_Polaka\",\"bip.lubuskie.uw.gov.pl\"]]},orig:{s:\"Документы о предках\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Документы о польской национальности родителя, деда или бабушки либо двух прадедов\",\"Подтверждения, что ты сохраняешь польскость\",\"Документы о намерении жить в Польше постоянно\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},mar:{s:\"Брак на бумаге\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Актуальный польский odpis aktu małżeństwa\",\"Документ о гражданстве супруга\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},prot:{s:\"Решения о статусе\",b:[\"Если паспорта нет и получить его нельзя, в обоснованных случаях принимают другой документ личности.\"],docs:[\"Паспорт или другой документ личности\",\"Фото в цифровом виде\",\"Решения о статусе защиты\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},kid:{s:\"Бумаги ребёнка и родителя\",b:[\"Заявление за ребёнка заполняет и подписывает родитель.\"],docs:[\"Паспорт ребёнка: скан всех страниц\",\"Фото в цифровом виде\",\"Свидетельство о рождении\",\"Документ о гражданстве или ПМЖ родителя\",\"Паспорт родителя\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]}}},{t:\"Подать в MOS\",p:{kp:{s:\"Без пошлины, и снова тот же ужонд\",docs:[\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"]},_:{s:\"640 zł и снова тот же ужонд\",docs:[\"Пошлина 640 zł\",\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"],warn:\"С 5.03.2026 при отказе пошлину не возвращают.\"}},b:[\"Только онлайн через MOS 2, аккаунт заводится заново: старые закрыли 27.04.2026. Подай не позже последнего дня легального пребывания. Если в заявлении нет недостатков или ты исправил их в срок, ты здесь легально до решения.\",zt(\"pmzh\"),\"Когда ужонд проверит заявление, в MOS появится zaświadczenie вместо штампа.\"],src:[[\"https://www.mos.cudzoziemcy.gov.pl/ru/kak-nachat/\",\"MOS, как начать\"],[\"https://www.mos.cudzoziemcy.gov.pl/ru/najczesciej-pope-niane-b-edy/\",\"MOS, частые ошибки\"],[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/procedury/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"migrant.poznan.uw.gov.pl\"]]},{t:\"Отпечатки и карта\",s:\"Больше не продлевать каждые 3 года\",b:['Вызов придёт сам: отпечатки в \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e, образец подписи, оригинал паспорта и оригиналы документов. Да, опять.',\"По закону решение за 6 месяцев. На деле дольше: на Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",\"Статус бессрочный, меняется только пластик.\"],docs:[\"Wezwanie\",\"Оригинал паспорта\",\"Оригиналы приложенных документов\",\"Decyzja\"]}]},paszport:{tab:\"Паспорт\",code:\"03 · Obywatelstwo\",title:\"Гражданство\",sub:\"Финальный босс. Обычно около восьми лет с приезда.\",irony:\"Правила игры могут поменять прямо во время игры.\",fees:[[\"Uznanie\",\"1000 zł\"],[\"Nadanie\",\"1669 zł\"]],steps:[{t:\"Выбрать путь\",s:\"Воевода или президент\",b:[\"Uznanie: решает воевода по закону, срок 6 месяцев с подачи, отказ можно обжаловать.\",\"Nadanie: решает президент, без условий по стажу и без срока рассмотрения, обжаловать нельзя.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]]},{t:\"Отсидеть срок\",s:\"3 года, 2 или 1\",b:[\"На ПМЖ или rezydencie UE: 3 года при доходе и жилье; 2 года, если ты не меньше 3 лет в браке с гражданином; 1 год, если ПМЖ получен по Karcie Polaka или польскому происхождению. Есть и путь через 10 лет легального пребывания.\",\"Пребывание должно быть непрерывным: длинные выезды могут обнулить счётчик.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]],docs:[\"Карта stały pobyt или rezydent UE\",\"Нет выездов дольше 6 месяцев\"]},{t:\"B1\",s:\"Тот же сертификат\",b:[\"Нужен официальный сертификат B1 или школьный аттестат из Польши или польской школы за границей. Если уже сдавал для ПМЖ, второй раз не нужно.\"],docs:[\"Państwowy certyfikat B1 или польский аттестат\"]},{t:\"Доход и жильё\",s:\"Романтика закончилась\",b:[\"Стабильный доход и законное жильё на бумаге.\"],docs:[\"Договор, справка или PIT\",\"Umowa najmu или akt własności\"]},{t:\"Подать заявление\",s:\"1000 zł или 1669 zł\",b:['С 1.08.2025: uznanie 1000 zł, nadanie 1669 zł. Заявление на uznanie подаётся воеводе: \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e.',\"Пошлину платят переводом. Счёт смотри на странице оплат своего ужонда, ссылка «пруф» в карточке «Твой ужонд» вверху раздела.\"],docs:[\"Wniosek\",\"Пошлина\",\"Биография, если nadanie (по желанию)\",\"Фото 35 × 45 мм, 1 штука\"]},{t:\"Паспорт и dowód\",s:\"Финальный босс\",b:[\"Дальше dowód osobisty и паспорт. Добро пожаловать в очередь, на этот раз гражданскую.\"],docs:[\"Решение\",\"Фото\",\"Заявление на dowód\"]}]}},x=[\"vnzh\",\"pmzh\",\"paszport\"],P=[[\"rd\",\"Rezydent UE: 5 лет в Польше\"],[\"kp\",\"Karta Polaka\"],[\"orig\",\"Польское происхождение\"],[\"mar\",\"Брак с гражданином Польши\"],[\"prot\",\"Беженец, ochrona uzupełniająca, zgoda humanitarna\"],[\"kid\",\"Ребёнок гражданина или владельца ПМЖ\"]],L={todo:\"prog\",prog:\"done\",done:\"todo\"},E={todo:\"to-do\",prog:\"в процессе\",done:\"готово\"},U=\"M3.75 9L7.25 12.375L14.25 5.625\",A=[{ic:\"luggage\",t:\"Документ Подружи\",s:\"Polski dokument podróży dla cudzoziemca\",b:[\"Польская замена паспорту, если свой истёк, потерян, испорчен или его никогда не было, а в посольство нельзя. Подтверждает личность и гражданство, по нему можно много раз пересекать границу. Действует 1 год. Это не польский паспорт и не гражданство, и он не отменяет попыток получить свой паспорт.\",\"Кому: беларусам с ВНЖ на любом основании, ПМЖ, rezydentem UE, гуманитаркой или ochroną uzupełniającą. Доказывать, что в Беларуси паспорт не получить, не надо. По упрощённым правилам заявление надо подать до 31.12.2026. Для беларусов бесплатно, обычная цена 350 zł.\",'\u003cdiv class=\"pl-acc\"\u003e\u003cdetails\u003e\u003csummary\u003e\u003cspan class=\"t\"\u003eПолный список документов\u003c/span\u003e'+$a(\"expand_more\",\"chev\")+'\u003c/summary\u003e\u003cdiv class=\"body\"\u003e\u003cdiv class=\"pl-checks pl-docs\"\u003e'+[\"\u003cb\u003eWniosek o wydanie/wymianę polskiego dokumentu podróży dla cudzoziemca\u003c/b\u003e, 1 экземпляр. Бланк на сайте ужонда или в MOS.\",\"\u003cb\u003e2 биометрические фотографии\u003c/b\u003e как на польский паспорт, не старше 6 месяцев, подписанные.\",\"\u003cb\u003eКопия документа личности\u003c/b\u003e, например истёкшего паспорта. Оригинал показать.\",\"\u003cb\u003eКопия карты побыту.\u003c/b\u003e\",\"\u003cb\u003eПодтверждение meldunku\u003c/b\u003e, постоянного или временного.\",\"\u003cb\u003eOświadczenie о ВНЖ\u003c/b\u003e, если он не гуманитарный (не art. 186 ust. 1 pkt 9): какой орган дал и дата решения. Бланк у ужонда. UdSC советует рубрику D в бланке не отмечать, а приложить это oświadczenie.\",\"\u003cb\u003eДокументы, которые подтверждают данные из бланка.\u003c/b\u003e Документы на чужом языке с переводом присяжного.\",\"Если на фото головной убор по религии: \u003cb\u003eoświadczenie o przynależności do wspólnoty wyznaniowej\u003c/b\u003e.\",\"Квитанция об оплате не нужна: беларусы освобождены.\"].map(function(a,t){var e=St(a,\"by\");return e.info=jt(a,\"by\"),xt(e,a,\"\",\"pdpc\"+t)}).join(\"\")+'\u003c/div\u003e\u003cp\u003e\u003cb\u003eКак.\u003c/b\u003e Подать лично в ужонде или по почте. Забирать лично, с документом личности и прошлым dokumentem podróży, если он был. Получил свой паспорт или польское гражданство: верни документ в ужонд в течение 14 дней.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003e\u003cspan class=\"t\"\u003eСроки по воеводствам\u003c/span\u003e'+$a(\"expand_more\",\"chev\")+'\u003c/summary\u003e\u003cdiv class=\"body\"\u003e\u003cp\u003e\u003cb\u003eТвой ужонд, \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e:\u003c/b\u003e \u003cspan data-o=\"pdpcUw\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cul class=\"pl-list\" data-o=\"pdpcAll\"\u003e\u003c/ul\u003e\u003cp class=\"pl-note\"\u003eСрок считают с момента, когда у ужонда полный комплект документов.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003c/div\u003e'],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/polski-dokument-podrozy-dla-obywateli-bialorusi\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/udsc/ulatwienia-dla-obywateli-bialorusi-dotyczace-wydawania-polskich-dokumentow-podrozy-dla-cudzoziemca---przedluzenie-do-31-grudnia-2026-r\",\"gov.pl/web/udsc\"],[\"https://www.mos.cudzoziemcy.gov.pl/kategorie-informacji/dokumenty/dokumenty-op3/pdpc/\",\"mos.cudzoziemcy.gov.pl\"],[\"https://migrant.wsc.mazowieckie.pl/pl/procedury/polski-dokument-podrozy\",\"migrant.wsc.mazowieckie.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/checklist/1356\",\"migrant.poznan.uw.gov.pl\"],[\"https://www.pomocprawna.org/polski-dokument-podrozy-dla-cudzoziemca\",\"pomocprawna.org\"]],checked:\"17.11.2026\"},{ic:\"account_balance\",t:\"Банки и санкции\",s:\"Счета, карты, происхождение денег\",b:[\"Санкции ЕС (регламент 2025/2041): если у тебя нет карты побыту и счёт открыт после 24.10.2025, банк отключает онлайн-банкинг, BLIK и карту. Счётом можно пользоваться только в отделении. Решение: показать в банке карту побыту или другой документ на пребывание.\",\"Держи документы о происхождении денег: банки обязаны проверять крупные поступления, и без бумаг перевод могут остановить.\"],src:[[\"https://www.pkobp.pl/aktualnosci/informacj :\"mBank\",s:3,t:\"Счёт по паспорту. Карту побыту могут попросить в отдельных случаях. Если в паспорте нет PESEL и адреса, нужен документ с ними.\",d:\"2026\",u:\"https://www.mbank.pl/indywidualny/konta/pytania-i-odpowiedzi/dokumenty-potwierdzajace-tozsamosc/\",src:\"mbank.pl\"},{n:\"Pekao\",s:3,t:\"Беларусам счёт открывают. Подходит паспорт, карта побыту или TZTC.\",d:\"2022\",u:I,src:\"rp.pl\"},{n:\"Credit Agricole\",s:2,t:\"Открывали беларусам и до войны. Нужен документ и подтверждение легального пребывания.\",d:\"2022\",u:I,src:\"rp.pl\"},{n:\"BNP Paribas\",s:2,t:\"Только если не живёшь и не платишь налоги в Беларуси. Нужна карта побыту или паспорт с Картой поляка или гуманитарной визой.\",d:\"2022\",u:I,src:\"rp.pl\"},{n:\"Erste\",s:2,t:\"Бывший Santander. Счёт иностранцу открывают в отделении: паспорт и подтверждение легального пребывания (карта побыту с PESEL, справка с работы, студенческий или документ о собственности). Могут спросить налоговый номер своей страны.\",d:\"9.01.2026\",u:\"https://www.erste.pl/bank-porad/konta/jak-zalozyc-konto-bankowe-dla-obcokrajowca\",src:\"erste.pl\"},{n:\"Alior\",s:1,t:\"Беларусь в списке стран высокого риска. На каждый счёт нужно отдельное согласие банка.\",d:\"2022\",u:I,src:\"rp.pl\"},{n:\"PKO BP\",s:1,t:\"Счёт открывают, но если он открыт после 24.10.2025 без карты побыту, нет приложения, BLIK и карты, пока не покажешь в отделении документ на пребывание.\",d:\"4.12.2025\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",src:\"pkobp.pl\"}],D={3:\"Свой\",2:\"С анкетой\",1:\"Строгий\"},O={a:2100,b:2e3,c:1e3,c0:.5,c1:.6,lim:.05},T={a:2e3,b:1700,c:600,c0:.6,c1:.74,lim:.026},N=2.5,Z=[\"uop\",\"zlec\",\"dzielo\",\"b2b\"],K={uop:{tab:\"Umowa o pracę\",code:\"UoP · Umowa o pracę\",t:\"Трудовой договор\",s:\"Полный ZUS, отпуск, больничный.\",i:\"Работодатель плачет, ты нет.\",fees:[[\"Минималка brutto\",\"4 806 zł\"],[\"На руки\",\"≈3 606 zł\"],[\"Отпуск\",\"20 или 26 дней\"]],more:[\"Отпуск 20 дней, после 10 лет стажа 26 (учёба засчитывается)\",\"Больничный L4 оплачивается\",\"Лучший вариант для ВНЖ и кредита\"]},zlec:{tab:\"Zlecenie\",code:\"Umowa zlecenie\",t:\"Договор поручения\",s:\"ZUS обычно есть, отпуска и больничных по закону нет.\",i:\"Свобода, но без выходных.\",fees:[[\"Минимум в час\",\"31,40 zł\"],[\"Студент до 26\",\"без ZUS\"]],more:[\"Студенты до 26 лет без ZUS\",\"Подходит как основание для ВНЖ\",\"Больничный только при добровольном chorobowe\"]},dzielo:{tab:\"Dzieło\",code:\"Umowa o dzieło\",t:\"Договор подряда\",s:\"За конкретный результат, а не за процесс. Без страховки и гарантий.\",i:\"Сделал, сдал, забыли друг друга.\",fees:[[\"ZUS\",\"0\"],[\"PIT\",\"12%\"]],more:[\"Нет страховки NFZ от этого договора\",\"Слабое основание для ВНЖ\",\"Налог 12% после KUP\"]},b2b:{tab:\"B2B\",code:\"B2B · JDG\",t:\"Своя фирма\",s:\"Своя działalność, счета клиентам, налоги и ZUS платишь сам.\",i:\"Ты сам себе отдел кадров и бухгалтерия.\",fees:[[\"ZUS\",\"от 0 до 1 927 zł\"],[\"Налог\",\"шкала, 19% или ryczałt\"]],more:[\"ZUS растёт по уровням, смотри ниже\",\"Форму налога выбирают раз в год\",\"Нужен бухгалтер или хороший сервис\"]}},W=[{id:\"skala\",w:\"uop zlec dzielo b2b\",ic:\"percent\",tag:\"Skala\",t:\"Шкала\",big:\"12 / 32%\",x:\"12% до 120 000 zł в год, 32% сверх. Kwota wolna 30 000 zł. Składka zdrowotna 9%.\",i:\"По умолчанию, если ничего не выбрал.\",more:[\"Для UoP и zlecenie всегда шкала\",\"До 26 лет ulga dla młodych: PIT 0 до 85 528 zł в год\",\"С супругом совместно можно, только если никто из вас не на liniowym и не на ryczałcie, см. карточку «С супругом»\"]},{id:\"kwota\",w:\"uop zlec dzielo\",ic:\"savings\",tag:\"Kwota wolna\",t:\"Без налога\",big:\"30 000\",x:\"zł дохода в год без PIT. С PIT-2 работодатель учитывает её сразу, по 300 zł в месяц.\",i:\"Единственные бесплатные деньги в Польше.\",more:[\"Без PIT-2 разницу вернут в годовом PIT\",\"На dzieło в месяц не учитывается, только в годовом PIT\"]},{id:\"ulga\",w:\"uop zlec\",ic:\"school\",tag:\"Ulga dla młodych\",t:\"До 26 лет\",big:\"85 528\",x:\"zł в год без PIT на umowie o pracę и zlecenie. ZUS и zdrowotna остаются.\",i:\"Молодость, которая окупается.\",more:[\"Действует до дня 26-летия\",\"На dzieło и B2B не действует\",\"Сверх лимита обычная шкала\"]},{id:\"kup\",w:\"dzielo\",ic:\"description\",tag:\"KUP\",t:\"Расходы без чеков\",big:\"20 / 50%\",x:\"Из суммы договора без налога вычитают 20%. За авторские права 50%, но не больше 120 000 zł в год.\",i:\"Творчество выгодно хотя бы для налога.\",more:[\"50% только если договор передаёт авторские права\",\"До 200 zł: 12% с суммы, без KUP\"]},{id:\"lin\",w:\"b2b\",ic:\"percent\",tag:\"Liniowy\",t:\"Линейный\",big:\"19%\",x:\"Только для JDG, без kwoty wolnej. Zdrowotna 4,9% от дохода.\",i:\"Для тех, кому 32% это слишком.\",more:[\"Выгоден примерно с дохода выше 120 000 zł\",\"Без совместного с супругом\",\"Расходы вычитаются\"]},{id:\"rycz\",w:\"b2b\",ic:\"percent\",tag:\"Ryczałt\",t:\"Ryczałt\",big:\"2–17%\",x:\"С выручки, расходы не вычитаются. Ставка по виду деятельности, в IT часто 12% или 8,5%.\",i:\"Чеки собирать не надо. Радость.\",more:[\"Zdrowotna фиксированная, по порогам выручки\",\"Ставку проверяй по своему PKD\",\"Выгоден при малых расходах\",\"Без совместного PIT с супругом, даже если супруг на etacie\",\"Ulga na dzieci с ryczałtu не вычитается, только с налога по шкале\"]},{id:\"malz\",w:\"uop zlec dzielo b2b\",ic:\"volunteer_activism\",tag:\"Wspólne rozliczenie\",t:\"С супругом\",big:\"½\",x:\"Доходы супругов складывают и делят пополам. Выгодно, если один зарабатывает сильно больше другого или второй не работает.\",i:\"Ловушка: ты на etacie, а у супруга JDG на ryczałcie или liniowym? Совместного PIT не будет, даже при нулевой выручке.\",more:[\"Нужна wspólność majątkowa\",\"Мешает liniowy или ryczałt у любого из супругов. Ryczałt с частной аренды не мешает\",\"Заявляется в годовом PIT, до 30 апреля\"]},{i
