ney\"},{k:\"bank\",p:\"banki\",id:\"pl-bank\",n:\"Банки\",ic:\"bank\"},{k:\"kids\",p:\"dzieci\",id:\"pl-kids\",n:\"Дети\",ic:\"baby\"},{k:\"home\",p:\"dom\",id:\"pl-home\",n:\"Дом\",ic:\"house\"},{k:\"auto\",p:\"auto\",id:\"pl-auto\",n:\"Авто\",ic:\"car\"},{k:\"help\",p:\"pomoc\",id:\"pl-help\",n:\"Хелп\",ic:\"help\"},{k:\"dict\",p:\"slownik\",id:\"pl-dict\",n:\"Словарь\",ic:\"voc\"}],w={\"pl-svoi\":\"help\",\"pl-life\":\"help\",\"pl-lyrics\":\"me\",\"pl-avg\":\"me\",\"pl-top\":\"me\",svoi:\"help\",life:\"help\"},b=[{id:\"arrive\",n:\"Только приехал\",next:[[\"Сделай PESEL и profil zaufany: без них не подписать заявление в MOS\",\"#pl-d-d30\"],[\"Выбери основание для ВНЖ и подай, пока виза или безвиз действуют\",\"#pl-legal\"],[\"Найди бесплатную юрпомощь своего города в разделе «Хелп»\",\"#help\"]]},{id:\"wait\",n:\"Подал, жду\",next:[[\"Сохрани UPO и следи за письмами: вызов на отпечатки придёт сам\",\"#pl-legal\"],[\"Посчитай, сколько ты уже ждёшь, в таймере ожидания\",\"#pl-legal\"],[\"Не уезжай из Польши без действующей карты или визы\",\"#pl-legal\"]]},{id:\"vnzh\",n:\"Есть ВНЖ\",next:[[\"Поставь в календарь дату окончания карты и подай заранее\",\"#pl-legal\"],[\"Начни считать выезды: для ПМЖ важен каждый день\",\"#pl-legal\"],[\"Обменяй права: беларусские действуют 6 месяцев после ВНЖ\",\"#pl-auto\"]]},{id:\"pmzh\",n:\"Есть ПМЖ\",next:[[\"Посчитай дату, с которой можно на гражданство\",\"#pl-legal\"],[\"Готовь доход и жильё на бумаге: их проверят\",\"#pl-legal\"],[\"Следи за законом о гражданстве: сроки хотят увеличить\",\"#pl-news\"]]},{id:\"pass\",n:\"Иду на паспорт\",next:[[\"Uznanie у воеводы: 1000 zł, решение по закону за 6 месяцев\",\"#pl-legal\"],[\"Проверь, что выездов дольше 6 месяцев не было\",\"#pl-legal\"],[\"Расскажи своим, когда получишь: это праздник\",\"#help\"]]},{id:\"citizen\",n:\"Есть паспорт\",next:[[\"Сделай dowód osobisty: очередь та же, но теперь ты в ней как гражданин\",\"#pl-legal\"],[\"Сходи на выборы: теперь в твоих проблемах можно винить и себя\",\"#pl-news\"],[\"Помоги новеньким: теперь ты тот самый знакомый, который всё знает\",\"#help\"]]}],h=[{d:\"24.08.2026\",t:\"Протест иностранцев у Мазовецкого ужонда. Средний срок по ВНЖ на Мазовше вырос до 394 дней, в 2023 году было 153.\",tag:\"Сроки\",u:\"https://warszawa.naszemiasto.pl/mieli-czekac-60-dni-a-czekaja-nawet-2-lata-tlum-obcokrajowcow-wyszedl-na-ulice-warszawy-urzad-milczy-moge-stracic-prace/ar/c1p2-29291631\",s:\"naszemiasto.pl\"},{d:\"27.07.2026\",t:\"MSWiA ответило на интерпелляцию 18089: на 6.07.2026 ВНЖ быстрее всего в Małopolskie, 242 дня, дольше всего в Śląskie, 658. На Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",tag:\"Сроки\",u:\"https://api.sejm.gov.pl/sejm/term10/interpellations/18089/reply/DWDJHZ/body\",s:\"sejm.gov.pl\"},{d:\"06.07.2026\",t:\"MSWiA: в Pomorskie на временный ВНЖ в среднем уходит 598 дней. Дольше только в Śląskie, 658.\",tag:\"Сроки\",u:\"https://dziennikbaltycki.pl/cudzoziemcy-czekaja-miesiacami-na-legalizacje-pobytu-a-nadchodzi-kolejna-fala-wnioskow-wojewodztwo-pomorskie-ma-problem/ar/c1p2-29401689\",s:\"dziennikbaltycki.pl\"},{d:\"01.06.2026\",t:\"800+ для иностранцев только при работе или другой активности. Ребёнок должен учиться в Польше, кроме детей до 6 лет.\",tag:\"Деньги\",u:\"https://finanse.wp.pl/zmiany-dla-cudzoziemcow-od-1-czerwca-zus-wyjasnia-7292105621981504a\",s:\"wp.pl\"},{d:\"13.05.2026\",t:\"MSWiA готовит новые правила гражданства: минимум 8 лет в Польше, тест, высокий уровень польского.\",tag:\"Проект\",u:\"https://forsal.pl/kraj/aktualnosci/artykuly/11246150,dla-kogo-polskie-obywatelstwo-mswia-przygotowuje-zmiany-w-prawie.html\",s:\"forsal.pl\"},{d:\"12.05.2026\",t:\"Проект UD408: временный ВНЖ «молчаливым согласием» через 60 дней. Только для граждан стран с безвизом в ЕС, Беларусь в их число не входит. Правительство планирует принять проект в III квартале 2026.\",tag:\"Проект\",u:\"https://www.gov.pl/web/premier/projekt-ustawy-o-zmianie-ustawy-o-cudzoziemcach\",s:\"gov.pl\"},{d:\"27.04.2026\",t:\"MOS 2: заявления на ВНЖ, ПМЖ и rezydenta UE только онлайн. Красный штамп заменило zaświadczenie. Старый портал закрыли 17.04.2026 вместе с аккаунтами.\",tag:\"Закон\",red:1,u:\"https://zielonalinia.gov.pl/mos-czyli-elektroniczne-skladanie-niektorych-wnioskow-pobytowych/\",s:\"zielonalinia.gov.pl\"},{d:\"05.03.2026\",t:\"При отказе или прекращении дела пошлину больше не возвращают.\",tag:\"Закон\",u:\"https://www.gov.pl/web/uw-warminsko-mazurski/oplaty\",s:\"gov.pl\"},{d:\"01.02.2026\",t:\"UdSC: 142 737 беларусов с действующими документами на пребывание. Из них 87 219 с временным ВНЖ, 41 721 с ПМЖ, 10 044 с дополнительной защитой.\",tag:\"Цифры\",u:\"https://www.gov.pl/attachment/4738d4ca-beae-459f-b0bb-2db8f2da7ac2\",s:\"gov.pl\"},{d:\"09.01.2026\",t:\"Сейм отклонил проект о 10 годах на ПМЖ перед гражданством. Пока действуют старые правила.\",tag:\"Закон\",u:\"https://grantthornton.pl/publikacja/zatrudnianie-cudzoziemcow-2026-sejm-odrzucil-zmiany-w-obywatelstwie/\",s:\"grantthornton.pl\"},{d:\"04.12.2025\",t:\"PKO: беларусы без карты побыту, открывшие счёт после 24.10.2025, теряют онлайн-банкинг, BLIK и карту. Основание: санкционный регламент ЕС 2025/2041.\",tag:\"Банки\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",s:\"pkobp.pl\"},{d:\"01.08.2025\",t:\"Новые пошлины за гражданство: 1000 zł за uznanie, 1669 zł за nadanie.\",tag:\"Закон\",u:\"https://www.gov.pl/web/uw-lubelski/obywatelstwo-i-repatriacja\",s:\"gov.pl\"},{d:\"01.07.2024\",t:\"Авто на беларусских номерах нельзя ввозить в ЕС. Исключение: личная машина, владелец за рулём или в салоне, у него виза или ВНЖ.\",tag:\"Авто\",u:\"https://www.gov.pl/web/kas/nowe-zasady-przywozu-samochodow-osobowych-zarejestrowanych-na-bialorusi\",s:\"gov.pl/web/kas\"}].sort(function(a,t){var e=function(a){var t=a.split(\".\");return t[2]+t[1]+t[0]};return e(t.d)\u003ce(a.d)?-1:1}),f={vnzh:{tab:\"ВНЖ\",code:\"01 · Karta pobytu czasowego\",title:\"Временный вид на жительство\",sub:\"До 3 лет. Продлевается, пока не надоест.\",irony:\"Самый длинный квест игры. Сохраняйся чаще.\",fees:[[\"Работа\",\"440 zł\"],[\"Другое\",\"340 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",s:\"От него зависит всё остальное\",b:[\"Работа (jednolite zezwolenie na pobyt i pracę), бизнес (JDG или sp. z o.o.), учёба, семья или Karta Polaka. Основание должно быть реальным на момент подачи и дожить до решения.\"],docs:[\"Договор с работодателем или документы бизнеса\",\"Справка из вуза, если учёба\",\"Документы о браке или родстве, если семья\"],warn:\"Потерял работу: письменно сообщи воеводе в течение 15 рабочих дней. Тогда у тебя есть 30 дней на новую работу, и ВНЖ не отзовут.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-jednolite-wazny-obowiazek-cudzoziemca/\",\"zielonalinia.gov.pl\"]]},{t:\"PESEL и profil zaufany\",s:\"Без подписи MOS не пустит\",b:[\"С 27.04.2026 заявление подаётся только онлайн через MOS 2. Подписать его можно профилем zaufany, квалифицированной подписью или podpisem osobistym, но он есть только в польском e-dowodzie. Иностранцу обычно остаётся profil zaufany.\",\"PESEL при визе или временном ВНЖ дают только по заявлению, где указано, зачем он нужен. Это бесплатно, подаётся в urzędzie gminy, работодатель за тебя подать не может. Дальше profil zaufany проще всего сделать через свой банк.\"],docs:[\"PESEL\",\"Profil zaufany\",\"Почта, которую ты правда читаешь\"],src:[[\"https://www.gov.pl/web/udsc/mos-qa\",\"gov.pl/web/udsc\"],[\"https://zielonalinia.gov.pl/kiedy-cudzoziemiec-moze-uzyskac-numer-pesel/\",\"zielonalinia.gov.pl\"]]},{t:\"Заполнить и отправить в MOS\",s:\"UPO храни как паспорт\",b:[\"Работодатель подписывает Załącznik nr 1 по ссылке из письма, ссылка живёт 30 дней. Черновик хранится 45 дней с последней правки. После отправки скачай UPO: письма на почту не будет.\"],docs:[\"Скан всех страниц паспорта\",\"Фото\",\"Пошлина 440 zł (работа) или 340 zł (другое)\",\"Страховка: ZUS или частная\",\"Подтверждение жилья\",\"Załącznik nr 1 от работодателя\"],warn:\"Подать нужно, пока ты легален. Если MOS лежит в твой последний день, есть 3 рабочих дня после восстановления. С 5.03.2026 при отказе пошлину не возвращают.\"},{t:\"Вызов на отпечатки\",s:\"Записаться нельзя, жди письмо\",b:[\"Воевода сам назначит дату. На месте: отпечатки, образец подписи, оригинал паспорта и, возможно, braki formalne. После проверки в MOS появится zaświadczenie, оно заменило старый красный штамп.\"],docs:[\"Оригинал паспорта\",\"Wezwanie\",\"Оригиналы приложенных документов\"],tip:\"Zaświadczenie подтверждает легальное пребывание, но по Шенгену с ним не ездят.\"},{t:\"Ждать\",s:\"Таймер ниже\",b:['По закону решение за 60 дней. На деле сроки приостановлены до 4.03.2027 (art. 100d), а в среднем ждут \u003cb data-bind=\"wait\"\u003e\u003c/b\u003e \u003cspan data-bind=\"dayword\"\u003e\u003c/span\u003e \u003cspan data-bind=\"loc\"\u003e\u003c/span\u003e.'],docs:[\"UPO и zaświadczenie\",\"Вся переписка с ужондом\",\"Ответы на braki в срок из письма\"],warn:\"Выезд из Польши без действующей карты или визы: обратно могут не пустить.\"},{t:\"Децизия и карта\",s:\"Пластик отдельно и позже\",b:[\"Сначала decyzja, потом карта. За карту 100 zł. Карта временного пребывания выдаётся на срок до 3 лет.\",'\u003cspan data-bind=\"cityNote\"\u003e\u003c/span\u003e'],docs:[\"Оплатить 100 zł за карту\",\"Паспорт\",\"Decyzja\"]}]},pmzh:{tab:\"ПМЖ\",code:\"02 · Stały pobyt / Rezydent UE\",title:\"Постоянный вид на жительство\",sub:\"Бессрочно. Пластик меняется, статус остаётся.\",irony:\"Ачивка: больше не надо продлевать каждые три года.\",fees:[[\"Rezydent UE / stały\",\"640 zł\"],[\"Karta Polaka\",\"0 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",p:{rd:{s:\"Rezydent długoterminowy UE\",b:[\"5 лет легально и без перерывов прямо перед подачей, стабильный доход за последние 3 года, медстраховка, жильё и польский B1.\"]},kp:{s:\"Stały pobyt по Karcie Polaka\",b:[\"Нужны действующая Karta Polaka и намерение жить в Польше постоянно. Стаж в Польше не нужен, пошлины за заявление нет.\"]},orig:{s:\"Stały pobyt по происхождению\",b:[\"Родитель, дед или бабушка либо двое прадедов польской национальности, ты сохраняешь польскость и собираешься жить в Польше постоянно.\"]},mar:{s:\"Stały pobyt по браку\",b:[\"Брак с гражданином Польши не меньше 3 лет, и прямо перед подачей не меньше 2 лет непрерывно в Польше на ВНЖ по браку или со статусом защиты.\"]},prot:{s:\"Stały pobyt после защиты\",b:[\"5 лет непрерывно в Польше со статусом беженца, ochroną uzupełniającą или zgodą na pobyt humanitarny прямо перед подачей.\"]},kid:{s:\"Stały pobyt для ребёнка\",b:[\"Ребёнок гражданина Польши под его родительской властью. Или ребёнок иностранца с ПМЖ, родившийся после того, как родитель получил ПМЖ, или во время его ВНЖ.\"]}},src:[[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-195/\",\"art. 195\"],[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-211/\",\"art. 211\"]]},{t:\"Проверить срок\",p:{rd:{s:\"5 лет, выезды 6 и 10 месяцев\",b:[\"Один выезд не дольше 6 месяцев, все вместе не больше 10 месяцев за 5 лет. Учёба засчитывается наполовину, делегирование и некоторые визы не засчитываются. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\",\"Прежние решения, карты и визы за 5 лет\"],tip:\"Командировки от польского работодателя в лимит не входят, но их надо подтвердить.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue-a-piecioletni-pobyt/\",\"zielonalinia.gov.pl\"]]},mar:{s:\"3 года брака, 2 года здесь\",b:[\"Считаются 2 года непрерывно прямо перед подачей. Перерывы те же: один выезд до 6 месяцев, все вместе до 10.\"],docs:[\"Решения о ВНЖ по браку за 2 года\",\"Список выездов с датами\"]},prot:{s:\"5 лет со статусом\",b:[\"Считаются 5 лет непрерывно прямо перед подачей, время процедуры о защите тоже. Перерывы: один выезд до 6 месяцев, все вместе до 10. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\"]},_:{s:\"Срок не нужен\",b:[\"Для этого основания стаж в Польше не требуется. Главное подать, пока ты здесь легально.\"]}}},{t:\"Польский\",p:{rd:{s:\"B1 или польский диплом\",b:[\"Подходит государственный сертификат B1 или выше, świadectwo польской школы в Польше, диплом вуза с обучением на польском или школа за границей с польским языком обучения. Policealna не подходит. С детей до 16 лет не требуют.\"],docs:[\"Сертификат B1 (certyfikatpolski.pl) или польский аттестат либо диплом\"]},_:{s:\"Сертификат не нужен\",b:[\"Для stały pobyt сертификат польского не требуют. В ужонде, правда, всё равно говорят по-польски.\"]}}},{t:\"Собрать документы\",p:{rd:{s:\"Доход, жильё, страховка\",b:[\"Доход за 3 года и сейчас: выше 1 010 zł netto в месяц на одного или выше 823 zł на каждого члена семьи. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"PIT-11 от всех работодателей и годовые PIT с UPO за 3 года\",\"ZUS RMUA или справка из ZUS\",\"Договоры, аннексы и świadectwa pracy\",\"Свежая справка от работодателя\",\"Для JDG: документы о доходах фирмы\",\"Страховка: ZUS (NFZ) или частный полис на лечение в Польше\",\"Договор аренды или акт нотариальный. Umowę użyczenia обычно не принимают, кроме как от семьи\",\"Свидетельства о браке и рождении, если в деле есть семья\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/uw-podlaski/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"gov.pl/web/uw-podlaski\"]]},kp:{s:\"Karta Polaka и бумаги\",b:[\"Список Любуского ужонда, в других воеводствах может отличаться. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Karta Polaka: оригинал покажешь на отпечатках\",\"Oświadczenie o pochodzeniu (бланк на сайте ужонда)\",\"Документы о намерении жить в Польше постоянно\",\"Справка из urzędu skarbowego, что нет долгов по налогам\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/zezwolenie_na_pobyt_staly_-_Karta_Polaka\",\"bip.lubuskie.uw.gov.pl\"]]},orig:{s:\"Документы о предках\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Документы о польской национальности родителя, деда или бабушки либо двух прадедов\",\"Подтверждения, что ты сохраняешь польскость\",\"Документы о намерении жить в Польше постоянно\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},mar:{s:\"Брак на бумаге\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Актуальный польский odpis aktu małżeństwa\",\"Документ о гражданстве супруга\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},prot:{s:\"Решения о статусе\",b:[\"Если паспорта нет и получить его нельзя, в обоснованных случаях принимают другой документ личности.\"],docs:[\"Паспорт или другой документ личности\",\"Фото в цифровом виде\",\"Решения о статусе защиты\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},kid:{s:\"Бумаги ребёнка и родителя\",b:[\"Заявление за ребёнка заполняет и подписывает родитель.\"],docs:[\"Паспорт ребёнка: скан всех страниц\",\"Фото в цифровом виде\",\"Свидетельство о рождении\",\"Документ о гражданстве или ПМЖ родителя\",\"Паспорт родителя\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]}}},{t:\"Подать в MOS\",p:{kp:{s:\"Без пошлины, и снова тот же ужонд\",docs:[\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"]},_:{s:\"640 zł и снова тот же ужонд\",docs:[\"Пошлина 640 zł\",\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"],warn:\"С 5.03.2026 при отказе пошлину не возвращают.\"}},b:[\"Только онлайн через MOS 2. Нужны PESEL и profil zaufany, аккаунт заводится заново: старые закрыли 27.04.2026. Подписать заявление можешь только ты сам, pełnomocnik не может.\",\"Подай не позже последнего дня легального пребывания. Если в заявлении нет недостатков или ты исправил их в срок, ты здесь легально до решения.\",\"После отправки скачай UPO. Когда ужонд проверит заявление, в MOS появится zaświadczenie вместо штампа. Отправленное заявление в MOS не исправить, только бумажной корректой.\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/procedury/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"migrant.poznan.uw.gov.pl\"]]},{t:\"Отпечатки и карта\",s:\"Больше не продлевать каждые 3 года\",b:['Вызов придёт сам: отпечатки в \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e, образец подписи, оригинал паспорта и оригиналы документов. Да, опять.',\"По закону решение за 6 месяцев. На деле дольше: на Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",\"Статус бессрочный, меняется только пластик.\"],docs:[\"Wezwanie\",\"Оригинал паспорта\",\"Оригиналы приложенных документов\",\"Decyzja\"]}]},paszport:{tab:\"Паспорт\",code:\"03 · Obywatelstwo\",title:\"Гражданство\",sub:\"Финальный босс. Обычно около восьми лет с приезда.\",irony:\"Правила игры могут поменять прямо во время игры.\",fees:[[\"Uznanie\",\"1000 zł\"],[\"Nadanie\",\"1669 zł\"]],steps:[{t:\"Выбрать путь\",s:\"Воевода или президент\",b:[\"Uznanie: решает воевода по закону, срок 6 месяцев с подачи, отказ можно обжаловать.\",\"Nadanie: решает президент, без условий по стажу и без срока рассмотрения, обжаловать нельзя.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]]},{t:\"Отсидеть срок\",s:\"3 года, 2 или 1\",b:[\"На ПМЖ или rezydencie UE: 3 года при доходе и жилье; 2 года, если ты не меньше 3 лет в браке с гражданином; 1 год, если ПМЖ получен по Karcie Polaka или польскому происхождению. Есть и путь через 10 лет легального пребывания.\",\"Пребывание должно быть непрерывным: длинные выезды могут обнулить счётчик.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]],docs:[\"Карта stały pobyt или rezydent UE\",\"Нет выездов дольше 6 месяцев\"]},{t:\"B1\",s:\"Тот же сертификат\",b:[\"Нужен официальный сертификат B1 или школьный аттестат из Польши или польской школы за границей. Если уже сдавал для ПМЖ, второй раз не нужно.\"],docs:[\"Państwowy certyfikat B1 или польский аттестат\"]},{t:\"Доход и жильё\",s:\"Романтика закончилась\",b:[\"Стабильный доход и законное жильё на бумаге.\"],docs:[\"Договор, справка или PIT\",\"Umowa najmu или akt własności\"]},{t:\"Подать заявление\",s:\"1000 zł или 1669 zł\",b:['С 1.08.2025: uznanie 1000 zł, nadanie 1669 zł. Заявление на uznanie подаётся воеводе: \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e.'],docs:[\"Wniosek\",\"Пошлина\",\"Биография, если nadanie\"]},{t:\"Паспорт и dowód\",s:\"Финальный босс\",b:[\"Дальше dowód osobisty и паспорт. Добро пожаловать в очередь, на этот раз гражданскую.\"],docs:[\"Решение\",\"Фото\",\"Заявление на dowód\"]}]}},y=[\"vnzh\",\"pmzh\",\"paszport\"],z=[[\"rd\",\"Rezydent UE: 5 лет в Польше\"],[\"kp\",\"Karta Polaka\"],[\"orig\",\"Польское происхождение\"],[\"mar\",\"Брак с гражданином Польши\"],[\"prot\",\"Беженец, ochrona uzupełniająca, zgoda humanitarna\"],[\"kid\",\"Ребёнок гражданина или владельца ПМЖ\"]],g={todo:\"prog\",prog:\"done\",done:\"todo\"},k={todo:\"to-do\",prog:\"в процессе\",done:\"готово\"},C=\"M3.75 9L7.25 12.375L14.25 5.625\",M=[{ic:\"luggage\",t:\"Паспорт истёк, в посольство нельзя\",s:\"Polski dokument podróży dla cudzoziemca\",b:[\"Упрощённо для беларусов с ВНЖ на любом осно \"],U={uop:{tab:\"Umowa o pracę\",code:\"UoP · Umowa o pracę\",t:\"Трудовой договор\",s:\"Полный ZUS, отпуск, больничный.\",i:\"Работодатель плачет, ты нет.\",fees:[[\"Минималка brutto\",\"4 806 zł\"],[\"На руки\",\"≈3 606 zł\"],[\"Отпуск\",\"20 или 26 дней\"]],more:[\"Отпуск 20 дней, после 10 лет стажа 26 (учёба засчитывается)\",\"Больничный L4 оплачивается\",\"Лучший вариант для ВНЖ и кредита\"]},zlec:{tab:\"Zlecenie\",code:\"Umowa zlecenie\",t:\"Договор поручения\",s:\"ZUS обычно есть, отпуска и больничных по закону нет.\",i:\"Свобода, но без выходных.\",fees:[[\"Минимум в час\",\"31,40 zł\"],[\"Студент до 26\",\"без ZUS\"]],more:[\"Студенты до 26 лет без ZUS\",\"Подходит как основание для ВНЖ\",\"Больничный только при добровольном chorobowe\"]},dzielo:{tab:\"Dzieło\",code:\"Umowa o dzieło\",t:\"Договор подряда\",s:\"За конкретный результат, а не за процесс. Без страховки и гарантий.\",i:\"Сделал, сдал, забыли друг друга.\",fees:[[\"ZUS\",\"0\"],[\"PIT\",\"12%\"]],more:[\"Нет страховки NFZ от этого договора\",\"Слабое основание для ВНЖ\",\"Налог 12% после KUP\"]},b2b:{tab:\"B2B\",code:\"B2B · JDG\",t:\"Своя фирма\",s:\"Своя działalność, счета клиентам, налоги и ZUS платишь сам.\",i:\"Ты сам себе отдел кадров и бухгалтерия.\",fees:[[\"ZUS\",\"от 0 до 1 927 zł\"],[\"Налог\",\"шкала, 19% или ryczałt\"]],more:[\"ZUS растёт по уровням, смотри ниже\",\"Форму налога выбирают раз в год\",\"Нужен бухгалтер или хороший сервис\"]}},B=[{id:\"skala\",w:\"uop zlec dzielo b2b\",ic:\"percent\",tag:\"Skala\",t:\"Шкала\",big:\"12 / 32%\",x:\"12% до 120 000 zł в год, 32% сверх. Kwota wolna 30 000 zł. Składka zdrowotna 9%.\",i:\"По умолчанию, если ничего не выбрал.\",more:[\"Для UoP и zlecenie всегда шкала\",\"До 26 лет ulga dla młodych: PIT 0 до 85 528 zł в год\",\"Можно совместное с супругом\"]},{id:\"kwota\",w:\"uop zlec dzielo\",ic:\"savings\",tag:\"Kwota wolna\",t:\"Без налога\",big:\"30 000\",x:\"zł дохода в год без PIT. С PIT-2 работодатель учитывает её сразу, по 300 zł в мес
