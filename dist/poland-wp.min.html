ag:\"Проект\",u:\"https://forsal.pl/kraj/aktualnosci/artykuly/11246150,dla-kogo-polskie-obywatelstwo-mswia-przygotowuje-zmiany-w-prawie.html\",s:\"forsal.pl\"},{d:\"12.05.2026\",t:\"Проект UD408: временный ВНЖ «молчаливым согласием» через 60 дней. Только для граждан стран с безвизом в ЕС, Беларусь в их число не входит. Правительство планирует принять проект в III квартале 2026.\",tag:\"Проект\",u:\"https://www.gov.pl/web/premier/projekt-ustawy-o-zmianie-ustawy-o-cudzoziemcach\",s:\"gov.pl\"},{d:\"27.04.2026\",t:\"MOS 2: заявления на ВНЖ, ПМЖ и rezydenta UE только онлайн. Красный штамп заменило zaświadczenie. Старый портал закрыли 17.04.2026 вместе с аккаунтами.\",tag:\"Закон\",red:1,u:\"https://zielonalinia.gov.pl/mos-czyli-elektroniczne-skladanie-niektorych-wnioskow-pobytowych/\",s:\"zielonalinia.gov.pl\"},{d:\"05.03.2026\",t:\"При отказе или прекращении дела пошлину больше не возвращают.\",tag:\"Закон\",u:\"https://www.gov.pl/web/uw-warminsko-mazurski/oplaty\",s:\"gov.pl\"},{d:\"01.02.2026\",t:\"UdSC: 142 737 беларусов с действующими документами на пребывание. Из них 87 219 с временным ВНЖ, 41 721 с ПМЖ, 10 044 с дополнительной защитой.\",tag:\"Цифры\",u:\"https://www.gov.pl/attachment/4738d4ca-beae-459f-b0bb-2db8f2da7ac2\",s:\"gov.pl\"},{d:\"09.01.2026\",t:\"Сейм отклонил проект о 10 годах на ПМЖ перед гражданством. Пока действуют старые правила.\",tag:\"Закон\",u:\"https://grantthornton.pl/publikacja/zatrudnianie-cudzoziemcow-2026-sejm-odrzucil-zmiany-w-obywatelstwie/\",s:\"grantthornton.pl\"},{d:\"04.12.2025\",t:\"PKO: беларусы без карты побыту, открывшие счёт после 24.10.2025, теряют онлайн-банкинг, BLIK и карту. Основание: санкционный регламент ЕС 2025/2041.\",tag:\"Банки\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",s:\"pkobp.pl\"},{d:\"01.08.2025\",t:\"Новые пошлины за гражданство: 1000 zł за uznanie, 1669 zł за nadanie.\",tag:\"Закон\",u:\"https://www.gov.pl/web/uw-lubelski/obywatelstwo-i-repatriacja\",s:\"gov.pl\"},{d:\"01.07.2024\",t:\"Авто на беларусских номерах нельзя ввозить в ЕС. Исключение: личная машина, владелец за рулём или в салоне, у него виза или ВНЖ.\",tag:\"Авто\",u:\"https://www.gov.pl/web/kas/nowe-zasady-przywozu-samochodow-osobowych-zarejestrowanych-na-bialorusi\",s:\"gov.pl/web/kas\"}].sort(function(a,t){var e=function(a){var t=a.split(\".\");return t[2]+t[1]+t[0]};return e(t.d)\u003ce(a.d)?-1:1}),b={vnzh:{tab:\"ВНЖ\",code:\"01 · Karta pobytu czasowego\",title:\"Временный вид на жительство\",sub:\"До 3 лет. Продлевается, пока не надоест.\",irony:\"Самый длинный квест игры. Сохраняйся чаще.\",fees:[[\"Работа\",\"440 zł\"],[\"Другое\",\"340 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",s:\"От него зависит всё остальное\",b:[\"Работа (jednolite zezwolenie na pobyt i pracę), бизнес (JDG или sp. z o.o.), учёба, семья или Karta Polaka. Основание должно быть реальным на момент подачи и дожить до решения.\"],docs:[\"Договор с работодателем или документы бизнеса\",\"Справка из вуза, если учёба\",\"Документы о браке или родстве, если семья\"],warn:\"Потерял работу: письменно сообщи воеводе в течение 15 рабочих дней. Тогда у тебя есть 30 дней на новую работу, и ВНЖ не отзовут.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-jednolite-wazny-obowiazek-cudzoziemca/\",\"zielonalinia.gov.pl\"]]},{t:\"PESEL и profil zaufany\",s:\"Без подписи MOS не пустит\",b:[\"С 27.04.2026 заявление подаётся только онлайн через MOS 2. Подписать его можно профилем zaufany, квалифицированной подписью или podpisem osobistym, но он есть только в польском e-dowodzie. Иностранцу обычно остаётся profil zaufany.\",\"PESEL при визе или временном ВНЖ дают только по заявлению, где указано, зачем он нужен. Это бесплатно, подаётся в urzędzie gminy, работодатель за тебя подать не может. Дальше profil zaufany проще всего сделать через свой банк.\"],docs:[\"PESEL\",\"Profil zaufany\",\"Почта, которую ты правда читаешь\"],src:[[\"https://www.gov.pl/web/udsc/mos-qa\",\"gov.pl/web/udsc\"],[\"https://zielonalinia.gov.pl/kiedy-cudzoziemiec-moze-uzyskac-numer-pesel/\",\"zielonalinia.gov.pl\"]]},{t:\"Заполнить и отправить в MOS\",s:\"UPO храни как паспорт\",b:[\"Работодатель подписывает Załącznik nr 1 по ссылке из письма, ссылка живёт 30 дней. Черновик хранится 45 дней с последней правки. После отправки скачай UPO: письма на почту не будет.\"],docs:[\"Скан всех страниц паспорта\",\"Фото\",\"Пошлина 440 zł (работа) или 340 zł (другое)\",\"Страховка: ZUS или частная\",\"Подтверждение жилья\",\"Załącznik nr 1 от работодателя\"],warn:\"Подать нужно, пока ты легален. Если MOS лежит в твой последний день, есть 3 рабочих дня после восстановления. С 5.03.2026 при отказе пошлину не возвращают.\"},{t:\"Вызов на отпечатки\",s:\"Записаться нельзя, жди письмо\",b:[\"Воевода сам назначит дату. На месте: отпечатки, образец подписи, оригинал паспорта и, возможно, braki formalne. После проверки в MOS появится zaświadczenie, оно заменило старый красный штамп.\"],docs:[\"Оригинал паспорта\",\"Wezwanie\",\"Оригиналы приложенных документов\"],tip:\"Zaświadczenie подтверждает легальное пребывание, но по Шенгену с ним не ездят.\"},{t:\"Ждать\",s:\"Таймер ниже\",b:['По закону решение за 60 дней. На деле сроки приостановлены до 4.03.2027 (art. 100d), а в среднем ждут \u003cb data-bind=\"wait\"\u003e\u003c/b\u003e \u003cspan data-bind=\"dayword\"\u003e\u003c/span\u003e \u003cspan data-bind=\"loc\"\u003e\u003c/span\u003e.'],docs:[\"UPO и zaświadczenie\",\"Вся переписка с ужондом\",\"Ответы на braki в срок из письма\"],warn:\"Выезд из Польши без действующей карты или визы: обратно могут не пустить.\"},{t:\"Децизия и карта\",s:\"Пластик отдельно и позже\",b:[\"Сначала decyzja, потом карта. За карту 100 zł. Карта временного пребывания выдаётся на срок до 3 лет.\",'\u003cspan data-bind=\"cityNote\"\u003e\u003c/span\u003e'],docs:[\"Оплатить 100 zł за карту\",\"Паспорт\",\"Decyzja\"]}]},pmzh:{tab:\"ПМЖ\",code:\"02 · Stały pobyt / Rezydent UE\",title:\"Постоянный вид на жительство\",sub:\"Бессрочно. Пластик меняется, статус остаётся.\",irony:\"Ачивка: больше не надо продлевать каждые три года.\",fees:[[\"Rezydent UE / stały\",\"640 zł\"],[\"Karta Polaka\",\"0 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",p:{rd:{s:\"Rezydent długoterminowy UE\",b:[\"5 лет легально и без перерывов прямо перед подачей, стабильный доход за последние 3 года, медстраховка, жильё и польский B1.\"]},kp:{s:\"Stały pobyt по Karcie Polaka\",b:[\"Нужны действующая Karta Polaka и намерение жить в Польше постоянно. Стаж в Польше не нужен, пошлины за заявление нет.\"]},orig:{s:\"Stały pobyt по происхождению\",b:[\"Родитель, дед или бабушка либо двое прадедов польской национальности, ты сохраняешь польскость и собираешься жить в Польше постоянно.\"]},mar:{s:\"Stały pobyt по браку\",b:[\"Брак с гражданином Польши не меньше 3 лет, и прямо перед подачей не меньше 2 лет непрерывно в Польше на ВНЖ по браку или со статусом защиты.\"]},prot:{s:\"Stały pobyt после защиты\",b:[\"5 лет непрерывно в Польше со статусом беженца, ochroną uzupełniającą или zgodą na pobyt humanitarny прямо перед подачей.\"]},kid:{s:\"Stały pobyt для ребёнка\",b:[\"Ребёнок гражданина Польши под его родительской властью. Или ребёнок иностранца с ПМЖ, родившийся после того, как родитель получил ПМЖ, или во время его ВНЖ.\"]}},src:[[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-195/\",\"art. 195\"],[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-211/\",\"art. 211\"]]},{t:\"Проверить срок\",p:{rd:{s:\"5 лет, выезды 6 и 10 месяцев\",b:[\"Один выезд не дольше 6 месяцев, все вместе не больше 10 месяцев за 5 лет. Учёба засчитывается наполовину, делегирование и некоторые визы не засчитываются. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\",\"Прежние решения, карты и визы за 5 лет\"],tip:\"Командировки от польского работодателя в лимит не входят, но их надо подтвердить.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue-a-piecioletni-pobyt/\",\"zielonalinia.gov.pl\"]]},mar:{s:\"3 года брака, 2 года здесь\",b:[\"Считаются 2 года непрерывно прямо перед подачей. Перерывы те же: один выезд до 6 месяцев, все вместе до 10.\"],docs:[\"Решения о ВНЖ по браку за 2 года\",\"Список выездов с датами\"]},prot:{s:\"5 лет со статусом\",b:[\"Считаются 5 лет непрерывно прямо перед подачей, время процедуры о защите тоже. Перерывы: один выезд до 6 месяцев, все вместе до 10. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\"]},_:{s:\"Срок не нужен\",b:[\"Для этого основания стаж в Польше не требуется. Главное подать, пока ты здесь легально.\"]}}},{t:\"Польский\",p:{rd:{s:\"B1 или польский диплом\",b:[\"Подходит государственный сертификат B1 или выше, świadectwo польской школы в Польше, диплом вуза с обучением на польском или школа за границей с польским языком обучения. Policealna не подходит. С детей до 16 лет не требуют.\"],docs:[\"Сертификат B1 (certyfikatpolski.pl) или польский аттестат либо диплом\"]},_:{s:\"Сертификат не нужен\",b:[\"Для stały pobyt сертификат польского не требуют. В ужонде, правда, всё равно говорят по-польски.\"]}}},{t:\"Собрать документы\",p:{rd:{s:\"Доход, жильё, страховка\",b:[\"Доход за 3 года и сейчас: выше 1 010 zł netto в месяц на одного или выше 823 zł на каждого члена семьи. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"PIT-11 от всех работодателей и годовые PIT с UPO за 3 года\",\"ZUS RMUA или справка из ZUS\",\"Договоры, аннексы и świadectwa pracy\",\"Свежая справка от работодателя\",\"Для JDG: документы о доходах фирмы\",\"Страховка: ZUS (NFZ) или частный полис на лечение в Польше\",\"Договор аренды или акт нотариальный. Umowę użyczenia обычно не принимают, кроме как от семьи\",\"Свидетельства о браке и рождении, если в деле есть семья\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/uw-podlaski/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"gov.pl/web/uw-podlaski\"]]},kp:{s:\"Karta Polaka и бумаги\",b:[\"Список Любуского ужонда, в других воеводствах может отличаться. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Karta Polaka: оригинал покажешь на отпечатках\",\"Oświadczenie o pochodzeniu (бланк на сайте ужонда)\",\"Документы о намерении жить в Польше постоянно\",\"Справка из urzędu skarbowego, что нет долгов по налогам\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/zezwolenie_na_pobyt_staly_-_Karta_Polaka\",\"bip.lubuskie.uw.gov.pl\"]]},orig:{s:\"Документы о предках\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Документы о польской национальности родителя, деда или бабушки либо двух прадедов\",\"Подтверждения, что ты сохраняешь польскость\",\"Документы о намерении жить в Польше постоянно\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},mar:{s:\"Брак на бумаге\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Актуальный польский odpis aktu małżeństwa\",\"Документ о гражданстве супруга\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},prot:{s:\"Решения о статусе\",b:[\"Если паспорта нет и получить его нельзя, в обоснованных случаях принимают другой документ личности.\"],docs:[\"Паспорт или другой документ личности\",\"Фото в цифровом виде\",\"Решения о статусе защиты\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},kid:{s:\"Бумаги ребёнка и родителя\",b:[\"Заявление за ребёнка заполняет и подписывает родитель.\"],docs:[\"Паспорт ребёнка: скан всех страниц\",\"Фото в цифровом виде\",\"Свидетельство о рождении\",\"Документ о гражданстве или ПМЖ родителя\",\"Паспорт родителя\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]}}},{t:\"Подать в MOS\",p:{kp:{s:\"Без пошлины, и снова тот же ужонд\",docs:[\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"]},_:{s:\"640 zł и снова тот же ужонд\",docs:[\"Пошлина 640 zł\",\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"],warn:\"С 5.03.2026 при отказе пошлину не возвращают.\"}},b:[\"Только онлайн через MOS 2. Нужны PESEL и profil zaufany, аккаунт заводится заново: старые закрыли 27.04.2026. Подписать заявление можешь только ты сам, pełnomocnik не может.\",\"Подай не позже последнего дня легального пребывания. Если в заявлении нет недостатков или ты исправил их в срок, ты здесь легально до решения.\",\"После отправки скачай UPO. Когда ужонд проверит заявление, в MOS появится zaświadczenie вместо штампа. Отправленное заявление в MOS не исправить, только бумажной корректой.\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/procedury/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"migrant.poznan.uw.gov.pl\"]]},{t:\"Отпечатки и карта\",s:\"Больше не продлевать каждые 3 года\",b:['Вызов придёт сам: отпечатки в \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e, образец подписи, оригинал паспорта и оригиналы документов. Да, опять.',\"По закону решение за 6 месяцев. На деле дольше: на Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",\"Статус бессрочный, меняется только пластик.\"],docs:[\"Wezwanie\",\"Оригинал паспорта\",\"Оригиналы приложенных документов\",\"Decyzja\"]}]},paszport:{tab:\"Паспорт\",code:\"03 · Obywatelstwo\",title:\"Гражданство\",sub:\"Финальный
