уже ждёшь, в таймере ожидания\",\"#pl-legal\",\"f:filed\"],[\"Не уезжай из Польши без действующей карты или визы\",\"#pl-legal\"]]},{id:\"vnzh\",n:\"Есть ВНЖ\",next:[[\"Поставь в календарь дату окончания карты и подай заранее\",\"#pl-legal\",\"f:cardExp\"],[\"Начни считать выезды: для ПМЖ важен каждый день\",\"#pl-legal\",\"t\"],[\"Обменяй права: беларуские действуют 6 месяцев после ВНЖ\",\"#pl-auto\"]]},{id:\"pmzhw\",n:\"Подал на ПМЖ\",next:[[\"Сохрани UPO и zaświadczenie из MOS: с ними ты легален до решения\",\"#pl-legal\",\"s:pmzh4\"],[\"Посчитай, сколько ждёшь ПМЖ, в «Своё»\",\"#\",\"f:pmzhFiled\"],[\"Проверь срок паспорта. Истёк: беларусам дают polski dokument podróży\",\"#pl-legal\",\"f:passExp\"]]},{id:\"pmzh\",n:\"Есть ПМЖ\",next:[[\"Посчитай дату, с которой можно на гражданство\",\"#pl-legal\",\"f:staly\"],[\"Готовь доход и жильё на бумаге: их проверят\",\"#pl-legal\",\"s:paszport3\"],[\"Следи за законом о гражданстве: сроки хотят увеличить\",\"#pl-news\"]]},{id:\"pass\",n:\"Иду на паспорт\",next:[[\"Uznanie у воеводы: 1000 zł, решение по закону за 6 месяцев\",\"#pl-legal\",\"s:paszport4\"],[\"Проверь, что выездов дольше 6 месяцев не было\",\"#pl-legal\",\"t\"],[\"Расскажи своим, когда получишь: это праздник\",\"#help\"]]},{id:\"citizen\",n:\"Есть паспорт\",next:[[\"Сделай dowód osobisty: очередь та же, но теперь ты в ней как гражданин\",\"#pl-legal\",\"s:paszport5\"],[\"Сходи на выборы: теперь в твоих проблемах можно винить и себя\",\"#pl-news\"],[\"Помоги новеньким: теперь ты тот самый знакомый, который всё знает\",\"#help\"]]}],C=[{id:\"tsue-zawieszenie-terminow\",d:\"12.11.2026\",tag:\"Сроки\",red:1,h:\"Суд ЕС: заморозка сроков по ВНЖ не бесконечная\",t:\"TSUE ответил суду в Гливицах по делу студента, который ждал ВНЖ с апреля 2024 (C-⁠254/25). По директиве 2016/801 студенту решение нужно за 90 дней. Наплыв беженцев из Украины мог быть форс-мажором, но после 31.12.2022 уже вряд ли. Нехватка людей и рост числа заявлений не оправдание: Польша должна доказать, что сделала всё возможное. Окончательно решит суд в Гливицах. Сам art. 100d действует до 4.03.2027, так что ужонд сам по себе быстрее не станет. Зато в жалобе на przewlekłość теперь есть на что сослаться.\",u:\"https://sawickiwspolnicy.pl/bezczynnosc-organow-w-sprawach-pobytowych-tsue-okresla-granice-dopuszczalnych-opoznien/\",s:\"sawickiwspolnicy.pl\",u2:\"https://bip.brpo.gov.pl/sites/default/files/2026-06/Do_MSWiA_cudzoziemcy_legalizacja_pobytu_przewleklosc_1_06_2026.pdf\",s2:\"brpo.gov.pl\",more:[\"Ещё 16.04.2026 генеральный адвокат суда ЕС Дин Спильманн написал в заключении: директива разрешает останавливать срок, только если заявление неполное. А art. 100d останавливал сроки всем подряд и заодно отнимал жалобу на бездействие ужонда, хотя у поляков в похожих делах такая жалоба есть.\",\"Суд с этим в целом согласился, но оставил Польше лазейку: форс-мажор. Чтобы на него сослаться, государство должно показать, что сделало всё возможное и держало ограничения не дольше нужного. Наплыв людей после 24.02.2022 мог быть неожиданным, но после 31.12.2022 суд в этом сомневается. Продление заморозки жалоб до 30.09.2025 он тоже счёл вряд ли нужным.\",\"Дело про студента, и 90 дней в директиве написаны именно для студентов. Касается ли решение других оснований ВНЖ, пока прямо никто не сказал. Адвокаты называют его ориентиром для польских административных судов, но не кнопкой «ускорить».\",\"Что это значит для тебя: если ждёшь долго, на это решение можно ссылаться в жалобе. Как именно её подавать, лучше спросить юриста, бесплатная помощь есть в разделе «Хелп».\"],u3:\"https://eur-lex.europa.eu/legal-content/PL/TXT/HTML/?uri=CELEX%3A62025CC0254\",s3:\"заключение адвоката, EUR-Lex\"},{id:\"pit-2027\",d:\"06.11.2026\",tag:\"Налоги\",h:\"PIT с 2027: три ставки вместо двух, если подпишет президент\",t:\"Сейм 5 ноября и Сенат без поправок приняли новую шкалу: 12% до 130 000 zł дохода в год, 24% от 130 000 до 150 000 zł, 32% сверх. В том же законе ryczałt только при выручке до 250 тысяч евро вместо 2 млн, а danina solidarnościowa растёт с 4% до 5%. У президента 21 день, опубликовать закон надо до конца ноября. PIT за 2026 год в любом случае считается по старой шкале.\",u:\"https://www.money.pl/podatki/zmiany-w-podatkach-senat-zdecydowal-teraz-czas-na-ruch-prezydenta-7348086529518048a.html\",s:\"money.pl\",u2:\"https://biznes.wprost.pl/twoj-portfel/12495919/zmiany-podatkowe-w-rekach-prezydenta-co-zrobi-karol-nawrocki.html\",s2:\"wprost.pl\"},{id:\"obywatelstwo-b2-test\",d:\"28.10.2026\",tag:\"Проект\",h:\"Гражданство: B2, тест и декларация лояльности\",t:\"MSWiA внесло проект в план работ правительства. Польский нужен на B2 вместо B1, тест о Польше обязателен, плюс декларация лояльности и доказательства, что центр жизни в Польше, например налоговое резидентство. Ещё минимальный доход и право на жильё. Упрощённое восстановление гражданства (art. 38) оставят до 31.12.2030. Правительство хочет принять проект в IV квартале 2026, потом его рассмотрит Сейм. Пока действуют старые правила.\",u:\"https://www.money.pl/gospodarka/zainteresowanie-obywatelstwem-polskim-rosnie-rzad-chce-zmian-7344845081319520a.html\",s:\"money.pl\"},{id:\"placa-minimalna-2027\",d:\"15.09.2026\",tag:\"Деньги\",h:\"Минималка 2027: 4 950 zł brutto\",t:\"Правительство утвердило минимальную зарплату на 2027 год: 4 950 zł brutto в месяц вместо 4 806, почасовая ставка на zleceniu 32,30 zł. Распоряжение вышло в Dz.U. 2026 poz. 1213 и действует с 1 января 2027. От минималки считается и ZUS владельца JDG, так что взносы тоже подрастут.\",u:\"https://ksiegowosc.infor.pl/wiadomosci/7656496,minimalne-wynagrodzenie-w-2027-r-netto-i-brutto-czy-pracodawca-moze-wyrownac-premia-do-kwoty-minimalnego-wynagrodzenia.html\",s:\"infor.pl\",u2:\"https://www.podatki.biz/artykuly/maly-zus-2027-wyzsze-wynagrodzenie-minimalne-to-takze-wyzsze-skladki_34_63635.htm\",s2:\"podatki.biz\"},{id:\"protest-mazowiecki-urzad\",d:\"24.08.2026\",tag:\"Сроки\",h:\"Протест иностранцев у Мазовецкого ужонда\",t:\"По закону решение по ВНЖ должно быть за 60 дней, а ждут до двух лет. Иностранцы вышли к Мазовецкому ужонду. Средний срок по ВНЖ на Мазовше вырос до 394 дней, в 2023 году было 153.\",u:\"https://warszawa.naszemiasto.pl/mieli-czekac-60-dni-a-czekaja-nawet-2-lata-tlum-obcokrajowcow-wyszedl-na-ulice-warszawy-urzad-milczy-moge-stracic-prace/ar/c1p2-29291631\",s:\"naszemiasto.pl\"},{id:\"karta-pobytu-druk\",d:\"10.08.2026\",tag:\"Сроки\",h:\"Карту побыту печатают дольше двух месяцев\",t:\"UdSC предупредил: заявлений стало намного больше, поэтому выдача новой карты побыту и обмен старой теперь занимают больше двух месяцев. То же с Genewskim dokumentem podróży. Решение уже есть, а пластика ещё нет. Классика.\",u:\"https://www.gov.pl/web/udsc/aktualnosci-udsc\",s:\"gov.pl/web/udsc\"},{id:\"bialorusini-133-tys\",d:\"01.08.2026\",tag:\"Цифры\",h:\"133 тысячи беларусов с документами в Польше\",t:\"UdSC: на 1.08.2026 документы на пребывание есть у 133 057 беларусов. 77 694 на временном ВНЖ, 41 249 на ПМЖ, 9 902 с дополнительной защитой. Polski dokument podróży в 2026 году до августа получили 4 305 беларусов, к концу года UdSC ждёт больше 7 тысяч. В феврале с документами было 142 737 человек.\",u:\"https://www.gov.pl/attachment/7089372c-4050-4051-80ad-a7983a4353dc\",s:\"gov.pl, UdSC\"},{id:\"mswia-czas-oczekiwania\",d:\"27.07.2026\",tag:\"Сроки\",h:\"MSWiA: где ВНЖ дают быстрее всего\",t:\"Ответ на интерпелляцию 18089: на 6.07.2026 ВНЖ быстрее всего в Małopolskie, 242 дня, дольше всего в Śląskie, 658. На Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",u:\"https://api.sejm.gov.pl/sejm/term10/interpellations/18089/reply/DWDJHZ/body\",s:\"sejm.gov.pl\"},{id:\"pomorskie-598-dni\",d:\"06.07.2026\",tag:\"Сроки\",h:\"Поморское: 598 дней на ВНЖ\",t:\"По данным MSWiA, в Pomorskie на временный ВНЖ в среднем уходит 598 дней. Дольше только в Śląskie, 658. Гданьск, мы тебя любим, но это много.\",u:\"https://dziennikbaltycki.pl/cudzoziemcy-czekaja-miesiacami-na-legalizacje-pobytu-a-nadchodzi-kolejna-fala-wnioskow-wojewodztwo-pomorskie-ma-problem/ar/c1p2-29401689\",s:\"dziennikbaltycki.pl\"},{id:\"polski-dokument-podrozy\",d:\"01.07.2026\",tag:\"Беларусам\",red:1,h:\"Polski dokument podróży по упрощённым правилам до 31.12.2026\",t:\"MSWiA продлило упрощённую выдачу polskiego dokumentu podróży dla cudzoziemca гражданам Беларуси до 31 декабря 2026. Это замена паспорту, если свой истёк, а в посольство нельзя. По упрощённым правилам подать надо до конца года.\",u:\"https://www.mos.cudzoziemcy.gov.pl/artyku-y/ulatwienia-dla-obywateli-bialorusi-dotyczace-wydawania-polskich-dokumentow-podrozy-dla-cudzoziemca-przedluzenie-do-31-grudnia-2026-r/\",s:\"mos.cudzoziemcy.gov.pl\"},{id:\"dobry-start-2026\",d:\"01.07.2026\",tag:\"Дети\",red:1,h:\"Dobry Start 300 zł: заявка до 30 ноября\",t:\"300 zł раз в год на каждого ребёнка, который учится, до 20 лет (с инвалидностью до 24). С 2026/2027 иностранцы не из ЕС, ЕАСТ и Великобритании должны показать работу или другую активность в месяце перед подачей. Подаётся только онлайн: mZUS, PUE ZUS, банк или Emp@tia. Приём до 30.11.2026.\",u:\"https://www.zus.pl/en/-/wakacyjne-zakupy-300-z%C5%82-mo%C5%BCe-si%C4%99-przyda%C4%87.-ruszy%C5%82y-wyp%C5%82aty-z-programu-dobry-start\",s:\"zus.pl\",u2:\"https://bank.pl/?p=553691\",s2:\"bank.pl\"},{id:\"800-plus-praca\",d:\"01.06.2026\",tag:\"Дети\",h:\"800+ для иностранцев только при работе\",t:\"С 1 июня иностранцам 800+ платят, только если родитель работает или у него есть другая активность. Ребёнок должен учиться в Польше, кроме детей до 6 лет.\",u:\"https://finanse.wp.pl/zmiany-dla-cudzoziemcow-od-1-czerwca-zus-wyjasnia-7292105621981504a\",s:\"wp.pl\"},{id:\"obywatelstwo-8-lat\",d:\"13.05.2026\",tag:\"Проект\",h:\"Гражданство не раньше чем через 8 лет\",t:\"MSWiA готовит новые правила: минимум 8 лет легально в Польше, из них 3 года на временном ВНЖ и 5 на ПМЖ. Плюс тест и высокий уровень польского.\",u:\"https://forsal.pl/kraj/aktualnosci/artykuly/11246150,dla-kogo-polskie-obywatelstwo-mswia-przygotowuje-zmiany-w-prawie.html\",s:\"forsal.pl\"},{id:\"milczaca-zgoda\",d:\"12.05.2026\",tag:\"Проект\",h:\"ВНЖ «молчаливым согласием», но не для беларусов\",t:\"Проект UD408: временный ВНЖ дают сам собой, если за 60 дней нет решения. Только для граждан стран с безвизом в ЕС, Беларусь в их число не входит. Правительство планировало принять проект в III квартале 2026.\",u:\"https://www.gov.pl/web/premier/projekt-ustawy-o-zmianie-ustawy-o-cudzoziemcach\",s:\"gov.pl\"},{id:\"mos-2-online\",d:\"27.04.2026\",tag:\"Закон\",red:1,h:\"MOS 2: заявления только онлайн\",t:\"Заявления на ВНЖ, ПМЖ и rezydenta UE подаются только через MOS. Красный штамп в паспорте заменило zaświadczenie. Старый портал закрыли 17.04.2026 вместе с аккаунтами.\",u:\"https://zielonalinia.gov.pl/mos-czyli-elektroniczne-skladanie-niektorych-wnioskow-pobytowych/\",s:\"zielonalinia.gov.pl\"},{id:\"oplata-skarbowa-zwrot\",d:\"05.03.2026\",tag:\"Закон\",h:\"Пошлину при отказе больше не вернут\",t:\"При отказе или прекращении дела opłatę skarbową больше не возвращают. Проверь документы до подачи, а не после.\",u:\"https://www.gov.pl/web/uw-warminsko-mazurski/oplaty\",s:\"gov.pl\"},{id:\"obywatelstwo-10-lat-odrzucone\",d:\"09.01.2026\",tag:\"Закон\",h:\"Сейм отклонил 10 лет до гражданства\",t:\"Сейм отклонил проект о 10 годах на ПМЖ перед гражданством. Пока действуют старые правила.\",u:\"https://grantthornton.pl/publikacja/zatrudnianie-cudzoziemcow-2026-sejm-odrzucil-zmiany-w-obywatelstwie/\",s:\"grantthornton.pl\"},{id:\"pko-bialorusini\",d:\"04.12.2025\",tag:\"Банки\",h:\"PKO отключает банкинг беларусам без карты побыту\",t:\"Беларусы без карты побыту, которые открыли счёт после 24.10.2025, теряют онлайн-банкинг, BLIK и карту. Основание: санкционный регламент ЕС 2025/2041.\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",s:\"pkobp.pl\"},{id:\"obywatelstwo-oplata\",d:\"01.08.2025\",tag:\"Закон\",h:\"Гражданство подорожало\",t:\"Новые пошлины: 1 000 zł за uznanie у воеводы, 1 669 zł за nadanie.\",u:\"https://www.gov.pl/web/uw-lubelski/obywatelstwo-i-repatriacja\",s:\"gov.pl\"},{id:\"bialoruskie-tablice\",d:\"01.07.2024\",tag:\"Авто\",h:\"Машины на беларуских номерах в ЕС не пускают\",t:\"Авто на беларуских номерах нельзя ввозить в ЕС. Исключение: личная машина, владелец за рулём или в салоне, у него виза или ВНЖ.\",u:\"https://www.gov.pl/web/kas/nowe-zasady-przywozu-samochodow-osobowych-zarejestrowanych-na-bialorusi\",s:\"gov.pl/web/kas\"}].sort(function(a,e){var t=function(a){var e=a.split(\".\");return e[2]+e[1]+e[0]};return t(e.d)\u003ct(a.d)?-1:1}),S={vnzh:{tab:\"ВНЖ\",code:\"01 · Karta pobytu czasowego\",title:\"Временный вид на жительство\",sub:\"До 3 лет. Продлевается, пока не надоест.\",irony:\"Самый длинный квест игры. Сохраняйся чаще.\",fees:[[\"Работа\",\"440 zł\"],[\"Другое\",\"340 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",s:\"От него зависит всё остальное\",b:[\"Работа (jednolite zezwolenie na pobyt i pracę), бизнес (JDG или sp. z o.o.), учёба, семья или Karta Polaka. Основание должно быть реальным на момент подачи и дожить до решения.\"],docs:[\"Договор с работодателем или документы бизнеса\",\"Справка из вуза, если учёба\",\"Документы о браке или родстве, если семья\"],warn:\"Потерял работу: письменно сообщи воеводе в течение 15 рабочих дней. Тогда у тебя есть 30 дней на новую работу, и ВНЖ не отзовут.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-jednolite-wazny-obowiazek-cudzoziemca/\",\"zielonalinia.gov.pl\"]]},{t:\"PESEL и profil zaufany\",s:\"Без подписи MOS не пустит\",b:[\"С 27.04.2026 заявление подаётся только онлайн через MOS 2. Подписать его можно профилем zaufany, квалифицированной подписью или podpisem osobistym, но он есть только в польском e-dowodzie. Иностранцу обычно остаётся profil zaufany.\",\"PESEL при визе или временном ВНЖ дают только по заявлению, где указано, зачем он нужен. Это бесплатно, подаётся в urzędzie gminy, работодатель за тебя подать не может. Дальше profil zaufany проще всего сделать через свой банк.\"],docs:[\"PESEL\",\"Profil zaufany\",\"Почта, которую ты правда читаешь\"],src:[[\"https://www.gov.pl/web/udsc/mos-qa\",\"gov.pl/web/udsc\"],[\"https://zielonalinia.gov.pl/kiedy-cudzoziemiec-moze-uzyskac-numer-pesel/\",\"zielonalinia.gov.pl\"]]},{t:\"Заполнить и отправить в MOS\",s:\"UPO храни как паспорт\",b:[it(\"vnzh\")],src:[[\"https://www.mos.cudzoziemcy.gov.pl/ru/kak-nachat/\",\"MOS, как начать\"],[\"https://www.mos.cudzoziemcy.gov.pl/ru/najczesciej-pope-niane-b-edy/\",\"MOS, частые ошибки\"]],docs:[\"Скан всех страниц паспорта\",\"Фото\",\"Пошлина 440 zł (работа) или 340 zł (другое)\",\"Страховка: ZUS или частная\",\"Подтверждение жилья\",\"Załącznik nr 1 от работодателя\"],warn:\"Подать нужно, пока ты легален. Если MOS лежит в твой последний день, есть 3 рабочих дня после восстановления. С 5.03.2026 при отказе пошлину не возвращают.\"},{t:\"Вызов на отпечатки\",s:\"Записаться нельзя, жди письмо\",b:[\"Воевода сам назначит дату. На месте: отпечатки, образец подписи, оригинал паспорта и, возможно, braki formalne. После проверки в MOS появится zaświadczenie, оно заменило старый красный штамп.\"],docs:[\"Оригинал паспорта\",\"Wezwanie\",\"Оригиналы приложенных документов\"],tip:\"Zaświadczenie подтверждает легальное пребывание, но по Шенгену с ним не ездят.\"},{t:\"Ждать\",s:\"Таймер ниже\",b:['По закону решение за 60 дней. На деле сроки приостановлены до 4.03.2027 (art. 100d), а в среднем ждут \u003cb data-bind=\"wait\"\u003e\u003c/b\u003e \u003cspan data-bind=\"dayword\"\u003e\u003c/span\u003e \u003cspan data-bind=\"loc\"\u003e\u003c/span\u003e.'],docs:[\"UPO и zaświadczenie\",\"Вся переписка с ужондом\",\"Ответы на braki в срок из письма\"],warn:\"Выезд из Польши без действующей карты или визы: обратно могут не пустить.\"},{t:\"Децизия и карта\",s:\"Пластик отдельно и позже\",b:[\"Сначала decyzja, потом карта. За карту 100 zł. Карта временного пребывания выдаётся на срок до 3 лет.\",'\u003cspan data-bind=\"cityNote\"\u003e\u003c/span\u003e'],docs:[\"Оплатить 100 zł за карту\",\"Паспорт\",\"Decyzja\"]}]},pmzh:{tab:\"ПМЖ\",code:\"02 · Stały pobyt / Rezydent UE\",title:\"Постоянный вид на жительство\",sub:\"Бессрочно. Пластик меняется, статус остаётся.\",irony:\"Ачивка: больше не надо продлевать каждые три года.\",fees:[[\"Rezydent UE / stały\",\"640 zł\"],[\"Karta Polaka\",\"0 zł\"],[\"Карта\",\"100 zł\"]],steps:[{t:\"Выбрать основание\",p:{rd:{s:\"Rezydent długoterminowy UE\",b:[\"5 лет легально и без перерывов прямо перед подачей, стабильный доход за последние 3 года, медстраховка, жильё и польский B1.\"]},kp:{s:\"Stały pobyt по Karcie Polaka\",b:[\"Нужны действующая Karta Polaka и намерение жить в Польше постоянно. Стаж в Польше не нужен, пошлины за заявление нет.\"]},orig:{s:\"Stały pobyt по происхождению\",b:[\"Родитель, дед или бабушка либо двое прадедов польской национальности, ты сохраняешь польскость и собираешься жить в Польше постоянно.\"]},mar:{s:\"Stały pobyt по браку\",b:[\"Брак с гражданином Польши не меньше 3 лет, и прямо перед подачей не меньше 2 лет непрерывно в Польше на ВНЖ по браку или со статусом защиты.\"]},prot:{s:\"Stały pobyt после защиты\",b:[\"5 лет непрерывно в Польше со статусом беженца, ochroną uzupełniającą или zgodą na pobyt humanitarny прямо перед подачей.\"]},kid:{s:\"Stały pobyt для ребёнка\",b:[\"Ребёнок гражданина Польши под его родительской властью. Или ребёнок иностранца с ПМЖ, родившийся после того, как родитель получил ПМЖ, или во время его ВНЖ.\"]}},src:[[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-195/\",\"art. 195\"],[\"https://lexlege.pl/ustawa-o-cudzoziemcach/art-211/\",\"art. 211\"]]},{t:\"Проверить срок\",p:{rd:{s:\"5 лет, выезды 6 и 10 месяцев\",b:[\"Один выезд не дольше 6 месяцев, все вместе не больше 10 месяцев за 5 лет. Учёба засчитывается наполовину, делегирование и некоторые визы не засчитываются. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\",\"Прежние решения, карты и визы за 5 лет\"],tip:\"Командировки от польского работодателя в лимит не входят, но их надо подтвердить.\",src:[[\"https://zielonalinia.gov.pl/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue-a-piecioletni-pobyt/\",\"zielonalinia.gov.pl\"]]},mar:{s:\"3 года брака, 2 года здесь\",b:[\"Считаются 2 года непрерывно прямо перед подачей. Перерывы те же: один выезд до 6 месяцев, все вместе до 10.\"],docs:[\"Решения о ВНЖ по браку за 2 года\",\"Список выездов с датами\"]},prot:{s:\"5 лет со статусом\",b:[\"Считаются 5 лет непрерывно прямо перед подачей, время процедуры о защите тоже. Перерывы: один выезд до 6 месяцев, все вместе до 10. Посчитай в калькуляторе ниже.\"],docs:[\"Список выездов с датами\"]},_:{s:\"Срок не нужен\",b:[\"Для этого основания стаж в Польше не требуется. Главное подать, пока ты здесь легально.\"]}}},{t:\"Польский\",p:{rd:{s:\"B1 или польский диплом\",b:[\"Подходит государственный сертификат B1 или выше, świadectwo польской школы в Польше, диплом вуза с обучением на польском или школа за границей с польским языком обучения. Policealna не подходит. С детей до 16 лет не требуют.\"],docs:[\"Сертификат B1 (certyfikatpolski.pl) или польский аттестат либо диплом\"]},_:{s:\"Сертификат не нужен\",b:[\"Для stały pobyt сертификат польского не требуют. В ужонде, правда, всё равно говорят по-польски.\"]}}},{t:\"Собрать документы\",p:{rd:{s:\"Доход, жильё, страховка\",b:[\"Доход за 3 года и сейчас: выше 1 010 zł netto в месяц на одного или выше 823 zł на каждого члена семьи. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"PIT-11 от всех работодателей и годовые PIT с UPO за 3 года\",\"ZUS RMUA или справка из ZUS\",\"Договоры, аннексы и świadectwa pracy\",\"Свежая справка от работодателя\",\"Для JDG: документы о доходах фирмы\",\"Страховка: ZUS (NFZ) или частный полис на лечение в Польше\",\"Договор аренды или акт нотариальный. Umowę użyczenia обычно не принимают, кроме как от семьи\",\"Свидетельства о браке и рождении, если в деле есть семья\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/uw-podlaski/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"gov.pl/web/uw-podlaski\"]]},kp:{s:\"Karta Polaka и бумаги\",b:[\"Список Любуского ужонда, в других воеводствах может отличаться. Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Karta Polaka: оригинал покажешь на отпечатках\",\"Oświadczenie o pochodzeniu (бланк на сайте ужонда)\",\"Документы о намерении жить в Польше постоянно\",\"Справка из urzędu skarbowego, что нет долгов по налогам\"],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/zezwolenie_na_pobyt_staly_-_Karta_Polaka\",\"bip.lubuskie.uw.gov.pl\"]]},orig:{s:\"Документы о предках\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Документы о польской национальности родителя, деда или бабушки либо двух прадедов\",\"Подтверждения, что ты сохраняешь польскость\",\"Документы о намерении жить в Польше постоянно\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},mar:{s:\"Брак на бумаге\",b:[\"Документы на других языках нужны с переводом присяжного переводчика.\"],docs:[\"Паспорт: скан всех страниц\",\"Фото в цифровом виде\",\"Актуальный польский odpis aktu małżeństwa\",\"Документ о гражданстве супруга\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},prot:{s:\"Решения о статусе\",b:[\"Если паспорта нет и получить его нельзя, в обоснованных случаях принимают другой документ личности.\"],docs:[\"Паспорт или другой документ личности\",\"Фото в цифровом виде\",\"Решения о статусе защиты\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]},kid:{s:\"Бумаги ребёнка и родителя\",b:[\"Заявление за ребёнка заполняет и подписывает родитель.\"],docs:[\"Паспорт ребёнка: скан всех страниц\",\"Фото в цифровом виде\",\"Свидетельство о рождении\",\"Документ о гражданстве или ПМЖ родителя\",\"Паспорт родителя\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/pobyt-staly-na-terytorium-rp\",\"gov.pl/web/uw-zachodniopomorski\"]]}}},{t:\"Подать в MOS\",p:{kp:{s:\"Без пошлины, и снова тот же ужонд\",docs:[\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"]},_:{s:\"640 zł и снова тот же ужонд\",docs:[\"Пошлина 640 zł\",\"Оплата карты 100 zł\",\"UPO\",\"Zaświadczenie после проверки\"],warn:\"С 5.03.2026 при отказе пошлину не возвращают.\"}},b:[\"Только онлайн через MOS 2, аккаунт заводится заново: старые закрыли 27.04.2026. Подай не позже последнего дня легального пребывания. Если в заявлении нет недостатков или ты исправил их в срок, ты здесь легально до решения.\",it(\"pmzh\"),\"Когда ужонд проверит заявление, в MOS появится zaświadczenie вместо штампа.\"],src:[[\"https://www.mos.cudzoziemcy.gov.pl/ru/kak-nachat/\",\"MOS, как начать\"],[\"https://www.mos.cudzoziemcy.gov.pl/ru/najczesciej-pope-niane-b-edy/\",\"MOS, частые ошибки\"],[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/Zezw_na_pobyt_rezydenta_dlugoterm_UE\",\"bip.lubuskie.uw.gov.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/procedury/zezwolenie-na-pobyt-rezydenta-dlugoterminowego-ue\",\"migrant.poznan.uw.gov.pl\"]]},{t:\"Отпечатки и карта\",s:\"Больше не продлевать каждые 3 года\",b:['Вызов придёт сам: отпечатки в \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e, образец подписи, оригинал паспорта и оригиналы документов. Да, опять.',\"По закону решение за 6 месяцев. На деле дольше: на Мазовше ПМЖ ждут в среднем 239 дней, rezydenta UE 423.\",\"Статус бессрочный, меняется только пластик.\"],docs:[\"Wezwanie\",\"Оригинал паспорта\",\"Оригиналы приложенных документов\",\"Decyzja\"]}]},paszport:{tab:\"Паспорт\",code:\"03 · Obywatelstwo\",title:\"Гражданство\",sub:\"Финальный босс. Обычно около восьми лет с приезда.\",irony:\"Правила игры могут поменять прямо во время игры.\",fees:[[\"Uznanie\",\"1000 zł\"],[\"Nadanie\",\"1669 zł\"]],steps:[{t:\"Выбрать путь\",s:\"Воевода или президент\",b:[\"Uznanie: решает воевода по закону, срок 6 месяцев с подачи, отказ можно обжаловать.\",\"Nadanie: решает президент, без условий по стажу и без срока рассмотрения, обжаловать нельзя.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]]},{t:\"Отсидеть срок\",s:\"3 года, 2 или 1\",b:[\"На ПМЖ или rezydencie UE: 3 года при доходе и жилье; 2 года, если ты не меньше 3 лет в браке с гражданином; 1 год, если ПМЖ получен по Karcie Polaka или польскому происхождению. Есть и путь через 10 лет легального пребывания.\",\"Пребывание должно быть непрерывным: длинные выезды могут обнулить счётчик.\"],src:[[\"https://www.gov.pl/web/uw-zachodniopomorski/uznanie-za-obywatela-polskiego2\",\"gov.pl\"]],docs:[\"Карта stały pobyt или rezydent UE\",\"Нет выездов дольше 6 месяцев\"]},{t:\"B1\",s:\"Тот же сертификат\",b:[\"Нужен официальный сертификат B1 или школьный аттестат из Польши или польской школы за границей. Если уже сдавал для ПМЖ, второй раз не нужно.\"],docs:[\"Państwowy certyfikat B1 или польский аттестат\"]},{t:\"Доход и жильё\",s:\"Романтика закончилась\",b:[\"Стабильный доход и законное жильё на бумаге.\"],docs:[\"Договор, справка или PIT\",\"Umowa najmu или akt własności\"]},{t:\"Подать заявление\",s:\"1000 zł или 1669 zł\",b:['С 1.08.2025: uznanie 1000 zł, nadanie 1669 zł. Заявление на uznanie подаётся воеводе: \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e.',\"Пошлину платят переводом. Счёт смотри на странице оплат своего ужонда, ссылка «пруф» в карточке «Твой ужонд» вверху раздела.\"],docs:[\"Wniosek\",\"Пошлина\",\"Биография, если nadanie (по желанию)\",\"Фото 35 × 45 мм, 1 штука\"]},{t:\"Паспорт и dowód\",s:\"Финальный босс\",b:[\"Дальше dowód osobisty и паспорт. Добро пожаловать в очередь, на этот раз гражданскую.\"],docs:[\"Решение\",\"Фото\",\"Заявление на dowód\"]}]}},P=[\"vnzh\",\"pmzh\",\"paszport\"],M=[[\"rd\",\"Rezydent UE: 5 лет в Польше\"],[\"kp\",\"Karta Polaka\"],[\"orig\",\"Польское происхождение\"],[\"mar\",\"Брак с гражданином Польши\"],[\"prot\",\"Беженец, ochrona uzupełniająca, zgoda humanitarna\"],[\"kid\",\"Ребёнок гражданина или владельца ПМЖ\"]],x={todo:\"prog\",prog:\"done\",done:\"todo\"},E={todo:\"to-do\",prog:\"в процессе\",done:\"готово\"},U=\"M3.75 9L7.25 12.375L14.25 5.625\",L=[{id:\"docs\",t:\"Документы и статус\",s:\"Паспорт, защита и бумаги из Беларуси\"},{id:\"kp\",t:\"Karta Polaka\",s:\"Основания, ПМЖ, гражданство и выплаты\"},{id:\"money\",t:\"Деньги и работа\",s:\"Банки, трудоустройство и страховой стаж\"},{id:\"life\",t:\"Жизнь и поездки\",s:\"Авто, дети и официальная информация\"}],A=[{g:\"docs\",ic:\"luggage\",t:\"dokument podróży\",s:\"Polski dokument podróży dla cudzoziemca\",b:[\"Польская замена паспорту, если свой истёк, потерян, испорчен или его никогда не было, а в посольство нельзя. Подтверждает личность и гражданство, по нему можно много раз пересекать границу. Действует 1 год. Это не польский паспорт и не гражданство, и по упрощённому порядку для беларусов не нужно доказывать, что свой паспорт невозможно получить.\",\"Кому: беларусам с ВНЖ на любом основании, ПМЖ, rezydentem UE, гуманитаркой или ochroną uzupełniającą. Доказывать, что в Беларуси паспорт не получить, не надо. По упрощённым правилам заявление надо подать до 31.12.2026. Для беларусов бесплатно, обычная цена 350 zł.\",\"Для поездок за границу проверь требования страны назначения. dokument podróży сам по себе не заменяет карту побыту или визу для возвращения и пребывания. Отдельная проблема: членам семьи граждан ЕС на особом основании пребывания этот документ может быть недоступен.\",'\u003cdiv class=\"pl-acc\"\u003e\u003cdetails\u003e\u003csummary\u003e\u003cspan class=\"t\"\u003eПолный список документов\u003c/span\u003e'+Ne(\"expand_more\",\"chev\")+'\u003c/summary\u003e\u003cdiv class=\"body\"\u003e\u003cdiv class=\"pl-checks pl-docs\"\u003e'+[\"\u003cb\u003eWniosek o wydanie/wymianę polskiego dokumentu podróży dla cudzoziemca\u003c/b\u003e, 1 экземпляр. Бланк на сайте ужонда или в MOS.\",\"\u003cb\u003e2 биометрические фотографии\u003c/b\u003e как на польский паспорт, не старше 6 месяцев, подписанные.\",\"\u003cb\u003eКопия документа личности\u003c/b\u003e, например истёкшего паспорта. Оригинал показать.\",\"\u003cb\u003eКопия карты побыту.\u003c/b\u003e\",\"\u003cb\u003eПодтверждение meldunku\u003c/b\u003e, постоянного или временного.\",\"\u003cb\u003eOświadczenie о ВНЖ\u003c/b\u003e, если он не гуманитарный (не art. 186 ust. 1 pkt 9): какой орган дал и дата решения. Бланк у ужонда. UdSC советует рубрику D в бланке не отмечать, а приложить это oświadczenie.\",\"\u003cb\u003eДокументы, которые подтверждают данные из бланка.\u003c/b\u003e Документы на чужом языке с переводом присяжного.\",\"Если на фото головной убор по религии: \u003cb\u003eoświadczenie o przynależności do wspólnoty wyznaniowej\u003c/b\u003e.\",\"Квитанция об оплате не нужна: беларусы освобождены.\"].map(function(a,e){var t=wt(a,\"by\");return t.info=ut(a,\"by\"),bt(t,a,\"\",\"pdpc\"+e)}).join(\"\")+'\u003c/div\u003e\u003cp\u003e\u003cb\u003eКак.\u003c/b\u003e Подать лично в ужонде или по почте. Забирать лично, с документом личности и прошлым dokumentem podróży, если он был. Получил свой паспорт или польское гражданство: верни документ в ужонд в течение 14 дней.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003e\u003cspan class=\"t\"\u003eСроки по воеводствам\u003c/span\u003e'+Ne(\"expand_more\",\"chev\")+'\u003c/summary\u003e\u003cdiv class=\"body\"\u003e\u003cp\u003e\u003cb\u003eТвой ужонд, \u003cspan data-bind=\"uw\"\u003e\u003c/span\u003e:\u003c/b\u003e \u003cspan data-o=\"pdpcUw\"\u003e\u003c/span\u003e\u003c/p\u003e\u003cul class=\"pl-list\" data-o=\"pdpcAll\"\u003e\u003c/ul\u003e\u003cp class=\"pl-note\"\u003eПоказаны все 16 воеводств. Там, где срок не опубликован или ещё не проверен, даём ссылку на отдел вместо выдуманных цифр. Срок считают с момента, когда у ужонда полный комплект документов.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003c/div\u003e'],src:[[\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/polski-dokument-podrozy-dla-obywateli-bialorusi\",\"bip.lubuskie.uw.gov.pl\"],[\"https://www.gov.pl/web/udsc/ulatwienia-dla-obywateli-bialorusi-dotyczace-wydawania-polskich-dokumentow-podrozy-dla-cudzoziemca---przedluzenie-do-31-grudnia-2026-r\",\"gov.pl/web/udsc\"],[\"https://www.mos.cudzoziemcy.gov.pl/kategorie-informacji/dokumenty/dokumenty-op3/pdpc/\",\"mos.cudzoziemcy.gov.pl\"],[\"https://migrant.wsc.mazowieckie.pl/pl/procedury/polski-dokument-podrozy\",\"migrant.wsc.mazowieckie.pl\"],[\"https://migrant.poznan.uw.gov.pl/pl/checklist/1356\",\"migrant.poznan.uw.gov.pl\"],[\"https://www.pomocprawna.org/polski-dokument-podrozy-dla-cudzoziemca\",\"pomocprawna.org\"]],checked:\"20.11.2026\"},{g:\"docs\",ic:\"verified\",t:\"Международная защита\",s:\"TZTC, статусы, поездки\",b:[\"Заявление о международной защите подают через Straż Graniczna. Пока дело рассматривается, TZTC подтверждает личность и право находиться в Польше, но не служит документом для пересечения границы.\",\"Статус беженца, ochrona uzupełniająca и zgoda na pobyt ze względów humanitarnych различаются по условиям и документам. Возвращение в Беларусь может поставить под вопрос основания защиты или гуманитарного пребывания.\"],more:[\"Не путай TZTC с картой побыту. При проблемах с открытием счёта по TZTC сохрани письменный отказ: этим вопросом занимаются RPO и KNF.\",\"По статусу беженца и дополнительной защите обращайся к UdSC. Гуманитарное пребывание оформляется в другом порядке, в связи с процедурой возвращения.\",\"Перед поездкой за пределы Польши уточни последствия для статуса и документы для обратного въезда, особенно если собираешься в страну происхождения.\"],src:[[\"https://www.gov.pl/web/udsc/procedura-uchodzcza\",\"UdSC: процедура\"],[\"https://www.gov.pl/web/udsc/prawa-i-obowiazki--wnioskodawca\",\"UdSC: TZTC\"],[\"https://www.gov.pl/web/udsc/pozbawienie-ochrony-miedzynarodowej\",\"UdSC: потеря защиты\"],[\"https://mos.cudzoziemcy.gov.pl/kategorie-informacji/zobowiazanie-i-zakaz-ponownego-wjazdu/zobowiazanie-do-powrotu/\",\"MOS: гуманитарный статус\"]],checked:\"20.11.2026\"},{g:\"docs\",ic:\"luggage\",t:\"Беларуские документы\",s:\"ЗАГС, переводы, апостиль\",b:[\"Для польского ужонда часто нужны свидетельства о рождении и браке, архивные документы и присяжный перевод на польский (tłumacz przysięgły). Уточняй требования к конкретному документу.\",\"Польша и Беларусь участвуют в Гаагской конвенции об апостиле, но также действует двусторонний договор о правовой помощи 1994 года. Не стоит заказывать апостиль на любой документ автоматически: значение имеет вид бумаги и процедура.\"],more:[\"Начни с перечня документов на странице своего ужонда и уточни, примут ли оригинал без апостиля на основании двустороннего договора.\",\"Проверь цепочку родства: если менялись фамилии, понадобятся документы, связывающие старые и новые данные.\",\"При отказе принять документ попроси указать письменное правовое основание требования.\"],src:[[\"https://www.gov.pl/web/bialorus/apostille\",\"gov.pl: апостиль\"],[\"https://eli.sejm.gov.pl/eli/DU/1995/619/ogl\",\"договор 1994 года\"]],checked:\"20.11.2026\"},{g:\"kp\",ic:\"verified\",t:\"Karta Polaka\",s:\"Как получить и что даёт\",b:[\"Карта поляка подтверждает принадлежность к польскому народу, но не является визой, картой побыту или польским гражданством. С ней можно подать на ПМЖ при намерении постоянно жить в Польше.\",\"Для беларусов заявление о выдаче или продлении Karty Polaka принимают польские воеводские ужонды. Нужны основания, документы и личное собеседование на польском.\"],more:[\"Основание: польская национальность твоя, одного из родителей или дедов/бабушек, либо двоих прадедов/прабабушек. Есть и другие предусмотренные законом варианты, например подтверждённая деятельность в польской организации или решение о польском происхождении.\",\"Для заявления подготовь бланк, фотографию, документ личности, подтверждения польской национальности и родства. На собеседовании проверяют язык, традиции и связь с польскостью.\",\"Детям: отдельное заявление и согласие родителей в случаях, предусмотренных законом. Порядок зависит от наличия Karty Polaka у родителей.\",\"После получения ПМЖ на основании Karty Polaka и одного года непрерывного пребывания на нём можно при соблюдении остальных условий подаваться на uznanie za obywatela polskiego. Подтверждение польского языка обычно не ниже B1 обязательно.\"],src:[[\"https://wsc.gdansk.uw.gov.pl/pl/procedury/przyznanie-karty-polaka\",\"Поморский ужонд: как получить\"],[\"https://wsc.gdansk.uw.gov.pl/pl/node/383\",\"Поморский ужонд: ПМЖ\"],[\"https://www.gov.pl/web/uw-pomorski/uznanie-za-obywatela-polskiego\",\"gov.pl: гражданство\"]],checked:\"20.11.2026\"},{g:\"kp\",ic:\"account_balance\",t:\"Выплаты по Karcie Polaka\",s:\"До 9 месяцев, не гарантированы\",b:[\"Если подал заявление на ПМЖ по Karcie Polaka, можешь также обратиться за świadczenie pieniężne на обустройство в Польше. Первое заявление нужно подать в течение 3 месяцев после заявления на ПМЖ.\",\"Помощь могут назначить максимум на 9 месяцев. Выплаты зависят от бюджета: рассмотрение заявлений могут приостанавливать, поэтому не считай эти деньги гарантированными.\"],more:[\"В первые три месяца расчёт привязан к 50% минимальной зарплаты для заявителя и супруга, для ребёнка применяется отдельная доля. С четвёртого по девятый месяц ставки ниже.\",\"В ужонде попросят подтвердить заявление на ПМЖ, данные семьи и намерение жить в Польше постоянно. Следи за сроками и официальными сообщениями о финансировании.\",\"Не путай эту выплату с 800+ или другими общими пособиями.\"],src:[[\"https://wsc.gdansk.uw.gov.pl/pl/procedury/swiadczenie-pieniezne-dla-posiadacza-karty-polaka\",\"Поморский ужонд: выплата\"],[\"https://www.gov.pl/web/uw-lodzki/swiadczenia-pieniezne-dla-posiadaczy-karty-polaka-osiedlajacych-sie-w-polsce2\",\"Лодзинский ужонд: правила\"]],checked:\"20.11.2026\"},{g:\"money\",ic:\"account_balance\",t:\"Банки и санкции\",s:\"Зависит от банка и документов\",b:[\"Санкции ЕС ужесточили проверки. Но блокировка карты и BLIK, описанная PKO BP 4.12.2025, относится к его клиентам из Беларуси и России, открывшим счёт после 24.10.2025 без карты побыту. Это не универсальное правило для каждого банка.\",\"PKO BP просит прийти в отделение с картой побыту или другим документом, разрешающим пребывание в Польше. Заявители на международную защиту с TZTC могут сталкиваться с отказами в других банках, о проблеме сообщает RPO.\"],more:[\"Если банк просит подтвердить легальное пребывание, уточни, какие документы он принимает, и проси перечень письменно.\",\"Сохраняй подтверждения происхождения средств (договоры, PIT, справки о зарплате, продаже имущества). Наличие документа не гарантирует проведение перевода: действуют санкции и банковские процедуры.\",\"Сравнение отдельных банков и переводов из Беларуси находится в разделе «Банки».\"],src:[[\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",\"PKO BP, 04.12.2025\"],[\"https://bip.brpo.gov.pl/pl/content/rpo-bialorusini-ochrona-miedzynarodowa-konta-bankowe-knf-odpowiedz-kolejne\",\"RPO и KNF\"],[\"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2041\",\"регламент ЕС\"]],checked:\"20.11.2026\"},{g:\"money\",ic:\"verified\",t:\"Работа без разрешения\",s:\"Oświadczenie и исключения\",b:[\"Для граждан Беларуси работодатель может оформить oświadczenie o powierzeniu pracy cudzoziemcowi на срок до 24 месяцев вместо обычного разрешения на работу, если работа не сезонная и соблюдены условия процедуры.\",\"С действующей Kartą Polaka отдельное разрешение на работу не требуется. Для отдельных статусов пребывания, включая гуманитарные основания, тоже действуют исключения, но проверь право работать именно по своему документу.\"],more:[\"Oświadczenie подаёт работодатель в powiatowy urząd pracy через официальный портал. Работник сам себе oświadczenie не оформляет.\",\"Действительное основание пребывания в Польше нужно отдельно: одно oświadczenie само по себе не легализует нахождение.\",\"Проверь сроки, вид работы и обязанности работодателя до подписания договора.\"],src:[[\"https://psz.praca.gov.pl/pl/dla-pracodawcow-i-przedsiebiorcow/zatrudnianie-cudzoziemcow/powierzenie-pracy-na-podstawie-oswiadczenia\",\"Ministerstwo Pracy\"],[\"https://wsc.gdansk.uw.gov.pl/pl/procedury/przyznanie-karty-polaka\",\"Поморский ужонд: Karta Polaka\"]],checked:\"20.11.2026\"},{g:\"money\",ic:\"account_balance\",t:\"Деньги из Беларуси\",s:\"Переводы и наличные\",b:[\"При переводе денег из Беларуси польский банк может запросить документы о происхождении средств и проверить операцию на соответствие санкциям. Заранее сохрани договоры, выписки и подтверждения получения денег.\",\"При въезде в ЕС или выезде из ЕС с наличными и приравненными средствами на сумму от 10 000 евро нужно подать декларацию. Правило касается суммы в эквиваленте разных валют.\"],more:[\"Не рассчитывай на конкретный способ перевода без предварительной проверки требований банка и санкций на дату операции.\",\"Для наличных и банковских переводов действуют разные правила: декларация наличных не заменяет банковскую проверку происхождения денег.\",\"Подробности и сравнение банков находятся в разделе «Банки».\"],src:[[\"https://taxation-customs.ec.europa.eu/customs/prohibitions-restrictions/eu-cash-controls_en\",\"Еврокомиссия: наличные\"],[\"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2041\",\"санкции ЕС\"]],checked:\"20.11.2026\"},{g:\"money\",ic:\"verified\",t:\"Стаж и пенсия\",s:\"Договор с Беларусью действует\",b:[\"Соглашение Польши и Беларуси о социальном обеспечении действует с 1 апреля 2022 года. Оно учитывает страховые периоды для отдельных пенсионных и социальных выплат, но у каждой страны свои условия и расчёт.\",\"Важно: польское министерство прямо сообщает, что исполнение соглашения затруднено, поскольку беларуская сторона не ответила на предложенные процедуры.\"],more:[\"Сохраняй беларуские трудовые документы и подтверждения страховых периодов, а польские периоды проверяй в ZUS.\",\"Для индивидуального расчёта и обращения используй ZUS. Не считай, что зарубежный стаж автоматически добавляет сумму к польской пенсии.\",\"Ограничения практического обмена данными могут повлиять на сроки подтверждения стажа.\"],src:[[\"https://www.zus.pl/swiadczenia/emerytury-i-renty-dla-osob-pracujacych/zamieszkalych-za-granica/zasady-przyznawania-emerytur-i-rent-dla-osob-pracujacych-w-panstwach-umownych/umowa-z-bialorusia-o-zabezpieczeniu-spolecznym/informacje-podstawowe\",\"ZUS\"],[\"https://www.gov.pl/web/rodzina/bialorus\",\"Министерство: сложности исполнения\"]],checked:\"20.11.2026\"},{g:\"life\",ic:\"directions_car\",t:\"Права и авто\",s:\"Обмен и машины на беларуских номерах\",b:[\"Срок действия подходящих иностранных водительских прав в Польше ограничен 6 месяцами от начала постоянного или временного проживания в стране, а не от получения карты побыту. Для обмена обращаются в starostwo или urząd miasta.\",\"Ввоз авто на беларуских номерах ограничен санкциями с 1.07.2024. Для личной машины возможны исключения при соблюдении условий, в частности присутствии владельца и отсутствии коммерческого использования. Разрешение на въезд не гарантировано.\"],more:[\"При обмене прав уточни список документов и необходимость перевода в своём отделе коммуникации. Правило 185 дней для выдачи польского удостоверения нельзя путать с шестимесячным сроком действия иностранных прав.\",\"Перед поездкой на беларуских номерах проверяй правила въезда именно той страны ЕС, через которую едешь, и документы на автомобиль.\"],src:[[\"https://eli.gov.pl/api/acts/DU/2024/1210/text.html\",\"закон о водителях, art. 14\"],[\"https://www.gov.pl/web/gov/wymien-zagraniczne-prawo-jazdy-na-polskie\",\"gov.pl: обмен прав\"],[\"https://www.gov.pl/web/kas/nowe-zasady-przywozu-samochodow-osobowych-zarejestrowanych-na-bialorusi\",\"KAS: санкции\"]],checked:\"20.11.2026\"},{g:\"life\",ic:\"verified\",t:\"Дети беларусов\",s:\"Рождение, PESEL, пребывание\",b:[\"Рождение ребёнка в Польше у родителей-иностранцев само по себе не даёт ему польское гражданство или автоматическое право на пребывание. Зарегистрируй рождение в USC в течение 21 дня, получи польский акт рождения и PESEL.\",\"Дальше проверь основание пребывания ребёнка с учётом статуса родителей. Если паспорт Беларуси получить невозможно, в некоторых процедурах MOS допускает другой документ личности, но это не универсальное исключение.\"],more:[\"У ребёнка, родившегося в Польше в период действия визы или временного ВНЖ родителя, может быть основание для временного пребывания. Для детей владельцев ПМЖ или rezydenta UE могут действовать другие правила.\",\"Отдельно уточни документы для выезда: польский акт рождения и PESEL не заменяют заграничный документ ребёнка.\",\"Если ребёнок остался без возможности оформить паспорт, сохрани подтверждения обстоятельств и обратись за правовой консультацией до подачи заявления.\"],src:[[\"https://www.gov.pl/web/gov/zglos-urodzenie-dziecka\",\"gov.pl: рождение\"],[\"https://mos.cudzoziemcy.gov.pl/kategorie-informacji/mozliwosci-legalizacji/spoza-ue-kontynuacja-pobytu/zezwolenie-czasowy/pobyt-z-rodzina/dziecko-cudzoziemca-urodzone-w-pl/\",\"MOS: ребёнок\"],[\"https://wsc.gdansk.uw.gov.pl/pl/procedury/maloletnie-dziecko-cudzoziemca\",\"Поморский ужонд: ребёнок\"]],checked:\"20.11.2026\"},{g:\"life\",ic:\"language\",t:\"Официально по-беларуски\",s:\"Правительственный портал\",b:[\"На gov.pl есть материалы по-беларуски. Часть инструкций там устаревает: например, старые страницы ещё показывают прежние сроки dokument podróży. Всегда сравни дату публикации с текущими сообщениями UdSC и MOS.\",\"Основные юридические условия проверяй на польских страницах ужонда и в действующих нормативных актах.\"],src:[[\"https://www.gov.pl/web/by\",\"gov.pl/web/by\"],[\"https://www.gov.pl/web/udsc/ulatwienia-dla-obywateli-bialorusi-dotyczace-wydawania-polskich-dokumentow-podrozy-dla-cudzoziemca---przedluzenie-do-31-grudnia-2026-r\",\"UdSC: новая дата\"]],checked:\"20.11.2026\"},{g:\"docs\",ic:\"verified\",t:\"Брак в Польше\",s:\"С паспортом и без действующего паспорта\",b:[\"\u003cb\u003eЕсли паспорт действует.\u003c/b\u003e Выберите любой Urząd Stanu Cywilnego (USC), покажите паспорта и подайте zapewnienie o braku okoliczności wyłączających zawarcie małżeństwa. Для иностранца также нужен документ о возможности заключить брак по его национальному праву (zaświadczenie o zdolności prawnej do zawarcia małżeństwa). Если получить его чрезвычайно сложно, районный суд по месту жительства может освободить от его подачи; действующий паспорт от этого требования сам по себе не освобождает.\",\"\u003cb\u003eЕсли беларуский паспорт истёк.\u003c/b\u003e USC всё равно обязан установить личность каждого из будущих супругов. Истёкший паспорт сам по себе не является гарантированно достаточным документом. Действующий polski dokument podróży подтверждает личность и гражданство; заранее отправьте его скан в выбранный USC и получите письменное подтверждение, что примут его для регистрации брака. Карта побыту и истёкший паспорт могут помочь с установлением данных, но не означают автоматического допуска. Если действующего документа личности нет, сперва согласуйте с USC, какие документы он примет.\",\"\u003cb\u003eВажно:\u003c/b\u003e освобождение судом от справки о брачной правоспособности НЕ заменяет проверку личности. Если USC отказывает, просите письменный отказ с основанием: его можно оспорить в суде в течение 14 дней.\",\"\u003cb\u003eОбщие правила:\u003c/b\u003e при необходимости USC запросит свидетельство о рождении и документы о прекращении прежнего брака. Иностранные документы переводятся присяжным переводчиком. При недостаточном польском нужен переводчик при подаче заявления и на церемонии. Госпошлина за составление акта брака 84 zł, обычно церемония не раньше месяца после zapewnienie (действует 6 месяцев).\"],more:[\"1. Выбери USC и запроси письменный перечень документов для обоих будущих супругов, особенно если паспорт истёк.\",\"2. Подготовь документ личности и документ о правоспособности к браку. Если второй документ невозможно получить, подай в sąd rejonowy по месту жительства wniosek o zwolnienie cudzoziemca od złożenia dokumentu stwierdzającego możność zawarcia małżeństwa.\",\"3. Собери дополнительные акты гражданского состояния, если их запросит USC, и переводы присяжного. Отнеси документы, оплати 84 zł и подпиши zapewnienie.\",\"4. Получи дату и уточни требования к документам личности на сам день бракосочетания. Если есть письменный отказ USC, можно обратиться в суд в течение 14 дней.\"],src:[[\"https://www.gov.pl/web/gov/wez-slub-cywilny.\",\"Gov.pl: брак, документы, сроки\"],[\"https://eli.gov.pl/api/acts/DU/2026/393/text.pdf\",\"Prawo o aktach stanu cywilnego, 2026\"],[\"https://mos.cudzoziemcy.gov.pl/kategorie-informacji/dokumenty/dokumenty-op3/pdpc/wprowadzenie/\",\"MOS: dokument podróży и личность\"],[\"https://bip.brpo.gov.pl/pl/content/rpo-cudzoziemiec-malzenstwo-zaswiadczenie-problemy-mswia\",\"RPO: справка о правоспособности\"]],checked:\"21.11.2026\"}],O={mazowieckie:[\"до 30 дней после полного комплекта документов\",\"https://migrant.wsc.mazowieckie.pl/pl/procedury/polski-dokument-podrozy\"],lubuskie:[\"срок на сайте не указан. На визит вызывают письмом, записываться самому не надо\",\"https://bip.lubuskie.uw.gov.pl/sprawy_obywatelskie/polski-dokument-podrozy-dla-obywateli-bialorusi\"],podkarpackie:[\"срок на сайте не указан. Подать можно только по онлайн-записи на визит\",\"https://www.gov.pl/attachment/70bfdbef-e3ef-4f97-bcec-398a7ce8dab8\"],malopolskie:[\"около 1 месяца, по данным Centrum Pomocy Prawnej im. Haliny Nieć\",\"https://www.pomocprawna.org/polski-dokument-podrozy-dla-cudzoziemca\"]},_=\"https://pieniadze.rp.pl/konta-bankowe/art36052361-rachunek-dla-rosjan-w-polskich-bankach-czasem-ze-specjalna-zgoda\",B=[{n:\"mBank\",s:3,t:\"Счёт по паспорту. Карту побыту могут попросить в отдельных случаях. Если в паспорте нет PESEL и адреса, нужен документ с ними.\",d:\"2026\",u:\"https://www.mbank.pl/indywidualny/konta/pytania-i-odpowiedzi/dokumenty-potwierdzajace-tozsamosc/\",src:\"mbank.pl\"},{n:\"Pekao\",s:3,t:\"Беларусам счёт открывают. Подходит паспорт, карта побыту или TZTC.\",d:\"2022\",u:_,src:\"rp.pl\"},{n:\"Credit Agricole\",s:2,t:\"Открывали беларусам и до войны. Нужен документ и подтверждение легального пребывания.\",d:\"2022\",u:_,src:\"rp.pl\"},{n:\"BNP Paribas\",s:2,t:\"Только если не живёшь и не платишь налоги в Беларуси. Нужна карта побыту или паспорт с Картой поляка или гуманитарной визой.\",d:\"2022\",u:_,src:\"rp.pl\"},{n:\"Erste\",s:2,t:\"Бывший Santander. Счёт иностранцу открывают в отделении: паспорт и подтверждение легального пребывания (карта побыту с PESEL, справка с работы, студенческий или документ о собственности). Могут спросить налоговый номер своей страны.\",d:\"9.01.2026\",u:\"https://www.erste.pl/bank-porad/konta/jak-zalozyc-konto-bankowe-dla-obcokrajowca\",src:\"erste.pl\"},{n:\"Alior\",s:1,t:\"Беларусь в списке стран высокого риска. На каждый счёт нужно отдельное согласие банка.\",d:\"2022\",u:_,src:\"rp.pl\"},{n:\"PKO BP\",s:1,t:\"Счёт открывают, но если он открыт после 24.10.2025 без карты побыту, нет приложения, BLIK и карты, пока не покажешь в отделении документ на пребывание.\",d:\"4.12.2025\",u:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",src:\"pkobp.pl\"}],T=[{n:\"ING Bank Śląski\",slug:\"ing\",rate:\"6,07%\",rrso:\"6,56%\",fixed:\"5 лет\",down:\"от 20%\",example:\"Jesień na swoim, Łatwy start\",terms:\"Комиссия 0% в примере, счёт ING GO, страховка жизни на 3 года, страхование недвижимости, оценка 560 zł.\",asof:\"осень 2026\",u:\"https://www.ing.pl/indywidualni/kredyty-i-pozyczki/kredyt-hipoteczny\"},{n:\"Bank Pekao\",slug:\"pekao\",rate:\"6,29%\",rrso:\"6,77%\",fixed:\"5 лет\",down:\"30,18% в примере\",example:\"Kredyt mieszkaniowy\",terms:\"Поступления на счёт от 3 000 zł в месяц, страховка жизни первые 4 года, страхование жилья, дебетовая карта.\",asof:\"пример банка, 2026\",u:\"https://www.pekao.com.pl/klient-indywidualny/wlasne-mieszkanie-lub-dom/kredyt-hipoteczny.html\"},{n:\"PKO Bank Polski\",slug:\"pko-bp\",rate:\"6,57%\",rrso:\"7,93%\",fixed:\"5 лет\",down:\"от 10%\",example:\"Własny Kąt hipoteczny\",terms:\"Ставка в примере со скидкой 1 п.п.; поступления на счёт от 3 000 zł/мес, страховки жизни и недвижимости, комиссия 0%.\",asof:\"пример 05.10.2026\",u:\"https://www.pkobp.pl/klient-indywidualny/kredyty-pozyczki/kredyt-hipoteczny\",by:\"Для граждан Беларуси без документа на законное пребывание PKO отдельно ограничивает обслуживание счетов. Для ипотек нет публичной гарантии одобрения: сначала уточни допустимость заявки.\",byU:\"https://www.pkobp.pl/aktualnosci/informacja-dla-obywateli-bialorusi-i-rosji-ktorzy-otworzyli-konta-w-pko-banku-polskim-po-24102025-r-bez-karty-pobytu\",byType:\"account\"},{n:\"mBank\",slug:\"mbank\",rate:\"6,77%\",rrso:\"7,41%\",fixed:\"5 лет\",down:\"от 10%\",example:\"Stała Pewność, edycja 3\",terms:\"Промо для активного клиента: счёт с поступлениями и страховка жизни, здоровья и потери работы на 5 лет; комиссия 0% в примере.\",asof:\"пример 19.10.2026\",u:\"https://www.mbank.pl/indywidualny/kredyty/kredyty-hipoteczne/chce-kredyt-hipoteczny\",by:\"Публичный регламент допускает иностранцев с разрешением на временный или постоянный pobyt. Нужны PESEL, документированный доход и кредитоспособность. Гражданство само по себе не гарантирует кредит.\",byU:\"https://pdf.mbank.pl/mbankpl/of/regulaminy/kredyty/regulamin_udzielania_kredytow_i_pozyczek_hipotecznych_dla_of-_obowiazuje_od_28.05.2025.pdf\",byType:\"mortgage\"},{n:\"Erste Bank Polska\",slug:\"erste\",rate:\"6,97%\",rrso:\"7,69%\",fixed:\"5 лет\",down:\"от 10%\",example:\"Kredyt mieszkaniowy, бывший Santander\",terms:\"В сентябрьском примере ставка на 5 лет, затем POLSTR 1M с маржей. Скидки зависят от счёта и поступлений, кредитной карты и страховок; без страховки Spokojna Hipoteka комиссия может отличаться.\",asof:\"пример 26.09.2026\",u:\"https://www.erste.pl/klient-indywidualny/kredyty/kredyt-mieszkaniowy\",by:\"Банк предлагает ипотеку в PLN при доходах в PLN. Публичных правил приёма именно беларусов с временным ВНЖ, ПМЖ или в ожидании решения нет; проверить допустимость заявки до оценки.\",byU:\"https://www.erste.pl/klient-indywidualny/kredyty/kredyt-mieszkaniowy\",byType:\"unverified\"},{n:\"BNP Paribas\",slug:\"bnp-paribas\",rate:\"5,95%\",rrso:\"6,93%\",fixed:\"5 лет\",down:\"43,5% в примере\",example:\"Kredyt hipoteczny z niską marżą\",terms:\"Комиссия 0% в примере, Konto Otwarte na Ciebie и карта, регулярный доход на счёт; страхование жизни, недвижимости и оценка 400 zł.\",asof:\"пример 10.09.2026\",u:\"https://www.bnpparibas.pl/klienci-indywidualni/kredyty/kredyt-hipoteczny-z-niska-marza\"},{n:\"Alior Bank\",slug:\"alior\",rate:\"6,58%\",rrso:\"7,15%\",fixed:\"5 лет\",down:\"23,89% в примере\",example:\"Megahipoteka\",terms:\"В примере: счёт, дебетовая карта и мобильный банк. При низком взносе возможно дополнительное страховое обеспечение.\",asof:\"пример, 2026\",u:\"https://www.aliorbank.pl/klienci-indywidualni/kredyty-hipoteczne/kredyt-z-okresowo-stala-stopa-oprocentowania.html\",by:\"По регламенту от 03.11.2026 иностранец должен получать доход в Польше и иметь meldunek на pobyt stały или czasowy; нужны приемлемый доход и положительное кредитное решение.\",b ",\"b2b\"],W={uop:{tab:\"Umowa o pracę\",code:\"UoP · Umowa o pracę\",t:\"Трудовой договор\",s:\"Полный ZUS, отпуск, больничный.\",i:\"Работодатель плачет, ты нет.\",fees:[[\"Минималка brutto\",\"4 806 zł\"],[\"На руки\",\"≈3 606 zł\"],[\"Отпуск\",\"20 или 26 дней\"]],more:[\"Отпуск 20 дней, после 10 лет стажа 26 (учёба засчитывается)\",\"Больничный L4 оплачивается\",\"Лучший вариант для ВНЖ и кредита\"]},zlec:{tab:\"Zlecenie\",code:\"Umowa zlecenie\",t:\"Договор поручения\",s:\"ZUS обычно есть, отпуска и больничных по закону нет.\",i:\"Свобода, но без выходных.\",fees:[[\"Минимум в час\",\"31,40 zł\"],[\"Студент до 26\",\"без ZUS\"]],more:[\"Студенты до 26 лет без ZUS\",\"Подходит как основание для ВНЖ\",\"Больничный только при добровольном chorobowe\"]},dzielo:{tab:\"Dzieło\",code:\"Umowa o dzieło\",t:\"Договор подряда\",s:\"За конкретный результат, а не за процесс. Без страховки и гарантий.\",i:\"Сделал, сдал, забыли друг друга.\",fees:[[\"ZUS\",\"0\"],[\"PIT\",\"12%\"]],more:[\"Нет страховки NFZ от этого договора\",\"Слабое основание для ВНЖ\",\"Налог 12% после KUP\"]},b2b:{tab:\"B2B\",code:\"B2B · JDG\",t:\"Своя фирма\",s:\"Своя działalność, счета клиентам, налоги и ZUS платишь сам.\",i:\"Ты сам себе отдел кадров и бухгалтерия.\",fees:[[\"ZUS\",\"от 0 до 1 927 zł\"],[\"Налог\",\"шкала, 19% или ryczałt\"]],more:[\"ZUS растёт по уровням, смотри ниже\",\"Форму налога выбирают раз в год\",\"Нужен бухгалтер или хороший сервис\"]}},R=[{id:\"skala\",w:\"uop zlec dzielo b2b\",ic:\"percent\",tag:\"Skala\",t:\"Шкала\",big:\"12 / 32%\",x:\"12% до 120 000 zł в год, 32% сверх. Kwota wolna 30 000 zł. Składka zdrowotna 9%.\",i:\"По умолчанию, если ничего не выбрал.\",more:[\"Для UoP и zlecenie всегда шкала\",\"До 26 лет ulga dla młodych: PIT 0 до 85 528 zł в год\",\"С супругом совместно можно, только если никто из вас не на liniowym и не на ryczałcie, см. карточку «С супругом»\"]},{id:\"kwota\",w:\"uop zlec dzielo\",ic:\"savings\",tag:\"Kwota wolna\",t:\"Без налога\",big:\"30 000\",x:\"zł дохода в год без PIT. С PIT-2 работодатель учитывает её сразу, по 300 zł в месяц.\",i:\"Единственные бесплатные деньги в Польше.\",more:[\"Без PIT-2 разницу вернут в годовом PIT\",\"На dzieło в месяц не учитывается, только в годовом PIT\"]},{id:\"ulga\",w:\"uop zlec\",ic:\"school\",tag:\"Ulga dla młodych\",t:\"До 26 лет\",big:\"85 528\",x:\"zł в год без PIT на umowie o pracę и zlecenie. ZUS и zdrowotna остаются.\",i:\"Молодость, которая окупается.\",more:[\"Действует до дня 26-летия\",\"На dzieło и B2B не действует\",\"Сверх лимита обычная шкала\"]},{id:\"kup\",w:\"dzielo\",ic:\"description\",tag:\"KUP\",t:\"Расходы без чеков\",big:\"20 / 50%\",x:\"Из суммы договора без налога вычитают 20%. За авторские права 50%, но не больше 120 000 zł в год.\",i:\"Творчество выгодно хотя бы для налога.\",more:[\"50% только если договор передаёт авторские права\",\"До 200 zł: 12% с суммы, без KUP\"]},{id:\"lin\",w:\"b2b\",ic:\"percent\",tag:\"Liniowy\",t:\"Линейный\",big:\"19%\",x:\"Только для JDG, без kwoty wolnej. Zdrowotna 4,9% от дохода.\",i:\"Для тех, кому 32% это слишком.\",more:[\"Выгоден примерно с дохода выше 120 000 zł\",\"Без совместного с супругом\",\"Расходы вычитаются\"]},{id:\"rycz\",w:\"b2b\",ic:\"percent\",tag:\"Ryczałt\",t:\"Ryczałt\",big:\"2–17%\",x:\"С выручки, расходы не вычитаются. Ставка по виду деятельности, в IT часто 12% или 8,5%.\",i:\"Чеки собирать не надо. Радость.\",more:[\"Zdrowotna фиксированная, по порогам выручки\",\"Ставку проверяй по своему PKD\",\"Выгоден при малых расходах\",\"Без совместного PIT с супругом, даже если супруг на etacie\",\"Ulga na dzieci с ryczałtu не вычитается, только с налога по шкале\"]},{id:\"malz\",w:\"uop zlec dzielo b2b\",ic:\"volunteer_activism\",tag:\"Wspólne rozliczenie\",t:\"С супругом\",big:\"½\",x:\"Доходы супругов складывают и делят пополам. Выгодно, если один зарабатывает сильно больше другого или второй не работает.\",i:\"Ловушка: ты на etacie, а у супруга JDG на ryczałcie или liniowym? Совместног
