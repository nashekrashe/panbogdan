-i-szkola\",lang:\"jezyk-polski\",money:\"przelewy-z-bialorusi\"},ga={mBank:\"konto-mbank\",Pekao:\"konto-pekao\",\"Credit Agricole\":\"konto-credit-agricole\",\"BNP Paribas\":\"konto-bnp-paribas\",Erste:\"konto-erste\",Alior:\"konto-alior\",\"PKO BP\":\"konto-pko-bp\"},fa={warszawa:3650,gdansk:3e3,krakow:2900,wroclaw:2800,gdynia:2800,szczecin:2600,poznan:2500,lublin:2500,zielonagora:2360,rzeszow:2300,katowice:2250,lodz:2200,bydgoszcz:2152,torun:2100,bialystok:2100,kielce:2e3},ja=[\"Определи, нужно ли разрешение: самостоятельная квартира вне пограничной зоны обычно освобождена; участок или дом проверь отдельно.\",\"Составь заявление с данными покупателя, объекта, продавца, назначением покупки, источником денег и формой собственности.\",\"Подготовь заверенную копию документа личности с гражданством.\",\"Приложи подтверждение связей с Польшей: действующая karta pobytu, работа или другие подходящие основания.\",\"Возьми odpis zwykły księgi wieczystej для покупаемой недвижимости.\",\"Получить wypis z rejestru gruntów (для земельного участка).\",\"Получить wyrys z mapy ewidencyjnej (для земельного участка).\",\"Получить документ о miejscowy plan zagospodarowania przestrzennego или об отсутствии плана (для участка).\",\"Приложи актуальное согласие продавца: oświadczenie zbywcy или предварительный / девелоперский договор.\",\"Собери подтверждение денег: PIT с UPO, трудовой договор, решение по кредиту или другие документы; приложи подтверждение госпошлины.\"],Ca=[[\"home-permit-0\",\"Проверил тип недвижимости: отдельная квартира, дом или участок.\"],[\"home-permit-border\",\"Проверил, находится ли недвижимость в приграничной зоне.\"],[\"home-permit-exempt\",\"Проверил исключения для своего гражданства, статуса и конкретной сделки.\"]],Sa=\"https://www.gov.pl/web/gov/zglos-urodzenie-dziecka\",Pa=\"https://pacjent.gov.pl/czym-jest-opieka-okoloporodowa\",Ma=\"https://wsc.gdansk.uw.gov.pl/pl/procedury/maloletnie-dziecko-cudzoziemca\",xa=\"https://mos.cudzoziemcy.gov.pl/kategorie-informacji/mozliwosci-legalizacji/spoza-ue-kontynuacja-pobytu/zezwolenie-czasowy/pobyt-z-rodzina/dziecko-cudzoziemca-urodzone-w-pl/\",Ea=\"https://www.zus.pl/pl/aktywnyrodzic/wiadczenie-aktywnie-w-zlobku\",Ua=[{id:\"pregnancy\",tag:\"Во время беременности\",t:\"Беременность и NFZ\",x:\"Гинеколог NFZ без направления. Выбери położna POZ заранее, она же поможет после родов.\",docs:[\"Паспорт или другой документ личности, PESEL при наличии, подтверждение права на NFZ.\",\"Karta ciąży и результаты обследований для дальнейших визитов.\"],how:[\"Проверь свой страховой статус. Бесплатная помощь иностранке без страхования не гарантирована только из-за беременности: всё зависит от основания пребывания и страховки.\",\"Запишись к гинекологу по NFZ без skierowania. Пренатальные обследования обсуждай с врачом, направление на них выдаётся по показаниям и правилам программы.\",\"Выбери położna POZ отдельной декларацией; с 21-й недели доступна бесплатная дородовая подготовка по NFZ.\"],src:[[Pa,\"pacjent.gov.pl: беременность и поłożna\"],[\"https://pacjent.gov.pl/system-opieki-zdrowotnej/jakie-sa-kompetencje-poloznej-poz\",\"pacjent.gov.pl: położna POZ\"]]},{id:\"afterbirth\",tag:\"Роддом и первые недели\",t:\"Сразу после рождения\",x:\"Получить документы из роддома, связаться с POZ и назначить первую домашнюю патронажную встречу.\",docs:[\"Książeczka zdrowia dziecka и karta informacyjna ze szpitala.\",\"Результаты скринингов, информация о прививках, документы матери.\"],how:[\"Роддом передаёт kartę urodzenia в USC. Родители не заменяют её выпиской из больницы.\",\"После выписки сообщи выбранной położna POZ: первая патронажная встреча должна состояться не позднее 48 часов после выписки, затем обычно 4–6 визитов за первые два месяца.\",\"Запиши ребёнка к врачу POZ на первый профилактический осмотр; согласуй следующие прививки. Первые дозы BCG и гепатита B обычно делают в роддоме.\"],src:[[Sa,\"gov.pl: карта рождения\"],[Pa,\"pacjent.gov.pl: визиты położnej\"],[\"https://pacjent.gov.pl/szczepienia-dzieci-pierwsze-24-miesiace-zycia\",\"pacjent.gov.pl: календарь прививок\"]]},{id:\"usc\",tag:\"До 21 дня\",t:\"USC, акт рождения и PESEL\",x:\"Регистрируй ребёнка в USC города рождения, а не города проживания. Получишь польский акт рождения и, как правило, PESEL.\",docs:[\"Документ личности родителя, который заявляет о рождении.\",\"При необходимости: иностранный акт брака/документы о семейном положении и их переводы.\",\"Если родители не в браке: uznanie ojcostwa до регистрации, чтобы отец смог заявить о рождении.\"],how:[\"Проверь, что роддом отправил kartę urodzenia. На регистрацию даётся 21 день.\",\"Заяви рождение в USC по месту родов или через gov.pl, если доступна электронная подача с подтверждением личности.\",\"Бесплатно получи один сокращённый odpis aktu urodzenia, уведомление о PESEL и, если применимо, регистрацию адреса. PESEL не равен гражданству или ВНЖ.\"],src:[[Sa,\"gov.pl: регистрация рождения\"]]},{id:\"nfz\",tag:\"После PESEL · 7 дней\",t:\"NFZ для ребёнка\",x:\"Вписать ребёнка в страховку родителя и выбрать врача, медсестру и położna POZ.\",docs:[\"PESEL ребёнка и его данные из акта рождения.\",\"Данные родителя, за счёт которого оформляется страхование; для выбора POZ нужна декларация.\"],how:[\"При umowa o pracę или zlecenie передай работодателю данные для ZUS ZCNA. При JDG подай ZCNA самостоятельно. На это 7 дней после присвоения PESEL.\",\"В отдельной placówka POZ подай декларации: lekarz POZ, pielęgniarka POZ, położna POZ. Можно выбрать не по прописке; при наличии услуги также через IKP.\",\"Убедись, что ребёнок отображается в mojeIKP. Обновление данных после ZCNA может занять до 21 дня; одного акта рождения для зачисления в NFZ недостаточно.\"],src:[[\"https://pacjent.gov.pl/aktualnosc/zglos-dziecko-do-ubezpieczenia\",\"pacjent.gov.pl: страхование ребёнка\"],[\"https://pacjent.gov.pl/system-zdrowia/podstawowa-opieka-zdrowotna\",\"pacjent.gov.pl: выбор POZ\"]]},{id:\"passport\",tag:\"Для иностранного ребёнка\",t:\"Гражданство и dokument podróży\",x:\"Польское свидетельство о рождении само по себе не заменяет национальный паспорт.\",docs:[\"Польский odpis aktu urodzenia, документы личности и гражданства родителей.\",\"Согласия и дополнительные документы для консульства по правилам государства гражданства ребёнка.\"],how:[\"Уточни в консульстве государства гражданства родителей, как оформить гражданство и первый паспорт ребёнка. Требования зависят от страны.\",\"Перед заявлением на pobyt приготовь действующий dokument podróży ребёнка либо уточни в ужонде допустимое исключение.\",\"Не планируй выезд только с PESEL, актом рождения или UPO: они не заменяют паспорт/проездной документ и право на повторный въезд.\"],src:[[\"https://www.mos.cudzoziemcy.gov.pl/kategorie-informacji/procedury/osobiste-stawiennictwo/szczegolowe-objasnienie/\",\"MOS: документ ребёнка и явка\"],[Sa,\"gov.pl: акт рождения\"]]}],La=[{id:\"citizen\",tag:\"Родитель гражданин Польши\",t:\"Ребёнок с польским гражданством\",x:\"Если один родитель был гражданином Польши в день рождения, ребёнок получает польское гражданство по происхождению. ВНЖ ему не нужен.\",docs:[\"Польский акт рождения (odpis aktu urodzenia) ребёнка и PESEL, если присвоен.\",\"Документ польского родителя, подтверждение родства; при необходимости документы второго родителя.\",\"Фотография ребёнка для dowodu или паспорта и согласие второго родителя, если требуется по процедуре.\"],how:[\"Зарегистрируй рождение в USC по месту рождения. Проверь, что в акт внесены оба родителя и признание отцовства, если оно требуется.\",\"Для dowód osobisty подай заявление через gov.pl либо в любом urząd gminy. Проверь требования к фотографии, возрасту и личному присутствию ребёнка.\",\"Для паспорта обратись в выбранный пункт паспортного обслуживания или используй доступную электронную процедуру для ребёнка. Проверь согласие родителей и оплату.\",\"Получи документ. Для ребёнка с польским гражданством заявление на pobyt через MOS не подают.\"],where:\"USC по месту рождения, затем \"+at(\"https://www.gov.pl/web/gov/uzyskaj-dowod-osobisty-dla-dziecka-lub-podopiecznego\",\"gov.pl: dowód dziecka\")+\" / \"+at(\"https://www.gov.pl/web/gov/uzyskaj-paszport-dla-dziecka\",\"gov.pl: paszport dziecka\")+\".\",src:[[\"https://api.sejm.gov.pl/eli/acts/DU/2023/1989/text.html\",\"Закон: гражданство по родителю\"],[Sa,\"gov.pl: регистрация рождения\"],[\"https://www.gov.pl/web/gov/uzyskaj-dowod-osobisty-dla-dziecka-lub-podopiecznego\",\"gov.pl: dowód\"],[\"https://www.gov.pl/web/gov/uzyskaj-paszport-dla-dziecka\",\"gov.pl: паспорт\"]]},{id:\"temporary\",tag:\"Родитель: виза D / временный ВНЖ\",t:\"Pobyt czasowy ребёнка\",x:\"Основание art. 160 pkt 2 для родившихся в Польше при визе D или выданном временном ВНЖ родителя. Важно основание родителя в день рождения и в день решения.\",docs:[\"Польский odpis aktu urodzenia ребёнка; для иностранного акта также присяжный перевод на польский.\",\"Действующий dokument podróży ребёнка (сканы для MOS, оригинал по вызову). Если получить невозможно, объясни причины и подготовь другой документ личности по указанию ужонда.\",\"Цифровая фотография ребёнка и подтверждения opłata skarbowa и оплаты карты pobytu по актуальным реквизитам воеводства.\",\"Национальная виза D родителя либо решение о выданном pobyt czasowy, действовавшие при рождении, и подтверждение того же основания на день решения.\",\"Дополнительные доказательства, запрошенные воеводой для конкретной ситуации.\"],how:[\"Проверь оба момента: день рождения и будущий день решения. Родитель должен находиться в Польше на том же основании визы D или разрешения pobyt czasowy, что действовало при рождении.\",\"Подготовь акт рождения, dokument podróży, фото и подтверждение основания родителя. Проверь реквизиты оплаты у своего воеводы.\",\"Родитель войдёт в MOS через login.gov.pl, в разделе «Konta dzieci/podopiecznych» выберет «Dodaj konto» и создаст subkonto ребёнка, затем откроет wniosek o pobyt czasowy.\",\"Заполни форму по-польски, приложи документы, подпиши и отправь через MOS. Сохрани UPO. С 27.04.2026 обычную бумажную заявку вместо MOS не принимают.\",\"Следи за запросами воеводы: родитель явится с оригиналом dokument podróży ребёнка и документами, когда получит wezwanie. Если ребёнку исполнилось 6 лет, возможна обязательная явка для отпечатков.\"],where:function(){return\"Электронно через \"+at(\"https://mos.cudzoziemcy.gov.pl\",\"MOS\")+\"; дело ведёт \"+at(pt().uwUrl,pt().uw)+\" по месту проживания. Не отправляй бумажное заявление по старым инструкциям.\"},src:[[xa,\"MOS: ребёнок, родившийся в Польше\"],[\"https://www.gov.pl/web/udsc/info-mos\",\"UdSC: новый MOS\"],[\"https://www.gov.pl/web/udsc/subkonta-dla-dzieci-i-podopiecznych-w-mos\",\"UdSC: subkonto ребёнка\"]]},{id:\"permanent\",tag:\"Родитель: ПМЖ / резидент ЕС\",t:\"Pobyt stały ребёнка\",x:\"Не автоматически. Подходит при определённых сочетаниях даты рождения и разрешения родителя, у которого уже есть ПМЖ или статус долгосрочного резидента ЕС.\",docs:[\"Акт рождения ребёнка, а если он выдан за пределами Польши, также присяжный перевод.\",\"Действующий dokument podróży ребёнка (сканы для MOS и оригинал по wezwanie). При невозможности получить документ узнай допустимую замену.\",\"Цифровая фотография по требованиям MOS, подтверждения соответствующей opłata skarbowa и оплаты карты pobytu.\",\"Копия решения родителя о pobyt stały или rezydent długoterminowy UE и, если необходимо, документы о статусе родителя в день рождения.\"],how:[\"Сверь условие: ребёнок родился после получения родителем ПМЖ/резидента ЕС либо во время действовавшего временного ВНЖ, гуманитарного/толерированного пребывания или защиты родителя, который затем получил ПМЖ/резидента ЕС.\",\"Собери акт рождения, dokument podróży и решение родителя. Если срок или статус при рождении не подходит, этот путь может быть недоступен.\",\"В MOS в разделе «Konta dzieci/podopiecznych» создай subkonto ребёнка, выбери wniosek o pobyt stały, приложи документы, подпиши электронно и сохрани UPO.\",\"При вызове воеводы принеси оригиналы. Если ребёнку исполнилось 6 лет, потребуется его присутствие при выполнении предусмотренных процедур.\",\"После положительного решения оформи карту ребёнку; сам факт ПМЖ родителя не заменяет решение для малыша.\"],where:function(){return\"Заявление через \"+at(\"https://mos.cudzoziemcy.gov.pl\",\"MOS\")+\"; рассмотрение у \"+at(pt().uwUrl,pt().uw)+\" по адресу проживания.\"},src:[[Ma,\"Поморский ужонд: условия pobyt stały ребёнка\"],[\"https://www.gov.pl/web/udsc/info-mos\",\"UdSC: электронная подача\"],[\"https://www.gov.pl/web/udsc/subkonta-dla-dzieci-i-podopiecznych-w-mos\",\"UdSC: subkonto ребёнка\"]]},{id:\"pending\",tag:\"Родитель: ждёт решение / иной статус\",t:\"Пока нет подтверждённого основания\",x:\"Штамп, UPO, PESEL или рождение в Польше сами по себе не дают ребёнку права пребывания. Это маршрут проверки, а не готовое основание для заявления.\",docs:[\"Акт рождения ребёнка и его dokument podróży, если получен; при невозможности получить документ подготовь объяснение.\",\"Паспорта родителей, подтверждение их фактического законного пребывания, решения по pobyt и UPO/документы о поданных заявлениях.\",\"Подтверждения семейной связи, совместного проживания и содержания ребёнка; дополнительные документы зависят от выбранного правового основания.\"],how:[\"Установи статусы обоих родителей именно на день рождения ребёнка и сейчас. Ожидание решения или штамп не равны действующей национальной визе D либо уже выданному pobyt czasowy.\",\"Проверь допустимый вариант: art. 187 pkt 6/7, подходящее семейное основание либо специальный режим защиты. У каждого свои условия, решение не автоматическое.\",\"Сверь основание с информацией MOS и с отделом иностранцев воеводства. До выбора конкретного основания нельзя безопасно составить универсальную заявку.\",\"После подтверждения основания подготовь требуемые приложения, создай профиль ребёнка в MOS, подай подходящий вид электронного заявления и сохрани UPO.\",\"Не планируй выезд только по свидетельству о рождении или UPO: это не заменяет dokument podróży и право на повторный въезд.\"],where:function(){return\"Уточни индивидуальное основание в \"+at(pt().uwUrl,pt().uw)+\"; после определения процедуры подавай через \"+at(\"https://mos.cudzoziemcy.gov.pl\",\"MOS\")+\". При международной защите правила могут отличаться.\"},src:[[xa,\"MOS: основания для детей\"],[\"https://www.gov.pl/web/udsc/mos-qa\",\"UdSC: вопросы MOS\"],[Ma,\"Поморский ужонд: когда ПМЖ недоступен\"]]}],Aa=[{id:\"800\",tag:\"ZUS · до 18 лет\",t:\"800+\",big:\"800\",x:\"zł в месяц на каждого ребёнка, без проверки дохода семьи.\",i:\"С июня 2026 для многих иностранцев из стран вне ЕС нужны законное пребывание с доступом к работе и подтверждённая активность; для школьников также выполнение обязанности учиться в Польше.\",docs:[\"PESEL ребёнка, PESEL заявителя (или данные личности), польский банковский счёт.\",\"Для иностранцев: документ законного пребывания и права работы; иные приложения по запросу ZUS.\"],how:[\"Подай в PUE/eZUS, mZUS, через банк или Emp@tia. На новорождённого в первые 3 месяца заявка даёт выплату с даты рождения.\",\"Укажи оба гражданства/статуса, если это требуется формой, и проверь сообщения в eZUS. Проверка занятости у ZUS имеет исключения, например отдельные случаи пособий и безработицы.\",\"Следующий период выплат обычно начинается 1 июня; на него нужна новая заявка.\"],src:[[\"https://www.zus.pl/pl/swiadczenia/swiadczenia-dla-rodzin/swiadczenie-wychowawcze-800-plus/zmiany-w-swiadczeniu-wychowawczym-program-rodzina-800-\",\"ZUS: условия для иностранцев 2026\"],[\"https://www.zus.pl/pl/swiadczenia/swiadczenia-dla-rodzin/swiadczenie-wychowawcze-800-plus\",\"ZUS: подача 800+\"]]},{id:\"work\",tag:\"Aktywny Rodzic · 12–35 мес\",t:\"Aktywni rodzice w pracy\",big:\"1 500\",x:\"zł ежемесячно; при соответствующей инвалидности ребёнка 1 900 zł.\",i:\"Если родители работают и ребёнок не посещает ясли, клуб или dzienny opiekun. Няня не обязательна.\",docs:[\"Данные ребёнка и заявителя, номер банковского счёта.\",\"Для иностранца: документ легального пребывания с доступом к рынку труда; при необходимости документы об особых обстоятельствах.\"],how:[\"Оба родителя обычно должны соответствовать нормам активности и взносов; для одинокого родителя применяется отдельный расчёт. Проверяй условия ZUS по своим договорам.\",\"Подай электронную заявку в eZUS/mZUS, банк или Emp@tia не раньше месяца, в котором ребёнку исполнится 12 месяцев.\",\"На ребёнка за тот же месяц нельзя одновременно получить два варианта Aktywny Rodzic.\"],src:[[\"https://www.zus.pl/pl/aktywnyrodzic/swiadczenie-aktywni-rodzice-w-pracy\",\"ZUS: aktywni rodzice w pracy\"]]},{id:\"nurseryPay\",tag:\"Aktywny Rodzic · ясли\",t:\"Aktywnie w żłobku\",big:\"1 500\",x:\"до 1 500 zł в месяц, до 1 900 zł при соответствующей инвалидности.\",i:\"Для ребёнка в зарегистрированных яслях, детском клубе или у дневного опекуна. Нет нижней границы 12 месяцев.\",docs:[\"PESEL ребёнка и сведения о записанной в реестр placówka.\",\"Для иностранца: документ легального пребывания с доступом к работе, если этого требует его категория.\"],how:[\"Сначала ребёнок начинает посещать placówka; заявка в eZUS/mZUS или другим электронным каналом. При подаче в течение 2 месяцев от начала посещения возможно начисление с даты начала.\",\"ZUS переводит деньги учреждению, не родителю. Питание не покрывается; сумма ограничена платой за пребывание и установленным лимитом стоимости учреждения.\",\"Выплата возможна до конца учебного года, в котором ребёнку исполнилось 3 года, при особых препятствиях с садом до 4 лет.\"],src:[[Ea,\"ZUS: aktywnie w żłobku\"]]},{id:\"home\",tag:\"Aktywny Rodzic · 12–35 мес\",t:\"Aktywnie w domu\",big:\"500\",x:\"zł в месяц на ребёнка дома с 12 до 35 месяцев.\",i:\"Без проверки занятости, но надо соответствовать условиям пребывания; не совмещается с другими выплатами программы за тот же месяц.\",docs:[\"PESEL ребёнка, данные родителя и банковский счёт.\",\"Для иностранцев: документ легального пребывания с правом работы по требованиям ZUS.\"],how:[\"Подай онлайн в eZUS/mZUS, банк или Emp@tia, начиная с месяца, в котором ребёнок достиг 12 месяцев.\",\"Право обычно с месяца подачи, поэтому не откладывай.\",\"Если на этого ребёнка уже полностью получен RKO 12 000 zł, эту выплату не назначат.\"],src:[[\"https://www.zus.pl/pl/aktywnyrodzic/wiadczenie-aktywnie-w-domu\",\"ZUS: aktywnie w domu\"]]},{id:\"dobry\",tag:\"Школа · до 30 ноября\",t:\"Dobry Start\",big:\"300\",x:\"zł раз в учебный год на школьные принадлежности.\",i:\"Для учащихся до 20 лет, при инвалидности до 24. Не выплачивается за детский сад и zerówka.\",docs:[\"PESEL ребёнка, данные школы и польский банковский счёт.\",\"Для иностранцев из стран вне ЕС: документы о законном пребывании и, где требуется, подтверждённой активности в Польше.\"],how:[\"Заявка онлайн с 1 июля по 30 ноября через eZUS/mZUS, банк или Emp@tia.\",\"Для учебного года 2026/2027 активность иностранца проверяется по правилам, близким к 800+; не все категории обязаны работать.\",\"Если началась переписка с ZUS, ответь через PUE/eZUS в установленный срок.\"],src:[[\"https://www.gov.pl/web/rodzina/zmiany-w-programie-dobry-start-obowiazujace-od-1-lipca-2026-r\",\"MRPiPS: Dobry Start 2026\"],[\"https://www.gov.pl/web/gov/skorzystaj-z-programu-dobry-start2\",\"gov.pl: заявка\"]]},{id:\"pit\",tag:\"PIT · каждый год\",t:\"Ulga na dzieci\",big:\"1 112\",x:\"1 112,04 zł в год на первого и второго, 2 000,04 на третьего, 2 700 на каждого следующего.\",i:\"Возврат/уменьшение PIT по шкале; на одного ребёнка часто есть лимит дохода родителей.\",docs:[\"PESEL ребёнка или дата рождения и данные документа (если нет PESEL).\",\"PIT-37 или PIT-36 и приложение PIT/O; сведения о доходах и числе месяцев права на льготу.\"],how:[\"В годовом PIT через Twój e-PIT или налоговую декларацию добавь ulgę prorodzinną и PIT/O.\",\"При одном ребёнке действует лимит дохода (обычно 112 000 zł для супругов вместе или одинокого родителя; для не состоящего в браке обычно 56 000 zł). На двух и более детей этот лимит не применяется.\",\"Льгота рассчитывается по месяцам; при ryczałt без доходов по шкале её не откуда вычитать.\"],src:[[\"https://podatki.gov.pl/ulgi-i-odliczenia/ulga-na-dziecko-pit\",\"podatki.gov.pl: ulga na dziecko\"]]},{id:\"becik\",tag:\"Гмина · разово\",t:\"Becikowe\",big:\"1 000\",x:\"zł один раз при рождении, с ограничением дохода семьи.\",i:\"Доход до 1 922 zł нетто на человека и наблюдение беременности не позднее 10-й недели; иностранцам важно основание пребывания.\",docs:[\"Акт рождения и PESEL ребёнка, документы личности/побыта, номер счёта.\",\"Справка от врача или поłożnej о наблюдении беременности с 10-й недели и документы о доходах семьи.\"],how:[\"Заявление в орган выплат гмины (MOPS/GOPS либо городской центр świadczeń), где живёшь, или через Emp@tia, если услуга доступна.\",\"Подай в течение 12 месяцев после рождения; при усыновлении действуют отдельные сроки.\",\"Обычный легальный въезд или любая виза не всегда достаточны для иностранца: проверь перечень разрешений и международных соглашений в официальных условиях.\"],src:[[\"https://www.gov.pl/web/gov/uzyskaj-becikowe\",\"gov.pl: becikowe\"]]},{id:\"rodz\",tag:\"Гмина · после рождения\",t:\"Świadczenie rodzicielskie\",big:\"1 000\",x:\"zł в месяц обычно 52 недели за одного ребёнка.\",i:\"Для тех, кто не получает zasiłek macierzyński или аналогичную выплату; не зависит от дохода.\",docs:[\"Акт рождения ребёнка, PESEL, документы личности/пребывания и банковский счёт.\",\"При необходимости документы об отсутствии права на пособие по материнству и подтверждения особых обстоятельств.\"],how:[\"Подай через местный орган семейных выплат или Emp@tia при доступности; чтобы начислили с месяца рождения, подай в течение 3 месяцев.\",\"Если получаешь zasiłek macierzyński, двойной выплаты нет. Для иностранцев действуют специальные категории права на świadczenia rodzinne.\",\"После 3 месяцев право обычно устанавливают с месяца обращения, а не задним числом.\"],src:[[\"https://www.gov.pl/web/gov/uzyskaj-swiadczenie-rodzicielskie\",\"gov.pl: świadczenie rodzicielskie\"]]}],Oa=[\"Заявление wniosek o wymianę zagranicznego prawa jazdy.\",\"Актуальное фото для prawa jazdy, 35 × 45 мм.\",\"Паспорт или другой документ личности и документ, подтверждающий право пребывания в Польше.\",\"Документ, подтверждающий адрес проживания или zameldowanie. Если meldunek нет, уточни альтернативу в ужонде.\",\"Иностранное водительское удостоверение и его копия; оригинал понадобится при выдаче польских прав.\",\"Присяжный перевод иностранного удостоверения, если требуется по его образцу и правилам ужонда.\",\"Подтверждение оплаты 100 zł за изготовление польских прав.\",\"Медицинское заключение, если срок иностранных прав истёк; для некоторых категорий также психологическое заключение.\"],_a=[\"Уточни, нужна ли замена: права ЕС обычно действуют без обмена; для прав вне ЕС проверь срок пребывания и соответствие международной конвенции.\",\"Собери документы, фото, копии и при необходимости перевод; уточни подтверждение права пребывания.\",\"Подай заявление в starostwo или wydział komunikacji города на правах повята по месту проживания.\",\"При нестандартном образце прав уточни, нужен ли теоретический экзамен в WORD (через PKK).\",\"Оплати изготовление, проверь статус в info-car.pl и отдай иностранные права при получении польских.\"],Ba=[\"До оплаты проверь VIN, историю, пробег и данные продавца через historiapojazdu.gov.pl; осмотри машину на диагностике.\",\"Сверь продавца с собственником в dowód rejestracyjny. Если владельцев было несколько, проверь цепочку договоров и отсутствие залога.\",\"Подпиши umowa kupna-sprzedaży (или получи faktura VAT/VAT-marża). Укажи стороны, дату, цену, VIN, регистрационный номер, пробег и дефекты.\",\"Получи от продавца ключи, dowód rejestracyjny, действующую информацию о OC и все документы автомобиля; проверь срок technicznego.\",\"Проверь страхование OC без разрыва, рассчитай PCC при частной продаже и подай заявление на регистрацию в срок.\"],Ta=[\"Определи сценарий: новый из польского салона регистрируется до выезда; купленный в Польше подержанный обычно требует заявления в течение 30 дней.\",\"Обеспечь OC, проверь действительность техосмотра для подержанной машины; при ввозе сначала урегулируй налоги и таможню.\",\"Собери заявление и документы собственности, документы автомобиля, подходящие справки и квитанции.\",\"Подай wniosek o rejestrację в wydział komunikacji по месту проживания; при нескольких владельцах нужны все или доверенность.\",\"Получи временную регистрацию и номера при необходимости; затем забери постоянный dowód rejestracyjny.\"],Da=[\"Заполненное заявление wniosek o rejestrację pojazdu.\",\"Паспорт или другой документ личности; доверенность, если документы подаёт представитель.\",\"Договор покупки / faktura VAT / faktura VAT-marża; при цепочке продаж приложи предыдущие документы собственности.\",\"Если машина уже была зарегистрирована: dowód rejestracyjny и прежние номера, если они есть и их нужно предъявить; при отсутствии иностранных номеров по правилам допускается заявление.\",\"Для подержанного авто: действующий техосмотр в dowód или справка о положительном badanie techniczne, если нужен новый.\",\"Для нового авто: świadectwo zgodności (CoC) и данные для регистрации, предоставляемые производителем/салоном.\",\"Подтверждения госпошлин/сборов за регистрацию; OC должно действовать.\",\"Для ввезённого авто: подтверждение akcyza или освобождения, иностранные документы/переводы, таможенная декларация из-за пределов ЕС по ситуации.\"],Na={gdansk:[\"Urząd Miejski w Gdańsku, Wydział Komunikacji\",\"ul. Milskiego 1, Gdańsk\",\"https://media.gdansk.pl/komunikaty/637499/nowy-zespol-obslugi-mieszkancow-gotowy-na-przyjecie-klientow\"],gdynia:[\"Urząd Miasta Gdyni, Wydział Spraw Obywatelskich\",\"al. Marszałka Piłsudskiego 52/54, Gdynia\",\"https://cyfrowyurzad.um.gdynia.pl/cu/Service/getServiceCard/id,31.html\"]},Za=85528,Ia={2026:[[12e4,.12],[1/0,.32]],2027:[[13e4,.12],[15e
