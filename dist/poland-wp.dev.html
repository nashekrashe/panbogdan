<style>
/* pasha.by/poland v2 · light only, like the site. Full-bleed bands, --g gutter, Nunito Sans + Material Symbols Rounded 300 */
.pl{--ink:#141414;--paper:#fff;--red:#fd2222;--line:#ddd;--soft:#e7ebef;--chip:#e0e5ea;--mut:#6b6f76;--tint:#fafbfc;--fill:#f1f1f1;
--c-legal:#fd2222;--c-money:#00A86B;--c-life:#9747FF;--c-auto:#FFB000;--c-svoi:#3D5AFE;--c-dict:#141414;--c-lyr:#141414;
--ok:#00875A;--warn:#B25E00;--bad:#d11a1a;
--g:clamp(20px,4.45vw,112px);--font:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Bebas Neue','Nunito Sans',system-ui,sans-serif;
font-family:var(--font);color:var(--ink);background:var(--paper);font-size:clamp(16px,1.1vw,20px);line-height:1.5;
width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);overflow-x:clip;-webkit-font-smoothing:antialiased}
.pl *,.pl *::before,.pl *::after{box-sizing:border-box}
.pl :where(h1,h2,h3,h4,p,ul,ol,li,figure,dl,dd){margin:0;padding:0}
.pl :where(ul,ol){list-style:none}
.pl a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
.pl a:hover{color:var(--red)}
.pl :where(button,input,select){font:inherit;color:inherit;letter-spacing:normal;text-transform:none;box-shadow:none}
.pl :where(button){cursor:pointer;background:none;border:0;padding:0;line-height:1.2}
.pl :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
body:has(.pl){overflow-x:clip}
body:has(.pl) .cs-entry__header,body:has(.pl) .cs-page__header{display:none}
.pl .ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;flex:0 0 auto;user-select:none}
.pl.pl-noicons .ms{display:none}
.pl [hidden]{display:none!important}
.pl .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bands */
.pl-band{padding-block:clamp(48px,5vw,120px);padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px));scroll-margin-top:64px}
.pl-band+.pl-band{border-top:1px solid var(--line)}
.pl-dark{background:#000;color:#fff;--ink:#fff;--paper:#000;--line:#2e2e2e;--soft:#2e2e2e;--chip:#3a3a3a;--mut:#a9adb3;--tint:#0f0f0f;--fill:#1c1c1c}
.pl-dark+.pl-band{border-top:0}
.pl-eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pl-muted{color:var(--mut)}
.pl-small{font-size:14px}
.pl-xs{font-size:12px}
.pl-num{font-variant-numeric:tabular-nums}

/* sticky bar */
.pl-bar{position:sticky;top:var(--pl-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.pl-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.pl-nav::-webkit-scrollbar{display:none}
.pl-nav a{flex:0 0 auto;text-decoration:none;height:32px;padding:0 12px 0 4px;border-radius:16px;border:.75px solid var(--chip);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.pl-nav a[aria-current=true]{background:#000;border-color:#000;color:#fff}
.pl-dot{width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.pl-dot .ms{font-size:16px}
.pl-lvl{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-size:12px;cursor:default}
.pl-lvl-t b{font-weight:700;font-size:13px}
.pl-lvl-s{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.pl-lvl-s li{margin:0;padding:0}
.pl-lvl-s i{display:block;width:12px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pl-lvl-s i b{display:block;width:0;height:100%;background:var(--red);transition:width .4s}
.pl-lvl-p{font-family:var(--num);font-size:20px;font-weight:400;letter-spacing:.02em;line-height:1;min-width:2.2em;text-align:right}
@media (max-width:767px){.pl-lvl .pl-lvl-t{display:none}.pl-bar{gap:10px}.pl-lvl-s i{width:8px}}

/* hero */
.pl-h1{margin-top:12px;font-weight:700;font-size:clamp(56px,9vw,220px);line-height:.9;letter-spacing:-.05em;text-wrap:balance}
.pl-intro{margin-top:24px;max-width:20em;font-weight:200;font-size:clamp(28px,3.06vw,72px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.pl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pl-chip{height:32px;padding:0 12px;border-radius:6px;border:.75px solid var(--chip);background:var(--paper);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pl-chip[aria-pressed=true]{background:#000;border-color:#000;color:#fff}
.pl-geo{border-style:dashed}
.pl-geo:hover{border-color:var(--ink)}
.pl-geo[aria-busy=true]{opacity:.6;cursor:progress}
#pl-geo-msg:empty{display:none}
.pl-dark .pl-chip[aria-pressed=true]{background:#fff;border-color:#fff;color:#000}
.pl-setup{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 48px;align-items:start}
.pl-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.pl-input{height:40px;border:1px solid #d5d9de;border-radius:8px;padding:0 12px;background:var(--paper);font-size:16px;min-width:0;width:100%;max-width:280px}
.pl-input:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.pl-input.pl-sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.pl-next{border:1px solid var(--soft);background:var(--tint);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pl-next li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.pl-next li .ms{color:var(--red);margin-top:1px}

/* counters (life-counter) */
.pl-count-h{padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700}
.pl-counts{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px 48px;align-items:start}
.pl-counts>div{min-width:0}
.pl-big{display:inline-block;font-family:var(--num);font-size:clamp(56px,7.5vw,200px);line-height:.84;letter-spacing:.005em;font-variant-numeric:tabular-nums;font-weight:400;white-space:nowrap}
.pl-counts>div>.pl-lab{display:block}
.pl-lab{margin-top:12px;font-size:14px;font-weight:700;max-width:240px}
.pl-sub{margin-top:4px;font-size:12px;color:var(--mut);max-width:240px}
.pl-me{margin-top:48px;display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-end}
.pl-me{justify-content:flex-start;gap:28px 64px}
.pl-me>p{grid-column:1/-1}
@media (max-width:767px){.pl-counts{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 20px}.pl-big{font-size:clamp(36px,11vw,96px)}}

/* badges */
.pl-badges{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px}
.pl-badge{width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pl-badge span.c{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;border:1.5px dashed #c9cfd6;color:#9aa0a6}
.pl-badge span.c .ms{font-size:24px}
.pl-badge.on span.c{border:0;background:var(--red);color:#fff}
.pl-badge.on span.c .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.pl-badge small{font-size:11px;font-weight:700;line-height:1.2;color:var(--mut)}
.pl-badge.on small{color:var(--ink)}

/* section head */
.pl-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.pl-head>div{display:flex;align-items:center;gap:18px;min-width:0}
.pl-sico{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;flex:0 0 56px;color:#fff}
.pl-sico .ms{font-size:30px}
.pl-h2{font-weight:700;font-size:clamp(40px,5.56vw,128px);line-height:1;letter-spacing:-.05em;text-wrap:balance}
.pl-lead{margin-top:24px;max-width:26em;font-weight:200;font-size:clamp(22px,1.9vw,40px);line-height:1.2;text-wrap:balance}

/* segmented tabs */
.pl-seg{margin-top:32px;display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:8px;border:.75px solid var(--chip);background:var(--paper);max-width:100%}
.pl-seg button{min-height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:8px}
.pl-seg button[aria-selected=true],.pl-seg button[aria-pressed=true]{background:#000;color:#fff}
.pl-dark .pl-seg button[aria-selected=true],.pl-dark .pl-seg button[aria-pressed=true]{background:#fff;color:#000}
.pl-cnt{font-size:9px;font-weight:700;min-width:16px;height:16px;padding:0 4px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--fill);color:var(--ink)}
.pl-seg button[aria-selected=true] .pl-cnt{background:#fff;color:#000}

/* news */
.pl-news{margin-top:36px;border-top:1px solid var(--line)}
.pl-news li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.pl-news time{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:2px}
.pl-news p{font-size:16px}
.pl-news .src{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--mut);margin-left:6px;white-space:nowrap}
.pl-news .src .ms{font-size:14px}
.pl-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--fill);color:var(--ink);margin-right:8px;vertical-align:1px}
.pl-tag.red{background:#ffe5e5;color:#b00000}
.pl-dark .pl-tag{background:#2a2a2a;color:#fff}
@media (max-width:600px){.pl-news li{grid-template-columns:1fr}}

/* layout: side + main */
.pl-split{margin-top:36px;display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start}
.pl-side{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px}
.pl-main{flex:999 1 560px;min-width:0}
.pl-side .t{font-size:clamp(28px,2.4vw,48px);font-weight:700;line-height:1.05;letter-spacing:-.04em;text-wrap:balance}
.pl-side .s{font-weight:200;font-size:clamp(20px,1.6vw,30px);line-height:1.2}
.pl-side .i{font-size:15px;color:var(--mut);font-style:italic}
.pl-fees{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pl-fee{height:26px;padding:0 9px;border-radius:6px;border:.75px solid var(--chip);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pl-fee span{color:var(--mut);font-weight:400}

/* accordions / steps */
.pl-acc{border-top:1px solid var(--line)}
.pl-acc>details,.pl-acc>.pl-step{border-bottom:1px solid var(--line)}
.pl-acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 0;min-height:56px}
.pl-acc summary::-webkit-details-marker{display:none}
.pl-acc summary .t{flex:1 1 auto;min-width:0;font-size:clamp(17px,1.3vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.pl-acc summary .t small{display:block;font-size:13px;font-weight:400;letter-spacing:0;color:var(--mut);margin-top:2px}
.pl-acc summary .chev{font-size:24px;color:var(--mut);transition:transform .2s}
.pl-acc details[open]>summary .chev{transform:rotate(180deg)}
.pl-acc summary:hover .t{color:var(--red)}
.pl-acc .body{padding:0 0 24px 38px;display:flex;flex-direction:column;gap:14px;max-width:68ch}
.pl-acc .body.wide{max-width:none}
.pl-acc .lead-ico{color:var(--mut);font-size:24px}
.pl-step{display:flex;gap:4px;align-items:flex-start}
.pl-step details{flex:1 1 auto;min-width:0}
.pl-step .body{padding-left:0}
.pl-chk{width:44px;height:44px;margin:6px 0 0 -13px;flex:0 0 44px;display:flex;align-items:center;justify-content:center}
.pl-box{display:block;width:18px;height:18px;border-radius:2.5px;background:var(--paper);box-shadow:inset 0 0 0 .75px #c9cfd6}
.pl-st{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.pl-step.prog .pl-st,.pl-step.done .pl-st{color:var(--red)}
.pl-step.done summary .t{color:var(--mut)}
.pl-step .n{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:400;margin-right:8px}

/* checklists */
.pl-checks{display:flex;flex-direction:column;gap:2px}
.pl-check{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:15px}
.pl-check input{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:18px;height:18px;flex:0 0 18px;border-radius:2.5px;box-shadow:inset 0 0 0 .75px #c9cfd6;background:var(--paper);cursor:pointer;display:grid;place-content:center}
.pl-check input:checked{background:var(--red);box-shadow:none}
.pl-check input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.pl-check input:checked+span{color:var(--mut);text-decoration:line-through;text-decoration-color:#c9cfd6}
.pl-note{font-size:14px;color:var(--mut)}
.pl-tip{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:12px 14px;border-radius:10px;background:#fff6e5;color:#4a3300}
.pl-tip .ms{color:#B25E00}
.pl-dark .pl-tip{background:#2a2112;color:#ffe2b0}
.pl-tip.red{background:#ffeeee;color:#5a0000}
.pl-tip.red .ms{color:var(--red)}
.pl-list{display:flex;flex-direction:column;gap:6px;font-size:15px}
.pl-list li{display:flex;gap:10px;align-items:baseline}
.pl-list li::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:4px;background:var(--dotc,var(--red));box-shadow:0 0 0 1.5px var(--paper);position:relative;top:-1px}

/* tool boxes */
.pl-tool{margin-top:28px;padding:clamp(20px,2vw,32px);border:1px solid var(--soft);background:var(--tint);border-radius:16px;display:flex;flex-direction:column;gap:20px}
.pl-tool-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.pl-tool-h .ms{font-size:24px}
.pl-fields{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.pl-fields .pl-field{flex:0 1 220px}
.pl-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px 40px;align-items:start}
.pl-out>div{min-width:0}
.pl-out .v{display:inline-block;font-family:var(--num);font-size:clamp(56px,6vw,150px);font-weight:400;line-height:.84;letter-spacing:.005em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-out .k{font-size:13px;font-weight:700;margin-top:8px}
.pl-out .d{font-size:12px;color:var(--mut)}
.pl-prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;position:relative}
.pl-prog i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:4px;transition:width .3s}
.pl-prog.ok i{background:var(--ok)}.pl-prog.warn i{background:#E08A00}
.pl-msg{font-size:15px;font-weight:700}
.pl-rows{display:flex;flex-direction:column;border-top:1px solid var(--soft)}
.pl-rows div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:15px}
.pl-rows b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pl-rows .tot{font-size:17px}
.pl-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px 40px;align-items:start}
.pl-cols .pl-eyebrow{margin-bottom:8px}
.pl-tool .pl-seg{margin-top:8px;align-self:flex-start}
.pl-rows [hidden]{display:none}
.pl-toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.pl-toggle input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:#d5d9de;position:relative;cursor:pointer;margin:0;flex:0 0 34px;transition:background .2s}
.pl-toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .2s}
.pl-toggle input:checked{background:#000}
.pl-toggle input:checked::after{transform:translateX(14px)}
.pl-btn{height:36px;padding:0 14px;border-radius:8px;border:.75px solid var(--chip);background:var(--paper);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pl-btn:hover{border-color:var(--ink)}
.pl-btn.dark{background:#000;color:#fff;border-color:#000}
.pl-trips{display:flex;flex-direction:column;gap:8px}
.pl-trip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pl-trip .pl-input{width:160px}
.pl-trip .len{font-size:13px;font-variant-numeric:tabular-nums;min-width:70px;color:var(--mut)}
.pl-ib{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}
.pl-ib:hover{color:var(--red);background:var(--fill)}
.pl-status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700}
.pl-status.ok{background:#e3f6ee;color:#005c3d}.pl-status.warn{background:#fff1d6;color:#7a4100}.pl-status.bad{background:#ffe5e5;color:#9e0000}
.pl-status .ms{font-size:16px}

/* cards */
.pl-cards{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.pl-card{padding:22px;border:1px solid var(--soft);border-radius:16px;background:var(--paper);display:flex;flex-direction:column;gap:10px;min-width:0}
.pl-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl-card .cico{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pl-card .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pl-card .t{font-size:19px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.pl-card .big{align-self:flex-start;display:inline-block;font-family:var(--num);font-size:clamp(56px,6vw,120px);font-weight:400;line-height:.84;letter-spacing:.005em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-card .big.txt{font-family:var(--font);font-size:clamp(28px,2.4vw,44px);font-weight:700;line-height:1;letter-spacing:-.02em;white-space:normal}
.pl-card .x{font-size:15px}
.pl-card .i{font-size:14px;color:var(--mut);font-style:italic}
.pl-card details{border-top:1px solid var(--soft);margin-top:4px}
.pl-card details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding-top:10px;font-size:13px;font-weight:700}
.pl-card details summary::-webkit-details-marker{display:none}
.pl-card details[open] summary .ms{transform:rotate(180deg)}
.pl-card details .pl-list{margin-top:10px;font-size:14px}
.pl-lvlcard{position:relative}
.pl-lvlcard.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pl-here{position:absolute;top:-10px;left:18px;height:20px;padding:0 8px;border-radius:6px;background:#000;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center}

/* deadlines */
.pl-dl{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.pl-dl>div{padding-top:14px;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:4px}
.pl-dl .v{align-self:flex-start;display:inline-block;font-family:var(--num);font-size:clamp(56px,6vw,150px);font-weight:400;line-height:.84;letter-spacing:.005em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-dl .k{font-size:14px;font-weight:700}

/* links, help, dict, posts */
.pl-links{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pl-link{text-decoration:none;padding:18px;border:1px solid var(--soft);border-radius:16px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.pl-link:hover{border-color:var(--ink);color:var(--ink)}
.pl-link .li{width:44px;height:44px;flex:0 0 44px;border-radius:22px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center}
.pl-link .li .ms{font-size:22px}
.pl-link .c{display:flex;flex-direction:column;gap:3px;min-width:0}
.pl-link .c b{font-weight:700;overflow-wrap:anywhere}
.pl-link .c span{font-size:14px;color:var(--mut)}
.pl-link .c em{font-style:normal;font-size:12px;color:var(--mut)}
.pl-dict-tools{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pl-dict-tools .pl-input{max-width:360px}
.pl-dict{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 40px}
.pl-dict div{padding:14px 0;border-top:1px solid var(--line);min-width:0}
.pl-dict dt{font-weight:700}
.pl-dict dt span{font-weight:400;color:var(--mut);font-size:14px}
.pl-dict dd{font-size:15px;margin-top:2px}
.pl-posts{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px}
@media (min-width:640px){.pl-posts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.pl-posts{grid-template-columns:repeat(5,minmax(0,1fr))}}
.pl-post{text-decoration:none;display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:14px;border-top:2px solid var(--ink)}
.pl-post b{font-size:17px;font-weight:400;line-height:1.25}
.pl-post:hover b{color:var(--red)}
.pl-sources{margin-top:8px}
.pl-sources .pl-list{columns:2 320px;display:block}
.pl-sources .pl-list li{break-inside:avoid;margin-bottom:6px;font-size:13px}
.pl-foot{padding-block:32px 56px;padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.pl *{transition:none!important;scroll-behavior:auto!important}}

@media (max-width:767px){
.pl-badges{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(var(--g),env(safe-area-inset-left,0px)));padding-inline:max(var(--g),env(safe-area-inset-left,0px))}
.pl-badges::-webkit-scrollbar{display:none}
.pl-badge{flex:0 0 76px;width:76px}
.pl-seg{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
.pl-seg::-webkit-scrollbar{display:none}
.pl-seg button{flex:0 0 auto}
.pl-seg button{padding:0 10px}
.pl-acc .body{padding-left:0}
.pl-tool .pl-input{max-width:none}
.pl-fields .pl-field{flex:1 1 100%}
}

.pl-date{position:relative;display:flex;align-items:center;width:100%;max-width:280px}
.pl-date .pl-input{padding-right:44px;max-width:none;font-variant-numeric:tabular-nums}
.pl-date-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;color:var(--mut);pointer-events:none}
.pl-date .pl-input[aria-expanded=true]{border-color:var(--ink)}
.pl-date .pl-input[readonly]{cursor:pointer}
.pl-input[aria-invalid=true]{border-color:var(--bad)}
.pl-trip .pl-date{width:176px}
.pl-trip .pl-date .pl-input{width:100%}
@media (max-width:767px){.pl-tool .pl-date{max-width:none}.pl-trip .pl-date{width:calc(50% - 30px)}}

  /* ---------- compute & update ---------- */
  function r2(x) { return Math.round(x * 100) / 100; }
  function annPV(pay, rate, months) { var r = rate / 1200; return r ? pay * (1 - Math.pow(1 + r, -months)) / r : pay * months; }
  function annPay(loan, rate, months) { var r = rate / 1200; return r ? loan * r / (1 - Math.pow(1 + r, -months)) : loan / months; }
  function mortCap(inc, adults, kids, debt, lim, rate, years, m) {
    var t = Math.min(1, Math.max(0, (inc - 5000) / 2000)), cap = m.c0 + (m.c1 - m.c0) * t;
    var live = m.a + m.b * (adults - 1) + m.c * kids;
    var pay = Math.max(0, Math.min(cap * inc, inc - live) - debt - lim * m.lim);
    return { pay: pay, live: live, cap: cap, loan: Math.floor(annPV(pay, rate + MORT_BUF, Math.min(years, 25) * 12) / 1000) * 1000 };
  }
  var YOUNG_MAX = 85528;
  /* umowa o pracę: ZUS 13,71%, health 9%, KUP 250 or 300 zł, PIT 12% minus 300 zł with PIT-2 */
  function netto(b, u26, k300, pit2) {
    var soc = r2(b * 0.0976) + r2(b * 0.015) + r2(b * 0.0245);
    var hea = r2((b - soc) * 0.09);
    var base = Math.round(b - soc - (k300 ? 300 : 250));
    var pit = u26 && b * 12 <= YOUNG_MAX ? 0 : Math.max(0, Math.round(base * 0.12 - (pit2 ? 300 : 0)));
    return { soc: soc, hea: hea, pit: pit, net: r2(b - soc - hea - pit), emp: r2(b * 1.2048) };
  }
  /* umowa zlecenie with a company: ZUS 11,26% (+2,45% voluntary chorobowe), health 9%, KUP 20%; a student under 26 pays no ZUS */
  function zlecenie(b, u26, stud, chor, pit2) {
    var soc = stud ? 0 : r2(b * 0.0976) + r2(b * 0.015) + (chor ? r2(b * 0.0245) : 0);
    var hea = stud ? 0 : r2((b - soc) * 0.09);
    var base = Math.round(b - soc - r2((b - soc) * 0.2));
    var pit = (u26 || stud) && b * 12 <= YOUNG_MAX ? 0 : Math.max(0, Math.round(base * 0.12 - (pit2 ? 300 : 0)));
    var emp = stud ? b : r2(b + r2(b * 0.0976) + r2(b * 0.065) + r2(b * 0.0167) + (b >= 4806 ? r2(b * 0.0245) : 0) + r2(b * 0.001));
    return { soc: soc, hea: hea, pit: pit, net: r2(b - soc - hea - pit), emp: emp };
  }
  /* umowa o dzieło: no ZUS, KUP 20% or 50% for copyright, PIT 12%; up to 200 zł a flat 12% */
  function dzielo(b, aut) {
    var pit = b <= 200 ? Math.round(b * 0.12) : Math.round(Math.round(b - r2(b * (aut ? 0.5 : 0.2))) * 0.12);
    return { soc: null, hea: null, pit: pit, net: r2(b - pit), emp: b };
  }
  /* B2B, an average month: social ZUS by level, health by tax form, tax per year divided by 12 */
  function b2b(rev, cost, taxf, rate, zl, chor) {
    var soc = r2(ZUS_SOC[zl][0] + (chor && zl !== 'start' ? ZUS_SOC[zl][1] : 0));
    var inc = Math.max(0, rev - cost - soc), hea, tax;
    if (taxf === 'rycz') {
      hea = RYCZ_HEA.filter(function (x) { return rev * 12 <= x[0]; })[0][1];
      tax = Math.max(0, Math.round((rev - soc - hea / 2) * rate / 100));
    } else if (taxf === 'lin') {
      hea = Math.max(HEA_MIN, r2(inc * 0.049));
      tax = Math.max(0, Math.round((inc - Math.min(hea, LIN_HEA_YEAR / 12)) * 0.19));
    } else {
      hea = Math.max(HEA_MIN, r2(inc * 0.09));

  function zusLevel() {

    if (!fromCal && cal && calFor === el.id && !cal.isDestroyed && cal.visible) {
      /* typing: show the typed date in the open calendar, keep it open */
      var dd = calDate(el.value), ac = cal.opts.autoClose;
      try { cal.opts.autoClose = false; if (dd) { cal.selectDate(dd, { silent: true }); cal.setViewDate(dd); } else if (!el.value) cal.clear({ silent: true }); } catch (e) {}
      cal.opts.autoClose = ac;
    }
  }
  root.addEventListener('input', function (e) {
    var el = e.target;
    if (el.matches('[data-date]')) { onDate(el, /^delete/.test(e.inputType || '')); return; }
    if (el.matches('[data-f]') && el.type !== 'checkbox' && el.tagName !== 'SELECT') { setField(el, true); updateTools(); updateProgress(); }
    else if (el.matches('[data-trip]')) { var tr = S.trips[+el.getAttribute('data-trip')]; if (tr) { tr[el.getAttribute('data-k')] = el.value; save(); updateTools(); } }
    else if (el.id === 'pl-dict-q') {
      var q = el.value.trim().toLowerCase(), n = 0;
      $$('[data-dict]').forEach(function (it) { var hit = !q || it.getAttribute('data-dict').indexOf(q) > -1; it.hidden = !hit; if (hit) n++; });
      out('dictN', q ? n + ' из ' + DICT.length : '');
    }
  });
  root.addEventListener('change', function (e) {
    var el = e.target;
    if (el.matches('[data-city-sel]')) { if (!CITIES[el.value]) return; S.city = el.value; S.geo = null; S.cityManual = true; geoErr = ''; save(); render(); var ns = $('#pl-city'); if (ns) ns.focus({ preventScroll: true }); return; }
    if (el.matches('[data-pmzh-path]')) { S.pmzhPath = el.value; save(); render(); var ps = $('#pl-pmzh-path'); if (ps) ps.focus({ preventScroll: true }); return; }
    if (el.matches('[data-mypath]')) { S.myPath = el.checked; save(); updatePath(); updateProgress(); return; }
    if (el.matches('[data-check]')) { S.checks[el.getAttribute('data-check')] = el.checked; save(); updateProgress(); }
    else if (el.matches('[data-f]:not([data-date])')) { var k = el.getAttribute('data-f'); if (el.type === 'checkbox' || el.tagName === 'SELECT') { S.f[k] = el.type === 'checkbox' ? el.checked : el.value; save(); } else setField(el, false); updateTools(); updateProgress(); }
  });

  /* scrollspy */
  var io;
  function spy() {
    if (!('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return;
        var id = en.target.id;
        $$('[data-nav]').forEach(function (a) { var on = a.getAttribute('data-nav') === id; a.setAttribute('aria-current', String(on)); if (on) { var nav = a.parentNode; if (nav.scrollTo) nav.scrollTo({ left: Math.max(0, a.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft - 24), behavior: 'smooth' }); } });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    SECTIONS.forEach(function (s) { var el = document.getElementById(s.id); if (el) io.observe(el); });
  }

  /* icon font guard: hide ligature text if the font cannot load */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('20px "Material Symbols Rounded"', 'check').then(function (f) { if (!f || !f.length) root.classList.add('pl-noicons'); }, function () { root.classList.add('pl-noicons'); });
  }

  /* the site logo on this page: a random line instead of pasha.by */
  var PHRASES = ['Дом там, где жабка', 'Из Минска в ZUS', 'Утром PESEL, вечером стулья', 'PESEL есть, счастья нет', 'Уровень польского: Żabka B2', 'Wszystko rozumiem ale nic nie mogę powiedzieć', 'Польша дала мне второй ZUS', 'Интегрировался. Ненавижу соседей.',
    'Promocja, paragon, przepraszam', 'Польский B2, пока не надо звонить', 'Rozumiem wszystko, говорю едва. Мой уровень жабка B2', 'Brakuje jednego dokumentu', 'Хот-дог за жабсы, чайник на раты',
    'В дымном плену, в угаре пьяном. Жизнь моя пошла по Касторамам', 'Стою в очереди в Хлеб и Вино', 'Umieść artykuł w strefie pakowania', 'Polski 50cent — fifty groszy. Butelkę kaucyjną, poproszę',
    'Znalazłem puszki, оказалось не те. Бутылочку не выбрасывай-те', 'Свобода есть. Парковки нет.', 'У меня всё есть. Na raty'];
  var phraseNow = -1;
  function nextPhrase() { var i; do { i = Math.floor(Math.random() * PHRASES.length); } while (PHRASES.length > 1 && i === phraseNow); phraseNow = i; return PHRASES[i]; }
  /* the site logo on this page becomes a phrase about emigrant life in Poland; a click shows another one */
  function brandPhrase() {
    Array.prototype.forEach.call(document.querySelectorAll('.cs-header .cs-header__logo, [data-pl-logo]'), function (a) {
      if (a.getAttribute('data-pl-brand')) return;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pashaby-phrase'; b.title = 'Ещё фраза';
      b.innerHTML = '<span class="pashaby-q" aria-hidden="true">format_quote</span><span class="pashaby-t" aria-live="polite"></span>';
      var t = b.querySelector('.pashaby-t'); t.textContent = nextPhrase();
      b.addEventListener('click', function () {
        t.classList.add('out');
        setTimeout(function () { t.textContent = nextPhrase(); fitPhrase(t); t.classList.remove('out'); }, 160);
      });
      var w = document.createElement('div'); w.className = 'pashaby-brand'; w.setAttribute('data-pl-brand', '1'); w.appendChild(b);
      a.parentNode.replaceChild(w, a);
      fitPhrase(t);
    });
  }
  /* one line always: a long phrase gets a smaller font instead of a second line, so the header never changes height */
  function fitPhrase(t) {
    t.style.fontSize = '';
    var w = t.clientWidth; if (!w || t.scrollWidth <= w) return;
    var size = parseFloat(getComputedStyle(t).fontSize), min = 9;
    for (var i = 0; i < 4 && t.scrollWidth > w && size > min; i++) {
      size = Math.max(min, Math.floor(size * w / t.scrollWidth * 10) / 10 - (i ? .5 : 0));
      t.style.fontSize = size + 'px';
    }
  }
  function fitPhrases() { Array.prototype.forEach.call(document.querySelectorAll('.pashaby-t'), fitPhrase); }
  try {
    brandPhrase();
    var fitRaf = 0;
    window.addEventListener('resize', function () { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitPhrases); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPhrases);
  } catch (e) {}

  /* Fuel: EU Weekly Oil Bulletin for Poland through the site's own endpoint (a WordPress snippet fetches it weekly and converts EUR to PLN at the NBP rate).
     Until the endpoint answers, or where it does not exist (preview), the last bulletin checked by hand is shown with its date */
  var FUEL_FALLBACK = { date: '2026-10-26', pb95: 6.46, on: 7.84, lpg: 3.58, rate: 4.4026 };
  var FUEL = null;
  function fuelApi() { var l = document.querySelector('link[rel="https://api.w.org/"]'); return l && l.href ? l.href.replace(/\/?$/, '/') + 'pashaby/v1/fuel' : ''; }
  function updateFuel() {
    var f = FUEL || FUEL_FALLBACK, d = String(f.date || '').split('-').reverse().join('.');
    if (f.pb95) $$('[data-f="price"]').forEach(function (x) { x.placeholder = f.pb95.toFixed(2); });
    out('fuelPb', f.pb95 ? z2(f.pb95) : '—'); out('fuelOn', f.on ? z2(f.on) : '—'); out('fuelLpg', f.lpg ? z2(f.lpg) : '—');
    out('fuelNote', 'Еврокомиссия, ' + link('https://energy.ec.europa.eu/data-and-analysis/weekly-oil-bulletin_en', 'Weekly Oil Bulletin') + ', цены на ' + d + '. Из евро в злотые по курсу NBP ' + String(f.rate).replace('.', ',') + '.');
    if (!S.f.priceManual && f.pb95) {
      var v = f.pb95.toFixed(2);
      if (S.f.price !== v) { S.f.price = v; save(); $$('[data-f="price"]').forEach(function (x) { if (x !== document.activeElement || x.value !== '') x.value = v; }); }
      out('priceNote', 'В поле средняя цена PB 95 по Польше на ' + d + '. Поменяй на свою.');
    } else if (S.f.priceManual) out('priceNote', 'Цена твоя. Средняя по Польше выше, в блоке топлива.');
    updateTools();
  }
  function loadFuel() {
    var u = fuelApi(); if (!u || !window.fetch) return;
    fetch(u, { credentials: 'omit' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && d.pb95 > 0 && /^\d{4}-\d{2}-\d{2}$/.test(d.date || '') && d.rate > 0) { FUEL = d; updateFuel(); }
    }).catch(function () {});
  }

  render();
  loadFuel();

  /* auto: if the visitor already allowed location for this site and never picked a city by hand */
  if (!S.cityManual && navigator.permissions && navigator.permissions.query) {
    try {
      navigator.permissions.query({ name: 'geolocation' }).then(function (st) { if (st && st.state === 'granted') locate(true); }, function () {});
    } catch (e) {}
  }
})();

</script>
